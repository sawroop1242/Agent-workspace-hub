[package]
name = "agent-workspace-hub"
version = "0.1.0"
edition = "2021"
description = "Agent Workspace Hub — portable project context, memory, tasks, skills, plugins and MCP"
license = "MIT"

[[bin]]
name = "awh"
path = "src/main.rs"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
tempfile = "3"
