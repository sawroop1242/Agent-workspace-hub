[package]
name = "agent-workspace-hub"
version = "0.1.0"
edition = "2021"
description = "Agent Workspace Hub — portable project context, memory, tasks, skills, plugins and MCP"
license = "MIT"

[[bin]]
name = "awh"
path = "src/main.rs"

[dependencies]
anyhow = "1"
async-trait = "0.1"
axum = { version = "0.8", features = ["tokio", "http1", "json", "matched-path", "query", "original-uri", "macros"] }
chrono = { version = "0.4", features = ["clock", "serde"] }
clap = { version = "4", features = ["derive"] }
dirs = "5"
futures-util = "0.3"
mime = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
tempfile = "3"
thiserror = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs", "sync", "process", "time", "io-util", "io-std", "net", "signal"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio-stream = { version = "0.1", features = ["sync", "net"] }
tokio-util = "0.7"
tower-http = { version = "0.6", features = ["cors", "limit", "timeout", "trace", "request-id", "catch-panic"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[dev-dependencies]
proptest = "1"
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
