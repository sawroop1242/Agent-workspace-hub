name: AWH Review Fix Loop

on:
  repository_dispatch:
    types: [awh.review-complete]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: awh-review-fix-${{ github.event.client_payload.pr_number }}
  cancel-in-progress: false

jobs:
  fix:
    if: github.event.client_payload.review_state == 'CHANGES_REQUIRED'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.AWH_AUTOMATION_TOKEN }}
      PR: ${{ github.event.client_payload.pr_number }}
      FEATURE_ID: ${{ github.event.client_payload.feature_id }}
      REVIEW: ${{ github.event.client_payload.review }}
      EVENT_OPERATION_ID: ${{ github.event.client_payload.operation_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rust
          fetch-depth: 0
          token: ${{ secrets.AWH_AUTOMATION_TOKEN }}

      - name: Sync checkpoint from the shared branch
        run: python scripts/safe_git.py sync --branch rust

      - name: Validate event against the authoritative checkpoint
        id: validate_event
        run: |
          test -n "$FEATURE_ID"
          test -n "$PR"
          # The dispatch payload is a notification: the checkpoint is authoritative.
          # CHANGES_REQUIRED verdicts land the checkpoint in FIXING; anything
          # else means this event is stale or out of order.
          if python scripts/awh_pipeline.py validate-event --agent fixer --feature "$FEATURE_ID" --pr "$PR"; then
            echo 'Event validated against the checkpoint.'
          else
            code=$?
            if [ "$code" -eq 3 ]; then
              echo 'STALE_EVENT: review-complete event does not match the checkpoint; terminating job.'
              echo 'stale=true' >> "$GITHUB_OUTPUT"
              exit 1
            fi
            exit "$code"
          fi

      - name: Record fix-gate failure
        if: failure() && steps.validate_event.outputs.stale != 'true'
        run: |
          python scripts/awh_pipeline.py record-failure \
            --agent fixer --stage validation \
            --detail "review-fix event validation failed; see workflow run logs" \
            --feature "$FEATURE_ID" --pr "$PR" || true

      - name: Checkpoint fix round with CAS and operation identity
        run: |
          python scripts/awh_pipeline.py begin-stage \
            --stage fixer \
            --feature "$FEATURE_ID" \
            --pr "$PR" \
            --message "chore(automation): fix round for $FEATURE_ID PR $PR" \
            --set last_review="$REVIEW"

      - name: Enforce maximum review rounds
        run: |
          ROUND=$(jq -r '.review_round' .openhands/state.json)
          if [ "$ROUND" -ge 3 ]; then
            echo "Maximum review rounds reached ($ROUND); blocking the feature."
            python scripts/awh_pipeline.py record-failure \
              --agent fixer --stage rounds \
              --detail "maximum review rounds (3) reached; feature left blocked for human review" \
              --feature "$FEATURE_ID" --pr "$PR" || true
            exit 1
          fi
          echo "Fix round $ROUND of 3 recorded."

      - name: Record fix-checkpoint failure
        if: failure()
        run: |
          python scripts/awh_pipeline.py record-failure \
            --agent fixer --stage begin \
            --detail "review-fix could not enter the FIXING stage under CAS; see workflow run logs" \
            --feature "$FEATURE_ID" --pr "$PR" || true

      - name: Dispatch Agent 2 fix
        run: |
          # Idempotent dispatch: the checkpoint already records this fix
          # operation; a retry only re-notifies the same logical operation.
          CURRENT_OP=$(jq -r '.operation_id // empty' .openhands/state.json)
          test -n "$CURRENT_OP"
          if [ -n "$EVENT_OPERATION_ID" ] && [ "$EVENT_OPERATION_ID" != "$CURRENT_OP" ]; then
            echo "STALE_EVENT: dispatch payload operation $EVENT_OPERATION_ID does not match checkpoint operation $CURRENT_OP; terminating job."
            exit 1
          fi
          if [ -z "$REVIEW" ]; then
            REVIEW=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/reviews" --jq '.[-1].body // empty')
            test -n "$REVIEW"
          fi
          jq -n --arg feature "$FEATURE_ID" --arg review "$REVIEW" --arg op "$CURRENT_OP" \
            '{event_type:"awh.fix",client_payload:{feature_id:$feature,review:$review,operation_id:$op}}' > /tmp/payload.json
          gh api "repos/$GITHUB_REPOSITORY/dispatches" --method POST --input /tmp/payload.json

      - name: Record dispatch failure
        if: failure()
        run: |
          python scripts/awh_pipeline.py record-failure \
            --agent fixer --stage dispatch \
            --detail "failed to dispatch the Agent 2 fix event; see workflow run logs" \
            --feature "$FEATURE_ID" --pr "$PR" || true
