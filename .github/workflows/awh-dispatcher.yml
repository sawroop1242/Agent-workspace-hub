name: AWH Autonomous Dispatcher

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: awh-autonomous-dispatcher
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.AWH_AUTOMATION_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rust
          fetch-depth: 0
          token: ${{ secrets.AWH_AUTOMATION_TOKEN }}

      - name: Sync authoritative checkpoint
        run: python scripts/safe_git.py sync --branch rust

      - name: Validate checkpoint
        run: python scripts/checkpoint_state.py validate

      - name: Calculate next dispatch
        id: plan
        run: |
          python scripts/awh_dispatcher.py --json > /tmp/dispatch.json
          cat /tmp/dispatch.json
          ACTION=$(jq -r '.action' /tmp/dispatch.json)
          echo "action=$ACTION" >> "$GITHUB_OUTPUT"
          if [ "$ACTION" = dispatch ]; then
            echo "event=$(jq -r '.event' /tmp/dispatch.json)" >> "$GITHUB_OUTPUT"
          fi

      - name: Dispatch next checkpoint-owned event
        if: steps.plan.outputs.action == 'dispatch'
        run: |
          jq -c '{event_type:.event,client_payload:.payload}' /tmp/dispatch.json > /tmp/payload.json
          gh api "repos/$GITHUB_REPOSITORY/dispatches" --method POST --input /tmp/payload.json
          echo "Dispatched $(jq -r '.event' /tmp/dispatch.json)."

      - name: Wait for active stage
        if: steps.plan.outputs.action == 'wait'
        run: echo 'An active planner/recovery stage owns continuation; no event dispatched.'
