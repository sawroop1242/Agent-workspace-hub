name: AWH Autonomous Development Loop

on:
  workflow_dispatch:
    inputs:
      start:
        description: Start the next sequential feature
        required: true
        default: true
        type: boolean
      feature_id:
        description: Optional ready feature ID override
        required: false
        default: ''
        type: string
  repository_dispatch:
    types: [awh.start, awh.review-complete]

permissions:
  contents: write
  pull-requests: write
  checks: read
  actions: read

concurrency:
  group: awh-autonomous-development
  cancel-in-progress: false

env:
  AWH_LLM_MODEL: moonshotai/kimi-k3
  AWH_LLM_BASE_URL: https://integrate.api.nvidia.com/v1

jobs:
  start-feature:
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.start == true ||
      github.event_name == 'repository_dispatch' && github.event.action == 'awh.start'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.AWH_AUTOMATION_TOKEN }}
      K1: ${{ secrets.AWH_AGENT1_NVIDIA_KEY_1 }}
      K2: ${{ secrets.AWH_AGENT1_NVIDIA_KEY_2 }}
      K3: ${{ secrets.AWH_AGENT1_NVIDIA_KEY_3 }}
      KF: ${{ secrets.AWH_ROUTINE_NVIDIA_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rust
          fetch-depth: 0
          token: ${{ secrets.AWH_AUTOMATION_TOKEN }}

      - name: Verify required LLM secrets
        run: |
          test -n "$K1" || { echo 'Missing required secret: AWH_AGENT1_NVIDIA_KEY_1'; exit 1; }
          test -n "$KF" || { echo 'Missing required secret: AWH_ROUTINE_NVIDIA_KEY'; exit 1; }
          echo 'Required Agent 1 key and routine fallback are configured.'
          [ -n "$K2" ] && echo 'Optional Agent 1 key 2 configured.' || echo 'Optional Agent 1 key 2 not configured.'
          [ -n "$K3" ] && echo 'Optional Agent 1 key 3 configured.' || echo 'Optional Agent 1 key 3 not configured.'

      - name: Checkpoint planner start
        env:
          FEATURE_ID: ${{ inputs.feature_id || github.event.client_payload.feature_id || '' }}
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          p=Path('.openhands/state.json'); s=json.loads(p.read_text())
          requested=os.environ.get('FEATURE_ID') or None
          s.update({'status':'PLANNING','active_feature':requested,'active_pr':None,'active_branch':None,'last_error':None,'updated_at':datetime.now(timezone.utc).isoformat().replace('+00:00','Z')})
          p.write_text(json.dumps(s, indent=2)+"\n")
          PY
          git config user.name 'AWH Automation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .openhands/state.json
          git commit -m 'chore(automation): checkpoint planner start' || true
          git push origin rust

      - name: Guard against an active feature
        run: |
          ACTIVE_PR=$(jq -r '.active_pr // empty' .openhands/state.json)
          STATUS=$(jq -r '.status' .openhands/state.json)
          if [ -n "$ACTIVE_PR" ] && [ "$STATUS" != "COMPLETED" ] && [ "$STATUS" != "IDLE" ] && [ "$STATUS" != "PLANNING" ]; then
            echo "Active autonomous work already exists: PR=$ACTIVE_PR status=$STATUS"
            exit 1
          fi

      - name: Install OpenHands SDK
        run: python -m pip install --disable-pip-version-check 'openhands-sdk>=1.0,<2'

      - name: Plan next feature with Agent 1 and rotate Kimi K3 keys on rate limit
        id: plan
        env:
          AWH_AGENT_ROLE: planner
          AWH_TASK: ${{ inputs.feature_id || github.event.client_payload.feature_id || '' }}
        run: |
          set +e
          SUCCESS=0
          for KEY_NAME in K1 K2 K3 KF; do
            KEY="${!KEY_NAME}"
            [ -n "$KEY" ] || continue
            echo "Agent 1: trying NVIDIA Kimi K3 key pool slot $KEY_NAME"
            AWH_LLM_API_KEY="$KEY" python scripts/openhands_agent.py > /tmp/task.txt 2>&1
            RC=$?
            cat /tmp/task.txt
            if [ "$RC" -eq 0 ]; then
              SUCCESS=1
              break
            fi
            if grep -Eiq '(^|[^0-9])429([^0-9]|$)|rate.?limit|too many requests' /tmp/task.txt; then
              echo "Rate limit detected for $KEY_NAME; rotating to the next key."
              continue
            fi
            echo "Agent 1 failed for a non-rate-limit reason."
            exit "$RC"
          done
          test "$SUCCESS" -eq 1
          FEATURE_ID=$(sed -n 's/^Feature ID: *//p' /tmp/task.txt | head -n1)
          test -n "$FEATURE_ID"
          {
            echo "feature_id=$FEATURE_ID"
            echo 'task<<EOF'
            cat /tmp/task.txt
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Persist active build checkpoint
        env:
          FEATURE_ID: ${{ steps.plan.outputs.feature_id }}
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          p=Path('.openhands/state.json'); s=json.loads(p.read_text())
          s.update({'status':'BUILDING','active_feature':os.environ['FEATURE_ID'],'active_pr':None,'active_branch':None,'review_round':0,'builder_attempt':0,'last_error':None,'last_review':'','updated_at':datetime.now(timezone.utc).isoformat().replace('+00:00','Z')})
          p.write_text(json.dumps(s, indent=2)+"\n")
          PY
          rm -f .openhands/generated-task.md
          git config user.name 'AWH Automation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .openhands/state.json
          git commit -m "chore(automation): start ${{ steps.plan.outputs.feature_id }}" || true
          git push origin rust

      - name: Dispatch Agent 2
        env:
          FEATURE_ID: ${{ steps.plan.outputs.feature_id }}
          TASK: ${{ steps.plan.outputs.task }}
        run: |
          jq -n --arg feature "$FEATURE_ID" --arg task "$TASK" \
            '{event_type:"awh.build",client_payload:{feature_id:$feature,task:$task}}' > /tmp/payload.json
          gh api "repos/$GITHUB_REPOSITORY/dispatches" --method POST --input /tmp/payload.json

  merge-reviewed-feature:
    if: github.event_name == 'repository_dispatch' && github.event.action == 'awh.review-complete' && github.event.client_payload.review_state == 'APPROVE'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.AWH_AUTOMATION_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rust
          fetch-depth: 0
          token: ${{ secrets.AWH_AUTOMATION_TOKEN }}

      - name: Wait for CI and verify mergeability
        env:
          PR: ${{ github.event.client_payload.pr_number }}
        run: |
          gh pr checks "$PR" --repo "$GITHUB_REPOSITORY" --watch --fail-fast
          test "$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json mergeable --jq '.mergeable')" = MERGEABLE
          test "$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json state --jq '.state')" = OPEN

      - name: Merge reviewed head with squash
        env:
          PR: ${{ github.event.client_payload.pr_number }}
        run: |
          HEAD=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq '.headRefOid')
          gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --squash --delete-branch --match-head-commit "$HEAD"

      - name: Update backlog and state
        env:
          PR: ${{ github.event.client_payload.pr_number }}
          FEATURE_ID: ${{ github.event.client_payload.feature_id }}
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          feature=os.environ['FEATURE_ID']; pr=int(os.environ['PR'])
          b=Path('.openhands/backlog.json'); s=Path('.openhands/state.json')
          backlog=json.loads(b.read_text())
          for item in backlog['features']:
              if item['id']==feature:
                  item['status']='completed'; item['merged_pr']=pr
          state=json.loads(s.read_text())
          state.update({'status':'COMPLETED','active_feature':None,'active_pr':None,'active_branch':None,'review_round':0,'builder_attempt':0,'last_error':None,'last_review':'','updated_at':datetime.now(timezone.utc).isoformat().replace('+00:00','Z')})
          b.write_text(json.dumps(backlog, indent=2)+"\n")
          s.write_text(json.dumps(state, indent=2)+"\n")
          PY
          git config user.name 'AWH Automation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .openhands/backlog.json .openhands/state.json
          git commit -m "chore(automation): complete ${{ github.event.client_payload.feature_id }}" || true
          git push origin rust

      - name: Start next sequential feature
        run: |
          gh api "repos/$GITHUB_REPOSITORY/dispatches" --method POST \
            -f event_type=awh.start \
            -f 'client_payload[reason]=feature_merged'
