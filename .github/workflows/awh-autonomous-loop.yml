name: AWH Autonomous Development Loop

on:
  workflow_dispatch:
    inputs:
      start:
        description: Start the next sequential feature
        required: true
        default: true
        type: boolean
      feature_id:
        description: Optional ready feature ID override
        required: false
        default: ''
        type: string
  repository_dispatch:
    types: [awh.start, awh.review-complete]

permissions:
  contents: write
  pull-requests: write
  checks: read
  actions: read

concurrency:
  group: awh-autonomous-development
  cancel-in-progress: false

env:
  AWH_LLM_MODEL: moonshotai/kimi-k3
  AWH_LLM_BASE_URL: https://integrate.api.nvidia.com/v1

jobs:
  start-feature:
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.start == true ||
      github.event_name == 'repository_dispatch' && github.event.action == 'awh.start'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.AWH_AUTOMATION_TOKEN }}
      K1: ${{ secrets.AWH_AGENT1_NVIDIA_KEY_1 }}
      K2: ${{ secrets.AWH_AGENT1_NVIDIA_KEY_2 }}
      K3: ${{ secrets.AWH_AGENT1_NVIDIA_KEY_3 }}
      KF: ${{ secrets.AWH_ROUTINE_NVIDIA_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rust
          fetch-depth: 0
          token: ${{ secrets.AWH_AUTOMATION_TOKEN }}

      - name: Validate checkpoint before planning
        run: |
          python scripts/safe_git.py sync --branch rust
          python scripts/checkpoint_state.py validate

      - name: Refuse new planning while another operation exists
        run: |
          STATUS=$(jq -r '.status' .openhands/state.json)
          case "$STATUS" in
            IDLE|COMPLETED) echo "Checkpoint permits new planning: $STATUS" ;;
            *)
              echo "CHECKPOINT_BUSY: status=$STATUS"
              echo "Planner is fail-closed; recovery/continuation must own this operation."
              exit 1
              ;;
          esac

      - name: Verify required LLM secrets
        run: |
          test -n "$K1" || { echo 'Missing required secret: AWH_AGENT1_NVIDIA_KEY_1'; exit 1; }
          test -n "$KF" || { echo 'Missing required secret: AWH_ROUTINE_NVIDIA_KEY'; exit 1; }
          echo 'Required Agent 1 key and routine fallback are configured.'
          [ -n "$K2" ] && echo 'Optional Agent 1 key 2 configured.' || echo 'Optional Agent 1 key 2 not configured.'
          [ -n "$K3" ] && echo 'Optional Agent 1 key 3 configured.' || echo 'Optional Agent 1 key 3 not configured.'

      - name: Checkpoint planner start
        env:
          FEATURE_ID: ${{ inputs.feature_id || github.event.client_payload.feature_id || '' }}
        run: |
          python scripts/checkpoint_state.py transition \
            --expect-status IDLE --expect-status COMPLETED \
            --to PLANNING \
            --set active_feature="$(python -c 'import json,os; print(json.dumps(os.environ.get("FEATURE_ID") or None))')" \
            --set active_pr=null \
            --set active_branch=null \
            --set active_pr_sha=null \
            --set last_error=null
          git config user.name 'AWH Automation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .openhands/state.json
          python scripts/safe_git.py push --branch rust --message 'chore(automation): checkpoint planner start'

      - name: Record planner-start failure
        if: failure()
        run: |
          python scripts/awh_pipeline.py record-failure \
            --agent starter --stage begin \
            --detail "planner start checkpoint failed; see workflow run logs" || true

      - name: Install OpenHands SDK and built-in tools
        run: python -m pip install --disable-pip-version-check 'openhands-sdk>=1.0,<2' 'openhands-tools>=1.0,<2'

      - name: Plan next feature with Agent 1 and rotate Kimi K3 keys on rate limit
        id: plan
        env:
          AWH_AGENT_ROLE: planner
          AWH_TASK: ${{ inputs.feature_id || github.event.client_payload.feature_id || '' }}
        run: |
          set +e
          SUCCESS=0
          for KEY_NAME in K1 K2 K3 KF; do
            KEY="${!KEY_NAME}"
            [ -n "$KEY" ] || continue
            echo "Agent 1: trying NVIDIA Kimi K3 key pool slot $KEY_NAME"
            AWH_LLM_API_KEY="$KEY" python scripts/openhands_agent.py > /tmp/task.txt 2>&1
            RC=$?
            cat /tmp/task.txt
            if [ "$RC" -eq 0 ]; then SUCCESS=1; break; fi
            if grep -Eiq '(^|[^0-9])429([^0-9]|$)|rate.?limit|too many requests' /tmp/task.txt; then
              echo "Rate limit detected for $KEY_NAME; rotating to the next key."
              continue
            fi
            echo "Agent 1 failed for a non-rate-limit reason."
            exit "$RC"
          done
          test "$SUCCESS" -eq 1
          FEATURE_ID=$(sed -n 's/^Feature ID: *//p' /tmp/task.txt | head -n1)
          test -n "$FEATURE_ID"
          test -s .openhands/generated-task.md
          echo "feature_id=$FEATURE_ID" >> "$GITHUB_OUTPUT"

      - name: Persist active build checkpoint and planner task
        env:
          FEATURE_ID: ${{ steps.plan.outputs.feature_id }}
        run: |
          python scripts/checkpoint_state.py transition \
            --expect-status PLANNING \
            --to BUILDING \
            --set active_feature="$(python -c 'import json,os; print(json.dumps(os.environ["FEATURE_ID"]))')" \
            --set operation_id="$(python -c 'import json,os; print(json.dumps(os.environ["FEATURE_ID"] + ":BUILD:1"))')" \
            --set active_pr=null \
            --set active_branch=null \
            --set review_round=0 \
            --set builder_attempt=1 \
            --set last_error=null \
            --set last_review='""'
          git config user.name 'AWH Automation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .openhands/state.json .openhands/generated-task.md
          python scripts/safe_git.py push --branch rust --message "chore(automation): start ${{ steps.plan.outputs.feature_id }}"

      - name: Record build-checkpoint failure
        if: failure()
        run: |
          python scripts/awh_pipeline.py record-failure \
            --agent starter --stage plan \
            --detail "planner produced a task but the BUILDING checkpoint failed; see workflow run logs" \
            --feature "${{ steps.plan.outputs.feature_id }}" || true

      - name: Dispatch Agent 2
        env:
          FEATURE_ID: ${{ steps.plan.outputs.feature_id }}
        run: |
          CURRENT_OP=$(jq -r '.operation_id // empty' .openhands/state.json)
          EXPECTED_OP="$FEATURE_ID:BUILD:1"
          if [ "$CURRENT_OP" != "$EXPECTED_OP" ]; then
            echo "Refusing to dispatch: checkpoint operation '$CURRENT_OP' is not '$EXPECTED_OP'."
            exit 1
          fi
          test -s .openhands/generated-task.md
          jq -n --arg feature "$FEATURE_ID" --arg op "$CURRENT_OP" \
            '{event_type:"awh.build",client_payload:{feature_id:$feature,operation_id:$op}}' > /tmp/payload.json
          gh api "repos/$GITHUB_REPOSITORY/dispatches" --method POST --input /tmp/payload.json

      - name: Record dispatch failure
        if: failure()
        run: |
          python scripts/awh_pipeline.py record-failure \
            --agent starter --stage dispatch \
            --detail "failed to dispatch the Agent 2 build event; recovery will resume from BUILDING" \
            --feature "${{ steps.plan.outputs.feature_id }}" || true
