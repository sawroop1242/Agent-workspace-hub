name: AWH Autonomous Development Loop

on:
  workflow_dispatch:
    inputs:
      start:
        description: Start the next sequential feature
        required: true
        default: true
        type: boolean
      feature_id:
        description: Optional ready feature ID override
        required: false
        default: ''
        type: string
  repository_dispatch:
    types: [awh.start, awh.review-complete]

permissions:
  contents: write
  pull-requests: write
  checks: read
  actions: read

concurrency:
  group: awh-autonomous-development
  cancel-in-progress: false

jobs:
  start-feature:
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.start == true ||
      github.event_name == 'repository_dispatch' && github.event.action == 'awh.start'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ secrets.AWH_AUTOMATION_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rust
          fetch-depth: 0
          token: ${{ secrets.AWH_AUTOMATION_TOKEN }}

      - name: Guard against an active feature
        run: |
          ACTIVE_PR=$(jq -r '.active_pr // empty' .openhands/state.json)
          STATUS=$(jq -r '.status' .openhands/state.json)
          if [ -n "$ACTIVE_PR" ] && [ "$STATUS" != "COMPLETED" ] && [ "$STATUS" != "IDLE" ]; then
            echo "Active autonomous work already exists: PR=$ACTIVE_PR status=$STATUS"
            exit 1
          fi

      - name: Install OpenHands SDK
        run: python -m pip install --disable-pip-version-check 'openhands-sdk>=1.0,<2'

      - name: Plan next feature with Agent 1
        id: plan
        env:
          AWH_AGENT_ROLE: planner
          AWH_LLM_API_KEY: ${{ secrets.AWH_LLM_API_KEY }}
          AWH_LLM_BASE_URL: ${{ secrets.AWH_LLM_BASE_URL }}
          AWH_LLM_MODEL: ${{ secrets.AWH_ORCHESTRATOR_MODEL || 'gpt-5.5' }}
          AWH_TASK: ${{ inputs.feature_id || github.event.client_payload.feature_id || '' }}
        run: |
          mkdir -p .openhands
          python scripts/openhands_agent.py > /tmp/task.txt
          cat /tmp/task.txt
          FEATURE_ID=$(sed -n 's/^Feature ID: *//p' /tmp/task.txt | head -n1)
          test -n "$FEATURE_ID"
          {
            echo "feature_id=$FEATURE_ID"
            echo 'task<<EOF'
            cat /tmp/task.txt
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Persist active state
        env:
          FEATURE_ID: ${{ steps.plan.outputs.feature_id }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path('.openhands/state.json'); s=json.loads(p.read_text())
          s.update({'status':'BUILDING','active_feature':os.environ['FEATURE_ID'],'active_pr':None,'active_branch':None,'review_round':0,'builder_attempt':1,'last_error':None})
          p.write_text(json.dumps(s, indent=2)+"\n")
          PY
          rm -f .openhands/generated-task.md
          git config user.name 'AWH Automation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .openhands/state.json
          git commit -m "chore(automation): start ${{ steps.plan.outputs.feature_id }}" || true
          git push origin rust

      - name: Dispatch Agent 2
        env:
          FEATURE_ID: ${{ steps.plan.outputs.feature_id }}
          TASK: ${{ steps.plan.outputs.task }}
        run: |
          jq -n --arg feature "$FEATURE_ID" --arg task "$TASK" \
            '{event_type:"awh.build",client_payload:{feature_id:$feature,task:$task}}' > /tmp/payload.json
          gh api "repos/$GITHUB_REPOSITORY/dispatches" --method POST --input /tmp/payload.json

  merge-reviewed-feature:
    if: github.event_name == 'repository_dispatch' && github.event.action == 'awh.review-complete' && github.event.client_payload.review_state == 'APPROVED'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ secrets.AWH_AUTOMATION_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rust
          fetch-depth: 0
          token: ${{ secrets.AWH_AUTOMATION_TOKEN }}

      - name: Wait for CI and verify mergeability
        env:
          PR: ${{ github.event.client_payload.pr_number }}
        run: |
          gh pr checks "$PR" --repo "$GITHUB_REPOSITORY" --watch --fail-fast
          test "$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json mergeable --jq '.mergeable')" = MERGEABLE
          test "$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json state --jq '.state')" = OPEN

      - name: Merge reviewed head with squash
        env:
          PR: ${{ github.event.client_payload.pr_number }}
        run: |
          HEAD=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq '.headRefOid')
          gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --squash --delete-branch --match-head-commit "$HEAD"

      - name: Update backlog and state
        env:
          PR: ${{ github.event.client_payload.pr_number }}
          FEATURE_ID: ${{ github.event.client_payload.feature_id }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          feature=os.environ['FEATURE_ID']; pr=int(os.environ['PR'])
          b=Path('.openhands/backlog.json'); s=Path('.openhands/state.json')
          backlog=json.loads(b.read_text())
          for item in backlog['features']:
              if item['id']==feature:
                  item['status']='completed'; item['merged_pr']=pr
          state=json.loads(s.read_text())
          state.update({'status':'COMPLETED','active_feature':None,'active_pr':None,'active_branch':None,'review_round':0,'builder_attempt':0,'last_error':None})
          b.write_text(json.dumps(backlog, indent=2)+"\n")
          s.write_text(json.dumps(state, indent=2)+"\n")
          PY
          git config user.name 'AWH Automation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .openhands/backlog.json .openhands/state.json
          git commit -m "chore(automation): complete ${{ github.event.client_payload.feature_id }}" || true
          git push origin rust

      - name: Start next sequential feature
        run: |
          gh api "repos/$GITHUB_REPOSITORY/dispatches" --method POST \
            -f event_type=awh.start \
            -f 'client_payload[reason]=feature_merged'
