name: AWH Autonomous Development Loop

on:
  workflow_dispatch:
    inputs:
      start:
        description: Start the next sequential feature
        required: true
        default: true
        type: boolean
      feature_id:
        description: Optional ready feature ID override
        required: false
        default: ''
        type: string
  repository_dispatch:
    types: [awh.start, awh.review-complete]

permissions:
  contents: write
  pull-requests: write
  checks: read
  actions: read

concurrency:
  group: awh-autonomous-development
  cancel-in-progress: false

env:
  AWH_LLM_MODEL: deepseek-ai/deepseek-v4-flash-0731
  AWH_LLM_BASE_URL: https://integrate.api.nvidia.com/v1
  OPENHANDS_SDK_COMMIT: 22c85eb0e0db8f4386380d095e9fe6933af2e65f

jobs:
  start-feature:
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.start == true ||
      github.event_name == 'repository_dispatch' && github.event.action == 'awh.start'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.AWH_AUTOMATION_TOKEN }}
      K1: ${{ secrets.AWH_AGENT1_NVIDIA_KEY_1 }}
      K2: ${{ secrets.AWH_AGENT1_NVIDIA_KEY_2 }}
      K3: ${{ secrets.AWH_AGENT1_NVIDIA_KEY_3 }}
      KF: ${{ secrets.AWH_ROUTINE_NVIDIA_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rust
          fetch-depth: 0
          token: ${{ secrets.AWH_AUTOMATION_TOKEN }}

      - name: Validate checkpoint before planning
        run: |
          python scripts/safe_git.py sync --branch rust
          python scripts/checkpoint_state.py validate

      - name: Handle existing checkpoint safely
        id: checkpoint_gate
        run: |
          STATUS=$(jq -r '.status' .openhands/state.json)
          FEATURE=$(jq -r '.active_feature // empty' .openhands/state.json)
          OPERATION_ID=$(jq -r '.operation_id // empty' .openhands/state.json)
          case "$STATUS" in
            IDLE|COMPLETED)
              echo "checkpoint_action=plan" >> "$GITHUB_OUTPUT"
              echo "Checkpoint permits new planning: $STATUS"
              ;;
            BLOCKED)
              echo "checkpoint_action=recover" >> "$GITHUB_OUTPUT"
              echo "CHECKPOINT_BLOCKED: feature=$FEATURE operation=$OPERATION_ID"
              echo "A blocked operation must be recovered; it must never be reset to IDLE by the planner."
              ;;
            RECOVERING|PLANNING|BUILDING|PR_OPEN|REVIEWING|FIXING|MERGING)
              echo "checkpoint_action=busy" >> "$GITHUB_OUTPUT"
              echo "CHECKPOINT_BUSY: status=$STATUS feature=$FEATURE operation=$OPERATION_ID"
              echo "Planner will not create or overwrite a second operation."
              ;;
            *)
              echo "Unknown checkpoint status: $STATUS"
              exit 1
              ;;
          esac

      - name: Request recovery for blocked operation
        if: steps.checkpoint_gate.outputs.checkpoint_action == 'recover'
        run: |
          FEATURE=$(jq -r '.active_feature // empty' .openhands/state.json)
          OPERATION_ID=$(jq -r '.operation_id // empty' .openhands/state.json)
          test -n "$FEATURE"
          test -n "$OPERATION_ID"
          jq -n --arg feature "$FEATURE" --arg operation "$OPERATION_ID" '{event_type:"awh.recover",client_payload:{feature_id:$feature,operation_id:$operation}}' > /tmp/recovery-payload.json
          gh api "repos/$GITHUB_REPOSITORY/dispatches" --method POST --input /tmp/recovery-payload.json
          echo "Recovery requested for $FEATURE / $OPERATION_ID."

      - name: Stop without mutation when checkpoint is not ready for planning
        if: steps.checkpoint_gate.outputs.checkpoint_action != 'plan'
        run: |
          echo 'No planner mutation performed.'
          echo 'Existing operation remains authoritative; recovery/active workflow owns continuation.'
          exit 0

      - name: Verify required LLM secrets
        if: steps.checkpoint_gate.outputs.checkpoint_action == 'plan'
        run: |
          test -n "$K1" || { echo 'Missing required secret: AWH_AGENT1_NVIDIA_KEY_1'; exit 1; }
          test -n "$KF" || { echo 'Missing required secret: AWH_ROUTINE_NVIDIA_KEY'; exit 1; }
          [ -n "$K2" ] && echo 'Optional Agent 1 key 2 configured.' || echo 'Optional Agent 1 key 2 not configured.'
          [ -n "$K3" ] && echo 'Optional Agent 1 key 3 configured.' || echo 'Optional Agent 1 key 3 not configured.'

      - name: Checkpoint planner start
        if: steps.checkpoint_gate.outputs.checkpoint_action == 'plan'
        env:
          FEATURE_ID: ${{ inputs.feature_id || github.event.client_payload.feature_id || '' }}
        run: |
          python scripts/checkpoint_state.py transition --expect-status IDLE --expect-status COMPLETED --to PLANNING --set active_feature="$(python -c 'import json,os; print(json.dumps(os.environ.get("FEATURE_ID") or None))')" --set active_pr=null --set active_branch=null --set active_pr_sha=null --set last_error=null
          git config user.name 'AWH Automation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .openhands/state.json
          python scripts/safe_git.py push --branch rust --message 'chore(automation): checkpoint planner start'

      - name: Record planner-start failure
        if: failure() && steps.checkpoint_gate.outputs.checkpoint_action == 'plan'
        run: python scripts/awh_pipeline.py record-failure --agent starter --stage begin --detail "planner start checkpoint failed; see workflow run logs" || true

      - name: Install pinned OpenHands SDK and built-in tools
        if: steps.checkpoint_gate.outputs.checkpoint_action == 'plan'
        run: |
          python -m pip install --disable-pip-version-check \
            "openhands-sdk @ git+https://github.com/OpenHands/software-agent-sdk.git@${OPENHANDS_SDK_COMMIT}#subdirectory=openhands-sdk" \
            "openhands-tools @ git+https://github.com/OpenHands/software-agent-sdk.git@${OPENHANDS_SDK_COMMIT}#subdirectory=openhands-tools"

      - name: Plan next feature with Agent 1 and rotate DeepSeek keys on rate limit
        if: steps.checkpoint_gate.outputs.checkpoint_action == 'plan'
        id: plan
        env:
          AWH_AGENT_ROLE: planner
          AWH_TASK: ${{ inputs.feature_id || github.event.client_payload.feature_id || '' }}
        run: |
          set +e
          SUCCESS=0
          for KEY_NAME in K1 K2 K3 KF; do
            KEY="${!KEY_NAME}"; [ -n "$KEY" ] || continue
            echo "Agent 1: trying NVIDIA DeepSeek key pool slot $KEY_NAME"
            AWH_LLM_API_KEY="$KEY" python scripts/openhands_agent.py > /tmp/task.txt 2>&1
            RC=$?; cat /tmp/task.txt
            if [ "$RC" -eq 0 ]; then SUCCESS=1; break; fi
            if grep -Eiq '(^|[^0-9])429([^0-9]|$)|rate.?limit|too many requests' /tmp/task.txt; then continue; fi
            exit "$RC"
          done
          test "$SUCCESS" -eq 1
          FEATURE_ID=$(sed -n 's/^Feature ID: *//p' /tmp/task.txt | head -n1)
          test -n "$FEATURE_ID"
          python scripts/validate_feature_id.py "$FEATURE_ID"
          test -s .openhands/generated-task.md
          echo "feature_id=$FEATURE_ID" >> "$GITHUB_OUTPUT"

      - name: Persist active build checkpoint and planner task
        if: steps.checkpoint_gate.outputs.checkpoint_action == 'plan'
        env:
          FEATURE_ID: ${{ steps.plan.outputs.feature_id }}
        run: |
          python scripts/checkpoint_state.py transition --expect-status PLANNING --to BUILDING --set active_feature="$(python -c 'import json,os; print(json.dumps(os.environ["FEATURE_ID"]))')" --set operation_id="$(python -c 'import json,os; print(json.dumps(os.environ["FEATURE_ID"] + ":BUILD:1"))')" --set active_pr=null --set active_branch=null --set active_pr_sha=null --set review_round=0 --set builder_attempt=1 --set last_error=null --set last_review='""'
          git config user.name 'AWH Automation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .openhands/state.json .openhands/generated-task.md
          python scripts/safe_git.py push --branch rust --message "chore(automation): start ${{ steps.plan.outputs.feature_id }}"

      - name: Record build-checkpoint failure
        if: failure() && steps.checkpoint_gate.outputs.checkpoint_action == 'plan'
        run: python scripts/awh_pipeline.py record-failure --agent starter --stage plan --detail "planner produced a task but the BUILDING checkpoint failed; see workflow run logs" --feature "${{ steps.plan.outputs.feature_id }}" || true

      - name: Dispatch Agent 2
        if: steps.checkpoint_gate.outputs.checkpoint_action == 'plan'
        env:
          FEATURE_ID: ${{ steps.plan.outputs.feature_id }}
        run: |
          CURRENT_OP=$(jq -r '.operation_id // empty' .openhands/state.json)
          EXPECTED_OP="$FEATURE_ID:BUILD:1"
          test "$CURRENT_OP" = "$EXPECTED_OP"
          test -s .openhands/generated-task.md
          jq -n --arg feature "$FEATURE_ID" --arg op "$CURRENT_OP" '{event_type:"awh.build",client_payload:{feature_id:$feature,operation_id:$op}}' > /tmp/payload.json
          gh api "repos/$GITHUB_REPOSITORY/dispatches" --method POST --input /tmp/payload.json

      - name: Record dispatch failure
        if: failure() && steps.checkpoint_gate.outputs.checkpoint_action == 'plan'
        run: python scripts/awh_pipeline.py record-failure --agent starter --stage dispatch --detail "failed to dispatch the Agent 2 build event; recovery will resume from BUILDING" --feature "${{ steps.plan.outputs.feature_id }}" || true
