name: Rust

on:
  push:
    branches: [rust]
  pull_request:
    branches: [rust]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Pull Request number to run AI review on'
        required: true
        type: string

# Least privilege: every job here only reads the repository. Declaring the
# permission explicitly stops the job from inheriting the repository/org
# default (which may be read-write) — CodeQL `actions/missing-workflow-permissions`.
permissions:
  contents: read

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - run: cargo fmt --all -- --check

  build-test:
    name: Build / test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - run: cargo check --all-targets
      - run: cargo test --all-targets

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: clippy
      - run: cargo clippy --all-targets --all-features -- -D warnings

  audit:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - run: cargo install --locked cargo-audit
      - run: cargo audit

