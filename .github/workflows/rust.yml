name: Rust

on:
  push:
    branches: [rust]
  pull_request:
    branches: [rust]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Pull Request number to run AI review on'
        required: true
        type: string

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - run: cargo fmt --all -- --check

  build-test:
    name: Build / test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - run: cargo check --all-targets
      - run: cargo test --all-targets

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: clippy
      - run: cargo clippy --all-targets --all-features -- -D warnings

  audit:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - run: cargo install --locked cargo-audit
      - run: cargo audit

  ai-review:
    name: PR-Agent NVIDIA NIM Review
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'pull_request' }}
    needs: [fmt]
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: PR-Agent review
        uses: the-pr-agent/pr-agent@main
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OPENAI_KEY: ${{ secrets.AWH_AGENT2_NVIDIA_KEY_1 }}
          OPENAI__API_BASE: "https://integrate.api.nvidia.com/v1"
          # NVIDIA NIM model IDs (verified in the NVIDIA catalog): z-ai/glm-5.3, z-ai/glm-5.3-flash
          "config.model": "openai/z-ai/glm-5.3"
          "config.fallback_models": '["openai/z-ai/glm-5.3-flash"]'
          # Custom model IDs are not in PR-Agent's built-in token table; this is required.
          "config.custom_model_max_tokens": "128000"
          "config.ai_timeout": "300"
          "config.verbosity_level": "1"
          "github_action_config.auto_review": "true"
          "github_action_config.auto_describe": "false"
          "github_action_config.auto_improve": "false"
          "github_action_config.pr_actions": '["opened", "reopened", "synchronize", "ready_for_review", "review_requested"]'

  manual-ai-review:
    name: Manual PR-Agent NVIDIA NIM Review
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs: [fmt]
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: Resolve pull request URL
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          set -euo pipefail

          if ! [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "Invalid PR number: $PR_NUMBER"
            exit 1
          fi

          PR_URL="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json url --jq '.url')"
          if [ -z "$PR_URL" ]; then
            echo "Could not resolve PR #$PR_NUMBER"
            exit 1
          fi

          echo "url=$PR_URL" >> "$GITHUB_OUTPUT"
          echo "Resolved PR #$PR_NUMBER"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PR-Agent
        run: python -m pip install --disable-pip-version-check pr-agent

      - name: Run PR-Agent review
        env:
          # PR-Agent maps nested settings from double-underscore env vars.
          OPENAI__KEY: ${{ secrets.AWH_AGENT2_NVIDIA_KEY_1 }}
          OPENAI__API_BASE: "https://integrate.api.nvidia.com/v1"

          # NVIDIA NIM model IDs, prefixed with "openai/" so LiteLLM uses the OpenAI-compatible route.
          CONFIG__MODEL: "openai/z-ai/glm-5.3"
          CONFIG__FALLBACK_MODELS: '["openai/z-ai/glm-5.3-flash"]'
          CONFIG__CUSTOM_MODEL_MAX_TOKENS: "128000"

          CONFIG__AI_TIMEOUT: "300"
          CONFIG__VERBOSITY_LEVEL: "1"
          GITHUB__USER_TOKEN: ${{ github.token }}
          PR_URL: ${{ steps.pr.outputs.url }}
        run: |
          set -euo pipefail
          python -m pr_agent.cli --pr_url="$PR_URL" review
