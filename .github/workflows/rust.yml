name: Rust

on:
  push:
    branches: [rust]
  pull_request:
    branches: [rust]
  workflow_dispatch:

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - run: cargo fmt --all -- --check

  build-test:
    name: Build / test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - run: cargo check --all-targets
      - run: cargo test --all-targets

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: clippy
      - run: cargo clippy --all-targets --all-features -- -D warnings

  audit:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - run: cargo install --locked cargo-audit
      - run: cargo audit

  ai-review:
    name: Deep AI Code Review (FreeLLMAPI OpenAI-compatible)
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'pull_request' }}
    needs: [fmt]
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Load Custom Review Prompt
        id: load-prompt
        run: |
          EOF=$(dd if=/dev/urandom bs=15 count=1 2>/dev/null | base64)
          echo "CUSTOM_PROMPT<<$EOF" >> $GITHUB_ENV
          cat .github/agent/prompts/review.md >> $GITHUB_ENV
          echo "" >> $GITHUB_ENV
          echo "$EOF" >> $GITHUB_ENV

      # Junie's prepare step requires a supported BYOK input. The OpenAI BYOK
      # slot is used only to satisfy that action-level requirement; the custom
      # profile below routes the actual request to FreeLLMAPI.
      - name: Run Junie Code Review
        uses: JetBrains/junie-github-action@v1.7.11
        env:
          FREELLMAPI_API_KEY: ${{ secrets.AWH_AGENT2_NVIDIA_KEY_1 }}
        with:
          openai_api_key: ${{ secrets.AWH_AGENT2_NVIDIA_KEY_1}}
          model: "custom:nvidia-deepseek-ai/deepseek-v4.1-flash"
          prompt: ${{ env.CUSTOM_PROMPT }}
