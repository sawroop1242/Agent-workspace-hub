name: Rust

on:
  push:
    branches: [rust]
  pull_request:
    branches: [rust]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Pull Request number to run AI review on'
        required: true
        type: string

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - run: cargo fmt --all -- --check

  build-test:
    name: Build / test (${{ matrix.os }})
    runs-on: ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - run: cargo check --all-targets
      - run: cargo test --all-targets

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: clippy
      - run: cargo clippy --all-targets --all-features -- -D warnings

  audit:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - run: cargo install --locked cargo-audit
      - run: cargo audit

  ai-review:
    name: PR-Agent NVIDIA NIM Review
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'pull_request' }})
    needs: [fmt]
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: PR-Agent review
        uses: the-pr-agent/pr-agent@main
        env:
          GITHUB_TOKEN: ${{ github.token }})
          OPENAI__KEY: ${{ secrets.AWH_AGENT2_NVIDIA_KEY_1 }})
          OPENAI__API_BASE: "https://integrate.api.nvidia.com/v1"
          "config.model": "openai/z-ai/glm-5.3"
          "config.fallback_models": '["openai/z-ai/glm-5-3-flash"]'
          "config.ai_timeout": "300"
          "config.custom_model_max_tokens": "128000"
          "config.verbosity_level": "1"
          "github_action_config.auto_review": "true"
          "github_action_config.auto_describe": "false"
          "github_action_config.auto_improve": "false"
          "github_action_config.pr_actions": '["opened", "reopened", "synchronize", "ready_for_review", "review_requested"]'
