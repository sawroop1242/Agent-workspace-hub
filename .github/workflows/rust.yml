name: Rust

on:
  push:
    branches: [rust]
  pull_request:
    branches: [rust]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Pull Request number to run AI review on'
        required: true
        type: string

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - run: cargo fmt --all -- --check

  build-test:
    name: Build / test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - run: cargo check --all-targets
      - run: cargo test --all-targets

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: clippy
      - run: cargo clippy --all-targets --all-features -- -D warnings

  audit:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - run: cargo install --locked cargo-audit
      - run: cargo audit

  ai-review:
    name: Deep AI Code Review (FreeLLMAPI OpenAI-compatible)
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' }}
    needs: [fmt]
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Load Custom Review Prompt
        id: load-prompt
        run: |
          EOF=$(dd if=/dev/urandom bs=15 count=1 2>/dev/null | base64)
          echo "CUSTOM_PROMPT<<$EOF" >> $GITHUB_ENV
          cat .github/agent/prompts/review.md >> $GITHUB_ENV
          echo "" >> $GITHUB_ENV
          echo "$EOF" >> $GITHUB_ENV

      # The NVIDIA NIM profile lives at .junie/models/freellmapi-auto.json
      # ("custom:<filename-without-.json>"). That profile's apiKey field
      # references ${AWH_AGENT2_NVIDIA_KEY_1}, so that exact env var name
      # must be set here for Junie to resolve it.
      - name: Run Junie Code Review
        uses: JetBrains/junie-github-action@v1.7.11
        with:
          model: "custom:freellmapi-auto"
          prompt: ${{ env.CUSTOM_PROMPT }}
          pr_number: ${{ github.event.inputs.pr_number || github.event.pull_request.number }}

        env:
          AWH_AGENT2_NVIDIA_KEY_1: ${{ secrets.AWH_AGENT2_NVIDIA_KEY_1 }}
