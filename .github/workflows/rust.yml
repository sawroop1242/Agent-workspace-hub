name: Rust

on:
  push:
    branches: [rust]
  pull_request:
    branches: [rust]
  workflow_dispatch:

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - run: cargo fmt --all -- --check

  build-test:
    name: Build / test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - run: cargo check --all-targets
      - run: cargo test --all-targets

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: clippy
      - run: cargo clippy --all-targets --all-features -- -D warnings

  audit:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      # Fails on actual RUSTSEC vulnerabilities; warning-level advisories
      # (unmaintained/yanked transitive crates) are surfaced but non-blocking.
      - run: cargo install --locked cargo-audit
      - run: cargo audit

  ai-review:
    name: Deep AI Code Review (GLM-5.3 via NVIDIA NIM)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    needs: [fmt]
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Step 1: Load the custom prompt file into the environment
      - name: Load Custom Review Prompt
        id: load-prompt
        run: |
          # Read file content and safely escape it for GitHub Actions Environment Multiline Strings
          EOF=$(dd if=/dev/urandom bs=15 count=1 2>/dev/null | base64)
          echo "CUSTOM_PROMPT<<$EOF" >> $GITHUB_ENV
          cat .github/agent/prompts/review.md >> $GITHUB_ENV
          echo "" >> $GITHUB_ENV
          echo "$EOF" >> $GITHUB_ENV

      # Step 2: Feed the custom prompt string into Junie.
      #
      # Junie's --model flag validates against its own fixed model roster
      # (claude-*, gemini-*, gpt-*, grok-*) before ever making a network call --
      # a raw provider-native model string like "z-ai/glm-5.3" is always
      # rejected as "Invalid model", regardless of JUNIE_OPENAI_BASE_URL.
      # Custom/BYOK models must instead be defined as a model profile under
      # .junie/models/*.json (id, baseUrl including the full request path,
      # apiType, apiKey referencing an env var), then selected by that
      # profile's "id". See .junie/models/nvidia-glm.json and
      # https://junie.jetbrains.com/docs/custom-llm-models.html.
      - name: Run Junie Code Review
        uses: JetBrains/junie-github-action@v1.7.11
        with:
          openai_api_key: ${{ secrets.AWH_AGENT3_NVIDIA_KEY_1 }}
          model: "nvidia-glm-5.3"
          # Dynamically inject the custom prompt loaded from your repository file
          prompt: ${{ env.CUSTOM_PROMPT }}
