name: AWH Performance Validation

on:
  pull_request:
    branches: [rust]
  workflow_dispatch:

concurrency:
  group: awh-performance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Performance tooling runs only on the GitHub-hosted runner. It is not part
# of the AWH product/runtime and must never be added to Cargo.toml or Cargo.lock.
permissions:
  contents: read

jobs:
  performance:
    name: Performance (Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Capture benchmark environment
        shell: bash
        run: |
          set -u
          mkdir -p artifacts
          {
            echo '# AWH performance environment'
            echo "OS=${RUNNER_OS}"
            echo "ARCH=${RUNNER_ARCH}"
            echo "REF=${GITHUB_REF}"
            echo "SHA=${GITHUB_SHA}"
            rustc --version || true
            cargo --version || true
            nproc || true
          } | tee artifacts/environment.txt

      - name: Verify repository is clean before validation
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"

      - name: Required Rust formatting check
        shell: bash
        run: cargo fmt --all -- --check

      - name: Required Rust build check
        shell: bash
        run: cargo check --all-targets

      - name: Required Rust test suite
        shell: bash
        run: cargo test --all-targets

      - name: Required Rust Clippy check
        shell: bash
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Validate benchmark configuration
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          cargo metadata --format-version 1 > artifacts/cargo-metadata.json
          cargo tree --all-features > artifacts/cargo-tree.txt
          if grep -Eiq '(criterion|iai|iai-callgrind)' Cargo.toml Cargo.lock; then
            echo 'Existing Rust benchmark dependency detected; it will be used only as a project benchmark harness.'
          else
            echo 'No benchmark-specific runtime dependency detected; using reproducible CLI/build timing probes.'
          fi

      - name: Run reproducible build performance probe
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          {
            echo '# Release build timing'
            /usr/bin/time -v cargo build --release --locked
          } 2>&1 | tee artifacts/release-build.txt

      - name: Run AWH CLI startup probes
        shell: bash
        run: |
          set -euo pipefail
          binary=./target/release/awh
          test -x "$binary"
          {
            echo '# CLI probes'
            echo '## version'
            /usr/bin/time -v "$binary" --version
            echo '## help'
            /usr/bin/time -v "$binary" --help >/dev/null
            echo '## status'
            /usr/bin/time -v "$binary" status
          } 2>&1 | tee artifacts/cli-probes.txt

      - name: Collect performance metrics
        if: always()
        shell: bash
        run: |
          set +e
          {
            echo '# Git state'
            git status --short
            echo '# Diff check'
            git diff --check
            echo '# Tracked diff'
            git diff -- .
          } > artifacts/repository-integrity.txt 2>&1
          find target -maxdepth 3 -type f -name 'awh*' -printf '%p %s bytes\n' \
            > artifacts/binaries.txt 2>/dev/null || true
          du -sh target 2>/dev/null > artifacts/target-size.txt || true

      - name: Upload performance artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: awh-performance-${{ github.sha }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14

      - name: Enforce runtime separation and read-only integrity
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          # External benchmark/agent infrastructure must not enter AWH runtime manifests.
          if grep -Eiq '(swe-bench|swe-smith|codeclash|swe-rex|mini-swe-agent|swe-agent|sb-cli|openhands)' Cargo.toml Cargo.lock; then
            echo 'Forbidden external agent/benchmark dependency detected in AWH runtime manifests.'
            exit 1
          fi
          # Generated target/diagnostic files are ignored; tracked source changes are forbidden.
          git diff --quiet -- .
          echo 'Performance validation remained external to the AWH runtime and changed no tracked files.'
