name: External AWH Review Verification

on:
  pull_request:
    branches:
      - rust
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: awh-review-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# READ-ONLY REVIEW BOUNDARY:
# This workflow performs external review and security-gate verification only.
# It does not push, create branches, approve/merge PRs, or modify the AWH
# runtime. External review tooling remains outside AWH's dependency graph.

jobs:
  review:
    name: Review verification (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Checkout AWH revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Capture review context
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "revision=$(git rev-parse HEAD)"
            echo "base=${{ github.base_ref }}"
            echo "head=${{ github.head_ref }}"
            echo "event=${{ github.event_name }}"
            echo "runner_os=${RUNNER_OS}"
            echo "runner_arch=${RUNNER_ARCH}"
            echo "rustc=$(rustc --version)"
            echo "cargo=$(cargo --version)"
          } | tee review-context.txt

      - name: Verify clean checkout
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"

      - name: Format verification
        id: fmt
        continue-on-error: true
        run: cargo fmt --all -- --check

      - name: Cargo check
        id: check
        continue-on-error: true
        run: cargo check --all-targets

      - name: Test suite
        id: test
        continue-on-error: true
        run: cargo test --all-targets

      - name: Clippy verification
        id: clippy
        if: runner.os == 'Linux'
        continue-on-error: true
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Dependency audit
        id: audit
        if: runner.os == 'Linux'
        continue-on-error: true
        run: |
          cargo install --locked cargo-audit
          cargo audit

      - name: Security gate - forbidden runtime dependencies
        id: dependency_gate
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          forbidden='(mini-swe-agent|swe-agent|swe-rex|swe-bench|swebench|swe-smith|swe_smith|codeclash|sb-cli|openhands)'

          if grep -Eiq "$forbidden" Cargo.toml Cargo.lock; then
            echo "Security gate failed: external agent/benchmark tooling appears in AWH runtime manifests."
            exit 1
          fi

          echo "Security gate passed: no prohibited external agent/benchmark runtime dependency found."

      - name: Security gate - repository integrity
        id: integrity_gate
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test -z "$(git status --porcelain)"
          echo "Security gate passed: review checks did not modify the repository."

      - name: Security gate - secret exposure scan
        id: secret_gate
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE --exclude-dir=.git --exclude='*.lock' '(NVIDIA_NIM_API_KEY_[1-4]=[^$[:space:]]+|GEMINI_API_KEY_[1-4]=[^$[:space:]]+|BEGIN (RSA|OPENSSH|EC|DSA) PRIVATE KEY)' .; then
            echo "Security gate failed: possible credential/private-key material detected."
            exit 1
          fi
          echo "Security gate passed: no obvious credential/private-key material detected."

      - name: Security gate - high-risk runtime controls present
        id: control_gate
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          missing=0

          for required_file in docs/security.md docs/PROJECT_CONTEXT.md docs/development.md; do
            if [[ ! -f "$required_file" ]]; then
              echo "Missing required security/development contract: $required_file"
              missing=1
            fi
          done

          if [[ "$missing" -ne 0 ]]; then
            exit 1
          fi

          echo "Security gate passed: required AWH security/development contracts are present."

      - name: Capture review evidence
        if: always()
        shell: bash
        run: |
          set +e
          {
            echo "=== review outcomes ==="
            echo "fmt=${{ steps.fmt.outcome }}"
            echo "check=${{ steps.check.outcome }}"
            echo "test=${{ steps.test.outcome }}"
            echo "clippy=${{ steps.clippy.outcome }}"
            echo "audit=${{ steps.audit.outcome }}"
            echo "dependency_gate=${{ steps.dependency_gate.outcome }}"
            echo "integrity_gate=${{ steps.integrity_gate.outcome }}"
            echo "secret_gate=${{ steps.secret_gate.outcome }}"
            echo "control_gate=${{ steps.control_gate.outcome }}"
            echo "=== git status ==="
            git status --short
            echo "=== diff check ==="
            git diff --check
            echo "=== recent commits ==="
            git log -5 --oneline
          } > review-report.txt 2>&1
          cargo metadata --format-version 1 > review-cargo-metadata.json 2> review-cargo-metadata.stderr
          cargo tree > review-cargo-tree.txt 2>&1
          cat review-report.txt

      - name: Upload review artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: awh-review-${{ matrix.os }}-${{ github.run_id }}
          path: |
            review-context.txt
            review-report.txt
            review-cargo-metadata.json
            review-cargo-metadata.stderr
            review-cargo-tree.txt
          if-no-files-found: ignore
          retention-days: 14

      - name: Enforce review gates
        if: always()
        shell: bash
        run: |
          if [[ "${{ steps.fmt.outcome }}" != "success" ||
                "${{ steps.check.outcome }}" != "success" ||
                "${{ steps.test.outcome }}" != "success" ]]; then
            echo "Required Rust review checks failed."
            exit 1
          fi

          if [[ "${{ runner.os }}" == "Linux" &&
                ("${{ steps.clippy.outcome }}" != "success" ||
                 "${{ steps.audit.outcome }}" != "success") ]]; then
            echo "Required Linux review checks failed."
            exit 1
          fi

          if [[ "${{ steps.dependency_gate.outcome }}" != "success" ||
                "${{ steps.integrity_gate.outcome }}" != "success" ||
                "${{ steps.secret_gate.outcome }}" != "success" ||
                "${{ steps.control_gate.outcome }}" != "success" ]]; then
            echo "One or more security review gates failed."
            exit 1
          fi
