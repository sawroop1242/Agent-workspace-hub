name: AWH Approve To Verified Merge

on:
  repository_dispatch:
    types: [awh.review-complete]

permissions:
  contents: write
  pull-requests: read
  checks: read
  actions: write

jobs:
  authorize-merge:
    if: github.event.client_payload.review_state == 'APPROVE'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.AWH_AUTOMATION_TOKEN }}
      FEATURE_ID: ${{ github.event.client_payload.feature_id }}
      OPERATION_ID: ${{ github.event.client_payload.operation_id }}
      PR_NUMBER: ${{ github.event.client_payload.pr_number }}
      REVIEWED_SHA: ${{ github.event.client_payload.reviewed_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rust
          fetch-depth: 0
          token: ${{ secrets.AWH_AUTOMATION_TOKEN }}

      - name: Validate approval identity
        run: |
          test -n "$FEATURE_ID"
          test -n "$OPERATION_ID"
          test -n "$PR_NUMBER"
          test -n "$REVIEWED_SHA"
          python scripts/validate_feature_id.py "$FEATURE_ID"
          python scripts/checkpoint_state.py validate
          test "$(jq -r '.status' .openhands/state.json)" = PR_OPEN
          test "$(jq -r '.active_feature' .openhands/state.json)" = "$FEATURE_ID"
          test "$(jq -r '.operation_id' .openhands/state.json)" = "$OPERATION_ID"
          test "$(jq -r '.active_pr' .openhands/state.json)" = "$PR_NUMBER"
          test "$(jq -r '.active_pr_sha' .openhands/state.json)" = "$REVIEWED_SHA"

      - name: Revalidate PR head before MERGING CAS
        run: |
          DATA=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json state,baseRefName,headRefOid,isCrossRepository)
          test "$(echo "$DATA" | jq -r .state)" = OPEN
          test "$(echo "$DATA" | jq -r .baseRefName)" = rust
          test "$(echo "$DATA" | jq -r .headRefOid)" = "$REVIEWED_SHA"
          test "$(echo "$DATA" | jq -r .isCrossRepository)" = false

      - name: CAS PR_OPEN to MERGING
        run: |
          python scripts/checkpoint_state.py transition \
            --expect-status PR_OPEN \
            --expect-operation-id "$OPERATION_ID" \
            --to MERGING \
            --set active_feature="$(python -c 'import json,os; print(json.dumps(os.environ["FEATURE_ID"]))')" \
            --set active_pr="$(python -c 'import os; print(int(os.environ["PR_NUMBER"]))')" \
            --set active_pr_sha="$(python -c 'import json,os; print(json.dumps(os.environ["REVIEWED_SHA"]))')" \
            --set last_error=null
          git config user.name 'AWH Automation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .openhands/state.json
          python scripts/safe_git.py push --branch rust --message "chore(automation): authorize merge $FEATURE_ID"

      - name: Dispatch verified merger
        run: |
          jq -n --arg feature "$FEATURE_ID" --arg op "$OPERATION_ID" --arg pr "$PR_NUMBER" --arg sha "$REVIEWED_SHA" \
            '{event_type:"awh.merge",client_payload:{feature_id:$feature,operation_id:$op,pr_number:($pr|tonumber),reviewed_sha:$sha}}' > /tmp/merge-payload.json
          gh api "repos/$GITHUB_REPOSITORY/dispatches" --method POST --input /tmp/merge-payload.json
