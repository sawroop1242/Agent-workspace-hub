name: AWH Compliance Validation

on:
  pull_request:
    branches: [rust]
  workflow_dispatch:

concurrency:
  group: awh-compliance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Compliance checks are external CI infrastructure. This workflow is
# read-only and must never become an AWH runtime dependency.
permissions:
  contents: read

jobs:
  compliance:
    name: Compliance Validation (Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Capture compliance environment
        shell: bash
        run: |
          set -u
          mkdir -p artifacts
          {
            echo '# AWH compliance validation environment'
            echo "OS=${RUNNER_OS}"
            echo "ARCH=${RUNNER_ARCH}"
            echo "REF=${GITHUB_REF}"
            echo "SHA=${GITHUB_SHA}"
            rustc --version || true
            cargo --version || true
          } | tee artifacts/environment.txt

      - name: Verify repository is clean before validation
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"

      - name: Required Rust formatting check
        shell: bash
        run: cargo fmt --all -- --check

      - name: Required Rust build check
        shell: bash
        run: cargo check --all-targets

      - name: Required Rust test suite
        shell: bash
        run: cargo test --all-targets

      - name: Required Rust Clippy check
        shell: bash
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Validate locked release build
        shell: bash
        run: cargo build --release --locked

      - name: Validate repository governance documents
        shell: bash
        run: |
          set -euo pipefail
          required_files=(
            docs/PROJECT_CONTEXT.md
            docs/PROJECT_ROADMAP.md
            docs/PROJECT_ROADMAP_STATUS.md
            docs/development.md
            docs/security.md
            docs/error.md
            docs/completeness-audit.md
            docs/issue-resolving-prompts/README.md
            .github/agent/system.md
            .github/agent/rules.md
            .github/agent/verification.md
            .github/agent/task-template.md
            .github/agent/completion.md
          )

          : > artifacts/required-documents.txt
          for file in "${required_files[@]}"; do
            if [[ ! -f "$file" ]]; then
              echo "Missing required compliance document: $file"
              exit 1
            fi
            printf '%s\n' "$file" >> artifacts/required-documents.txt
          done

      - name: Validate workflow governance and read-only permissions
        shell: bash
        run: |
          set -euo pipefail
          : > artifacts/workflow-governance.txt
          workflow_files=(.github/workflows/*.yml .github/workflows/*.yaml)
          for file in "${workflow_files[@]}"; do
            [[ -f "$file" ]] || continue
            printf '%s\n' "--- $file" >> artifacts/workflow-governance.txt
            grep -nE '^[[:space:]]*permissions:|^[[:space:]]*contents:[[:space:]]*read|^[[:space:]]*concurrency:' "$file" \
              >> artifacts/workflow-governance.txt || true
          done

          # This workflow itself must remain read-only.
          grep -qE '^permissions:$' .github/workflows/16-compliance.yml
          grep -qE '^  contents: read$' .github/workflows/16-compliance.yml
          grep -qE '^concurrency:$' .github/workflows/16-compliance.yml
          grep -qE 'cancel-in-progress: true' .github/workflows/16-compliance.yml

      - name: Validate license and repository notices
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '# License and notice inventory'
            find . -maxdepth 3 -type f \( \
              -iname 'LICENSE' -o -iname 'LICENSE.*' -o -iname 'NOTICE' -o -iname 'NOTICE.*' \
            \) -print | sort
          } | tee artifacts/license-notice-inventory.txt

          if [[ -f Cargo.toml ]]; then
            grep -nE '^license([[:space:]]*=|[[:space:]])|^license-file([[:space:]]*=|[[:space:]])' Cargo.toml \
              | tee artifacts/cargo-license-metadata.txt || true
          fi

      - name: Validate dependency and runtime boundaries
        shell: bash
        run: |
          set -euo pipefail
          cargo metadata --format-version 1 > artifacts/cargo-metadata.json
          cargo tree --all-features > artifacts/cargo-tree.txt

          # External agents, benchmarks, scanners, and CI helpers are tooling,
          # not AWH runtime dependencies.
          forbidden='swe-bench|swe-smith|codeclash|swe-rex|mini-swe-agent|swe-agent|sb-cli|openhands|cargo-audit|cargo-deny|gitleaks|semgrep|trivy'
          if grep -Eiq "$forbidden" Cargo.toml Cargo.lock; then
            echo 'External CI/compliance tooling detected in AWH runtime manifests.'
            grep -Ein "$forbidden" Cargo.toml Cargo.lock || true
            exit 1
          fi

      - name: Validate repository hygiene and compliance-sensitive paths
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '# Repository hygiene inventory'
            git ls-files | sort
          } > artifacts/tracked-files.txt

          if git ls-files | grep -E '(^|/)(\.env|\.env\.|.*\.pem$|.*\.key$|.*\.p12$|.*\.pfx$)' > artifacts/sensitive-tracked-files.txt; then
            echo 'Potential secret-bearing files are tracked in the repository.'
            cat artifacts/sensitive-tracked-files.txt
            exit 1
          fi

          git diff --check

      - name: Collect compliance diagnostics
        if: always()
        shell: bash
        run: |
          set +e
          git status --short > artifacts/git-status.txt
          git diff --check > artifacts/diff-check.txt
          git diff -- . > artifacts/tracked-diff.txt
          cargo metadata --format-version 1 > artifacts/cargo-metadata-final.json 2>&1
          cargo tree --all-features > artifacts/cargo-tree-final.txt 2>&1

      - name: Upload compliance artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: awh-compliance-validation
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14

      - name: Final read-only integrity gate
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git diff --quiet -- .
          echo 'Compliance validation completed without modifying tracked AWH files.'
