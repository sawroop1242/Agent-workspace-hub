name: AWH Checkpoint Recovery

on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: awh-checkpoint-recovery
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.AWH_AUTOMATION_TOKEN }}
      STALE_MINUTES: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rust
          fetch-depth: 0
          token: ${{ secrets.AWH_AUTOMATION_TOKEN }}

      - name: Validate checkpoint and recover stale work
        run: |
          python scripts/checkpoint_state.py validate
          python - <<'PY'
          import json, os, subprocess
          from datetime import datetime, timezone
          from pathlib import Path

          state = json.loads(Path('.openhands/state.json').read_text(encoding='utf-8'))
          status = state['status']
          feature = state['active_feature']
          pr = state['active_pr']
          updated = state['updated_at']
          stale_minutes = int(os.environ['STALE_MINUTES'])

          if status in {'IDLE', 'COMPLETED', 'BLOCKED'}:
              print(f'No recoverable checkpoint: status={status}')
              raise SystemExit(0)

          if not updated:
              stale = True
          else:
              stamp = datetime.fromisoformat(updated.replace('Z', '+00:00'))
              age = (datetime.now(timezone.utc) - stamp).total_seconds() / 60
              stale = age >= stale_minutes
              print(f'Checkpoint status={status}, feature={feature}, PR={pr}, age={age:.1f}m, stale={stale}')
          if not stale:
              raise SystemExit(0)

          repo = os.environ['GITHUB_REPOSITORY']
          def dispatch(event_type, payload):
              body = json.dumps({'event_type': event_type, 'client_payload': payload})
              subprocess.run(['gh', 'api', f'repos/{repo}/dispatches', '--method', 'POST', '--input', '-'], input=body, text=True, check=True)

          if status == 'PLANNING':
              payload = {'reason': 'checkpoint_resume'}
              if feature:
                  payload['feature_id'] = feature
              dispatch('awh.start', payload)
          elif status == 'BUILDING':
              if not feature:
                  raise SystemExit('BUILDING checkpoint has no active_feature; refusing unsafe recovery.')
              dispatch('awh.build', {'feature_id': feature, 'reason': 'checkpoint_resume'})
          elif status == 'FIXING':
              if not feature or not state['last_review']:
                  raise SystemExit('FIXING checkpoint is missing active_feature or saved reviewer feedback; refusing unsafe recovery.')
              dispatch('awh.fix', {'feature_id': feature, 'review': state['last_review'], 'reason': 'checkpoint_resume'})
          elif status in {'REVIEWING', 'PR_OPEN'}:
              if not pr:
                  raise SystemExit(f'{status} checkpoint has no active_pr; refusing unsafe recovery.')
              dispatch('awh.review', {'pr_number': pr, 'feature_id': feature or '', 'reason': 'checkpoint_resume'})
          else:
              raise SystemExit(f'Unknown checkpoint status: {status}')
          PY
