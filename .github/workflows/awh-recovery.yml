name: AWH Checkpoint Recovery

on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [awh.recover]

permissions:
  contents: write
  actions: read
  pull-requests: read

concurrency:
  group: awh-checkpoint-recovery
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ secrets.AWH_AUTOMATION_TOKEN }}
  STALE_MINUTES: 90
  LEASE_MINUTES: 120
  RECOVERY_OWNER: awh-recovery-${{ github.run_id }}

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rust
          fetch-depth: 0
          token: ${{ secrets.AWH_AUTOMATION_TOKEN }}

      - name: Sync checkpoint from the shared branch
        run: |
          git config user.name 'AWH Recovery'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python scripts/safe_git.py sync --branch rust

      - name: Observe the identity to recover
        id: observe
        run: |
          FEATURE=$(jq -r '.active_feature // ""' .openhands/state.json)
          OPERATION_ID=$(jq -r '.operation_id // ""' .openhands/state.json)
          STATUS=$(jq -r '.status' .openhands/state.json)
          if [ -z "$FEATURE" ]; then
            echo 'No active feature on the shared checkpoint; nothing to recover.'
            exit 0
          fi
          echo "feature=$FEATURE" >> "$GITHUB_OUTPUT"
          echo "operation_id=$OPERATION_ID" >> "$GITHUB_OUTPUT"
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"

      - name: Validate explicit recovery request identity
        id: request_gate
        if: github.event_name == 'repository_dispatch'
        run: |
          REQUESTED_FEATURE='${{ github.event.client_payload.feature_id }}'
          REQUESTED_OPERATION='${{ github.event.client_payload.operation_id }}'
          CURRENT_FEATURE='${{ steps.observe.outputs.feature }}'
          CURRENT_OPERATION='${{ steps.observe.outputs.operation_id }}'
          if [ "$REQUESTED_FEATURE" != "$CURRENT_FEATURE" ] || [ "$REQUESTED_OPERATION" != "$CURRENT_OPERATION" ]; then
            echo 'valid=false' >> "$GITHUB_OUTPUT"
            echo "STALE_RECOVERY_REQUEST: requested=$REQUESTED_FEATURE/$REQUESTED_OPERATION current=$CURRENT_FEATURE/$CURRENT_OPERATION"
            exit 0
          fi
          echo 'valid=true' >> "$GITHUB_OUTPUT"
          echo 'Recovery request identity matches the authoritative checkpoint.'

      - name: Atomically claim recovery of stale work
        id: claim
        if: steps.observe.outputs.feature != '' && (github.event_name != 'repository_dispatch' || steps.request_gate.outputs.valid == 'true')
        run: |
          result="$(python scripts/awh_pipeline.py claim-recovery \
            --feature "${{ steps.observe.outputs.feature }}" \
            --operation-id "${{ steps.observe.outputs.operation_id }}" \
            --claim-owner "$RECOVERY_OWNER" \
            --stale-minutes "$STALE_MINUTES" \
            --lease-minutes "$LEASE_MINUTES" | tail -n1)"
          case "$result" in
            CLAIMED) echo 'Recovery claim acquired' ;;
            LOST_CLAIM) echo 'Another recovery worker won the claim; exiting safely' ;;
            NO_OP) echo 'Nothing recoverable right now; exiting safely' ;;
            *) echo "::error::Recovery claim failed (result: $result)"; exit 1 ;;
          esac
          echo "result=$result" >> "$GITHUB_OUTPUT"

      - name: Repair an invalidated merge approval before normal recovery
        id: sha_repair
        if: steps.claim.outputs.result == 'CLAIMED'
        run: |
          STALE_STATUS=$(jq -r '.recovery_claim.stale_status // empty' .openhands/state.json)
          if [ "$STALE_STATUS" != "MERGING" ]; then echo 'handled=false' >> "$GITHUB_OUTPUT"; exit 0; fi
          PR=$(jq -r '.active_pr // empty' .openhands/state.json)
          FEATURE=$(jq -r '.active_feature // empty' .openhands/state.json)
          EXPECTED=$(jq -r '.active_pr_sha // empty' .openhands/state.json)
          if [ -z "$PR" ] || [ -z "$EXPECTED" ]; then echo 'handled=false' >> "$GITHUB_OUTPUT"; exit 0; fi
          PRDATA=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json state,baseRefName,isCrossRepository,headRefOid)
          if [ "$(echo "$PRDATA" | jq -r '.state')" != OPEN ] || [ "$(echo "$PRDATA" | jq -r '.baseRefName')" != rust ] || [ "$(echo "$PRDATA" | jq -r '.isCrossRepository')" != false ]; then echo 'handled=false' >> "$GITHUB_OUTPUT"; exit 0; fi
          CURRENT=$(echo "$PRDATA" | jq -r '.headRefOid')
          if [ "$CURRENT" = "$EXPECTED" ]; then echo 'handled=false' >> "$GITHUB_OUTPUT"; exit 0; fi
          python scripts/awh_pipeline.py finalize-recovery \
            --owner "$RECOVERY_OWNER" --to REVIEWING \
            --message 'chore(automation): invalidate stale merge approval' \
            --set active_pr_sha="$(printf '%s' "$CURRENT" | python -c 'import json,sys; print(json.dumps(sys.stdin.read().strip()))')"
          jq -n --arg feature "$FEATURE" --arg pr "$PR" --arg sha "$CURRENT" \
            '{event_type:"awh.review",client_payload:{feature_id:$feature,pr_number:($pr|tonumber),reviewed_sha:$sha,reason:"merge approval invalidated by head change"}}' > /tmp/review-payload.json
          gh api "repos/$GITHUB_REPOSITORY/dispatches" --method POST --input /tmp/review-payload.json
          echo 'handled=true' >> "$GITHUB_OUTPUT"

      - name: Inspect reality and decide the safe continuation
        if: steps.claim.outputs.result == 'CLAIMED' && steps.sha_repair.outputs.handled != 'true'
        run: |
          python scripts/awh_pipeline.py decide-recovery | tee /tmp/decision.txt
          TARGET=$(sed -n 's/^TARGET=//p' /tmp/decision.txt | head -n1)
          REASON=$(sed -n 's/^REASON=//p' /tmp/decision.txt | head -n1)
          EVENT=$(sed -n 's/^DISPATCH_EVENT=//p' /tmp/decision.txt | head -n1)
          PAYLOAD=$(sed -n 's/^DISPATCH_PAYLOAD=//p' /tmp/decision.txt | head -n1)
          test -n "$TARGET" -a -n "$REASON"
          echo "Recovery decision: $TARGET ($REASON)"
          if [ "$TARGET" = "BLOCKED" ]; then
            echo 'No safe continuation; releasing recovery claim back to BLOCKED.'
            python scripts/awh_pipeline.py finalize-recovery \
              --owner "$RECOVERY_OWNER" --to BLOCKED \
              --message 'chore(automation): recovery found no safe continuation'
            exit 0
          fi
          python scripts/awh_pipeline.py finalize-recovery \
            --owner "$RECOVERY_OWNER" --to "$TARGET" \
            --message "chore(automation): recovery resumed as $TARGET"
          if [ -n "$EVENT" ]; then
            python3 - "$EVENT" "$PAYLOAD" <<'PY'
import json, os, subprocess, sys

event, payload = sys.argv[1], sys.argv[2]
checkpoint = json.load(open('.openhands/state.json'))
client_payload = json.loads(payload)
client_payload['operation_id'] = checkpoint['operation_id']
body = {'event_type': event, 'client_payload': client_payload}
subprocess.run([
    'gh', 'api', f"repos/{os.environ['GITHUB_REPOSITORY']}/dispatches",
    '--method', 'POST', '--input', '-'
], input=json.dumps(body), text=True, check=True)
print(f"dispatched {event} for {checkpoint['operation_id']}")
PY
          fi

      - name: Record recovery failure
        if: failure() && steps.claim.outputs.result != 'LOST_CLAIM' && steps.claim.outputs.result != 'NO_OP'
        run: |
          python scripts/awh_pipeline.py record-failure \
            --agent recovery --stage recover \
            --detail 'recovery failed; checkpoint remains protected by CAS' || true
