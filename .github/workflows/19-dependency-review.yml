name: AWH Dependency Review Validation

on:
  pull_request:
    branches: [rust]
  workflow_dispatch:

concurrency:
  group: awh-dependency-review-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Dependency review is external CI infrastructure. It may inspect manifests,
# lockfiles and dependency metadata, but it must never modify AWH runtime state.
permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency Review (Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Capture dependency review environment
        shell: bash
        run: |
          set -u
          mkdir -p artifacts
          {
            echo '# AWH dependency review validation environment'
            echo "repository=${GITHUB_REPOSITORY}"
            echo "ref=${GITHUB_REF}"
            echo "sha=${GITHUB_SHA}"
            echo "event=${GITHUB_EVENT_NAME}"
            echo "runner_os=${RUNNER_OS}"
            echo "runner_arch=${RUNNER_ARCH}"
            rustc --version || true
            cargo --version || true
          } | tee artifacts/environment.txt

      - name: Verify repository is clean before validation
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"

      - name: Required Rust formatting check
        shell: bash
        run: cargo fmt --all -- --check

      - name: Required Rust build check
        shell: bash
        run: cargo check --all-targets

      - name: Required Rust test suite
        shell: bash
        run: cargo test --all-targets

      - name: Required Rust Clippy check
        shell: bash
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Validate locked dependency resolution
        shell: bash
        run: cargo check --locked --all-targets

      - name: Generate dependency metadata
        shell: bash
        run: |
          set -euo pipefail
          cargo metadata --format-version 1 > artifacts/cargo-metadata.json
          cargo tree --all-features > artifacts/cargo-tree.txt
          cargo tree --all-features --edges normal > artifacts/cargo-tree-normal.txt
          sha256sum Cargo.toml Cargo.lock > artifacts/manifest-sha256.txt

      - name: Review dependency sources and duplicates
        shell: bash
        run: |
          set -euo pipefail
          cargo tree --all-features --duplicates > artifacts/duplicate-dependencies.txt || true
          cargo tree --all-features --invert tokio > artifacts/tokio-dependents.txt || true
          cargo tree --all-features --invert reqwest > artifacts/reqwest-dependents.txt || true

          # Record crates.io/git/path source information for review without
          # changing Cargo.toml, Cargo.lock, or the runtime dependency graph.
          python3 - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path('artifacts/cargo-metadata.json').read_text())
          lines = []
          for package in sorted(data.get('packages', []), key=lambda p: (p.get('name', ''), p.get('version', ''))):
              source = package.get('source') or 'workspace/path'
              lines.append(f"{package.get('name')} {package.get('version')} :: {source}")
          Path('artifacts/dependency-sources.txt').write_text('\n'.join(lines) + '\n')
          PY

      - name: Enforce AWH runtime dependency boundary
        shell: bash
        run: |
          set -euo pipefail
          # These tools are CI/review infrastructure only. They must never be
          # added as AWH runtime dependencies.
          forbidden='swe-bench|swe-smith|codeclash|swe-rex|mini-swe-agent|swe-agent|sb-cli|openhands|prometheus|opentelemetry|opentelemetry-otlp|grafana|jaeger|datadog|sentry|honeycomb|newrelic|cargo-audit|cargo-deny|gitleaks|semgrep|trivy'
          if grep -Eiq "$forbidden" Cargo.toml Cargo.lock; then
            echo 'Forbidden CI/review/observability tooling detected in AWH runtime manifests.'
            grep -Ein "$forbidden" Cargo.toml Cargo.lock || true
            exit 1
          fi

          # Dependency-review workflow code itself is not an AWH runtime input.
          if grep -RniE "$forbidden" src 2>/dev/null; then
            echo 'Forbidden CI-only tooling reference detected under src/.'
            exit 1
          fi

      - name: Check lockfile integrity
        shell: bash
        run: |
          set -euo pipefail
          cargo metadata --locked --format-version 1 > artifacts/cargo-metadata-locked.json
          git diff --check
          git diff -- Cargo.toml Cargo.lock > artifacts/dependency-manifest-diff.txt

      - name: Collect dependency review diagnostics
        if: always()
        shell: bash
        run: |
          set +e
          git status --short > artifacts/final-git-status.txt
          git diff -- . > artifacts/final-tracked-diff.txt
          cargo metadata --format-version 1 > artifacts/final-cargo-metadata.json 2>&1
          cargo tree --all-features > artifacts/final-cargo-tree.txt 2>&1
          cargo tree --all-features --duplicates > artifacts/final-duplicates.txt 2>&1

      - name: Upload dependency review artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: awh-dependency-review
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14

      - name: Final read-only integrity gate
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git diff --quiet -- .
          echo 'Dependency review completed without modifying tracked AWH files.'
