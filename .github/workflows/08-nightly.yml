name: AWH Nightly Validation

on:
  schedule:
    - cron: '30 18 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: awh-nightly-${{ github.workflow }}
  cancel-in-progress: true

# NIGHTLY VALIDATION BOUNDARY:
# This workflow is an external validation layer for AWH. It performs recurring
# quality, security, dependency, and runtime smoke checks on GitHub-hosted
# runners. It does not modify AWH, publish releases, push commits, or install
# external agents/benchmarks as AWH runtime dependencies.

jobs:
  nightly:
    name: Nightly validation (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Checkout AWH
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Capture environment
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "revision=$(git rev-parse HEAD)"
            echo "runner_os=${RUNNER_OS}"
            echo "runner_arch=${RUNNER_ARCH}"
            rustc --version
            cargo --version
          } | tee nightly-context.txt

      - name: Format
        id: fmt
        continue-on-error: true
        run: cargo fmt --all -- --check

      - name: Check
        id: check
        continue-on-error: true
        run: cargo check --all-targets

      - name: Tests
        id: test
        continue-on-error: true
        run: cargo test --all-targets

      - name: Clippy
        id: clippy
        if: runner.os == 'Linux'
        continue-on-error: true
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Dependency audit
        id: audit
        if: runner.os == 'Linux'
        continue-on-error: true
        run: |
          cargo install --locked cargo-audit
          cargo audit --json > nightly-cargo-audit.json

      - name: Release build smoke test
        id: release_build
        continue-on-error: true
        run: cargo build --release --locked

      - name: AWH CLI smoke test
        id: cli_smoke
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          binary="target/release/awh"
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            binary="target/release/awh.exe"
          fi
          test -f "$binary"
          "$binary" --help > nightly-help.txt
          "$binary" --version > nightly-version.txt

      - name: Verify external tooling stays outside AWH runtime
        id: runtime_boundary
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          forbidden='(mini-swe-agent|swe-agent|swe-rex|swe-bench|swebench|swe-smith|swe_smith|codeclash|sb-cli|openhands)'
          if grep -Eiq "$forbidden" Cargo.toml Cargo.lock; then
            echo "External agent/benchmark tooling detected in AWH runtime manifests."
            exit 1
          fi
          cargo tree > nightly-cargo-tree.txt
          if grep -Eiq "$forbidden" nightly-cargo-tree.txt; then
            echo "External agent/benchmark tooling detected in AWH dependency tree."
            exit 1
          fi

      - name: Collect nightly diagnostics
        if: always()
        shell: bash
        run: |
          set +e
          cargo metadata --format-version 1 > nightly-cargo-metadata.json 2> nightly-cargo-metadata.stderr
          cargo tree > nightly-cargo-tree-full.txt 2>&1
          git diff --check > nightly-diff-check.txt 2>&1
          git status --short > nightly-status.txt 2>&1
          {
            echo "fmt=${{ steps.fmt.outcome }}"
            echo "check=${{ steps.check.outcome }}"
            echo "test=${{ steps.test.outcome }}"
            echo "clippy=${{ steps.clippy.outcome }}"
            echo "audit=${{ steps.audit.outcome }}"
            echo "release_build=${{ steps.release_build.outcome }}"
            echo "cli_smoke=${{ steps.cli_smoke.outcome }}"
            echo "runtime_boundary=${{ steps.runtime_boundary.outcome }}"
          } > nightly-report.txt
          cat nightly-report.txt

      - name: Upload nightly artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: awh-nightly-${{ matrix.os }}-${{ github.run_id }}
          path: |
            nightly-context.txt
            nightly-report.txt
            nightly-cargo-audit.json
            nightly-cargo-tree.txt
            nightly-cargo-tree-full.txt
            nightly-cargo-metadata.json
            nightly-cargo-metadata.stderr
            nightly-help.txt
            nightly-version.txt
            nightly-diff-check.txt
            nightly-status.txt
          if-no-files-found: ignore
          retention-days: 14

      - name: Enforce nightly validation
        if: always()
        shell: bash
        run: |
          if [[ "${{ steps.fmt.outcome }}" != "success" ||
                "${{ steps.check.outcome }}" != "success" ||
                "${{ steps.test.outcome }}" != "success" ||
                "${{ steps.release_build.outcome }}" != "success" ||
                "${{ steps.cli_smoke.outcome }}" != "success" ||
                "${{ steps.runtime_boundary.outcome }}" != "success" ]]; then
            echo "Nightly validation failed. See uploaded artifacts."
            exit 1
          fi
          if [[ "${{ runner.os }}" == "Linux" &&
                ("${{ steps.clippy.outcome }}" != "success" ||
                 "${{ steps.audit.outcome }}" != "success") ]]; then
            echo "Linux nightly validation failed. See uploaded artifacts."
            exit 1
          fi

      - name: Verify tracked AWH files were not modified
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --quiet -- .; then
            echo "Nightly workflow modified tracked AWH files."
            git status --short
            git diff -- .
            exit 1
          fi
