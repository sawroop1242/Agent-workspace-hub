name: AWH Agent 3 Reviewer

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
  repository_dispatch:
    types: [awh.review]

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: awh-review-${{ github.event.pull_request.number || github.event.client_payload.pr_number }}
  cancel-in-progress: true

env:
  AWH_LLM_MODEL: moonshotai/kimi-k3
  AWH_LLM_BASE_URL: https://integrate.api.nvidia.com/v1

jobs:
  review:
    if: >-
      (github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'repository_dispatch' && github.event.action == 'awh.review')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ secrets.AWH_AUTOMATION_TOKEN }}
      K1: ${{ secrets.AWH_AGENT3_NVIDIA_KEY_1 }}
      K2: ${{ secrets.AWH_AGENT3_NVIDIA_KEY_2 }}
      K3: ${{ secrets.AWH_AGENT3_NVIDIA_KEY_3 }}
      KF: ${{ secrets.AWH_ROUTINE_NVIDIA_KEY }}
      AWH_AGENT_ROLE: reviewer
      AWH_PR: ${{ github.event.pull_request.number || github.event.client_payload.pr_number }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rust
          fetch-depth: 0
          token: ${{ secrets.AWH_AUTOMATION_TOKEN }}

      - name: Verify required LLM secrets
        run: |
          test -n "$K1" || { echo 'Missing required secret: AWH_AGENT3_NVIDIA_KEY_1'; exit 1; }
          test -n "$KF" || { echo 'Missing required secret: AWH_ROUTINE_NVIDIA_KEY'; exit 1; }
          echo 'Required Agent 3 key and routine fallback are configured.'
          [ -n "$K2" ] && echo 'Optional Agent 3 key 2 configured.' || echo 'Optional Agent 3 key 2 not configured.'
          [ -n "$K3" ] && echo 'Optional Agent 3 key 3 configured.' || echo 'Optional Agent 3 key 3 not configured.'

      - name: Checkpoint reviewer start
        env:
          PR: ${{ github.event.pull_request.number || github.event.client_payload.pr_number }}
        run: |
          test -n "$PR"
          python - <<'PY'
          import json, os, subprocess
          from datetime import datetime, timezone
          from pathlib import Path
          pr=int(os.environ['PR'])
          try:
              feature=subprocess.check_output(['gh','pr','view',str(pr),'--repo',os.environ['GITHUB_REPOSITORY'],'--json','headRefName','--jq','.headRefName'],text=True).strip().removeprefix('feature/')
          except Exception:
              feature=''
          p=Path('.openhands/state.json'); s=json.loads(p.read_text())
          s.update({'status':'REVIEWING','active_feature':feature or s.get('active_feature'),'active_pr':pr,'updated_at':datetime.now(timezone.utc).isoformat().replace('+00:00','Z'),'last_error':None})
          p.write_text(json.dumps(s, indent=2)+"\n")
          PY
          git config user.name 'AWH Automation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .openhands/state.json
          git commit -m 'chore(automation): checkpoint reviewer start' || true
          git push origin rust

      - name: Install OpenHands SDK
        run: python -m pip install --disable-pip-version-check 'openhands-sdk>=1.0,<2'

      - name: Run Agent 3 with optional three-key Kimi K3 rotation and required routine fallback
        run: |
          set +e
          SUCCESS=0
          for KEY_NAME in K1 K2 K3 KF; do
            KEY="${!KEY_NAME}"
            [ -n "$KEY" ] || continue
            echo "Agent 3: trying NVIDIA Kimi K3 key pool slot $KEY_NAME"
            AWH_LLM_API_KEY="$KEY" python scripts/openhands_agent.py > /tmp/review.txt 2>&1
            RC=$?
            cat /tmp/review.txt
            if [ "$RC" -eq 0 ]; then
              SUCCESS=1
              break
            fi
            if grep -Eiq '(^|[^0-9])429([^0-9]|$)|rate.?limit|too many requests' /tmp/review.txt; then
              echo "Rate limit detected for $KEY_NAME; rotating to the next key."
              continue
            fi
            echo "Agent 3 failed for a non-rate-limit reason."
            exit "$RC"
          done
          test "$SUCCESS" -eq 1

      - name: Publish review and dispatch merge/fix gate
        env:
          PR: ${{ github.event.pull_request.number || github.event.client_payload.pr_number }}
        run: |
          python - <<'PY'
          import json, os, subprocess
          from datetime import datetime, timezone
          from pathlib import Path
          repo=os.environ['GITHUB_REPOSITORY']; pr=os.environ['PR']
          review=Path('.openhands/review.md').read_text(encoding='utf-8').strip()
          verdict=[x.split(':',1)[1].strip() for x in review.splitlines() if x.startswith('VERDICT:')][-1]
          prdata=json.loads(subprocess.check_output(['gh','pr','view',pr,'--repo',repo,'--json','body']))
          old=prdata.get('body') or ''
          marker='<!-- AWH_AGENT3_REVIEW -->'
          section=f"{marker}\n## Agent 3 Review — Kimi K3\n\n{review}\n\n{marker}"
          if marker in old:
              old=old.split(marker,1)[0].rstrip()
          new=(old+'\n\n'+section).strip()
          subprocess.run(['gh','pr','edit',pr,'--repo',repo,'--body',new],check=True)
          feature=subprocess.check_output(['gh','pr','view',pr,'--repo',repo,'--json','headRefName','--jq','.headRefName'],text=True).strip().removeprefix('feature/')
          state_path=Path('.openhands/state.json')
          state=json.loads(state_path.read_text())
          state.update({'active_feature':feature,'active_pr':int(pr),'updated_at':datetime.now(timezone.utc).isoformat().replace('+00:00','Z'),'last_review':review,'last_error':None})
          if verdict == 'APPROVE':
              state['status']='PR_OPEN'
          elif verdict == 'CHANGES_REQUIRED':
              state['status']='FIXING'
          else:
              state['status']='BLOCKED'
          state_path.write_text(json.dumps(state, indent=2)+'\n')
          subprocess.run(['git','config','user.name','AWH Automation'],check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
          subprocess.run(['git','add','.openhands/state.json'],check=True)
          subprocess.run(['git','commit','-m','chore(automation): checkpoint reviewer verdict'],check=False)
          subprocess.run(['git','push','origin','rust'],check=True)
          payload={'event_type':'awh.review-complete','client_payload':{'pr_number':int(pr),'feature_id':feature,'review_state':verdict,'review':review}}
          subprocess.run(['gh','api',f'repos/{repo}/dispatches','--method','POST','--input','-'],input=json.dumps(payload),text=True,check=True)
          print(f'Agent 3 verdict: {verdict}; feature: {feature}')
          PY
