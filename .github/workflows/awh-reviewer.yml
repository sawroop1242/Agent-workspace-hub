name: AWH Agent 3 Reviewer

on:
  pull_request_target:
    types: [opened, reopened]
  repository_dispatch:
    types: [awh.review]

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: ${{ github.workflow }}-pr-${{ github.event.pull_request.number || github.event.client_payload.pr_number }}
  cancel-in-progress: false
  queue: max

env:
  AWH_LLM_MODEL: moonshotai/kimi-k3
  AWH_LLM_BASE_URL: https://integrate.api.nvidia.com/v1

jobs:
  review:
    if: >-
      (github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'repository_dispatch' && github.event.action == 'awh.review')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ secrets.AWH_AUTOMATION_TOKEN }}
      K1: ${{ secrets.AWH_AGENT3_NVIDIA_KEY_1 }}
      K2: ${{ secrets.AWH_AGENT3_NVIDIA_KEY_2 }}
      K3: ${{ secrets.AWH_AGENT3_NVIDIA_KEY_3 }}
      KF: ${{ secrets.AWH_ROUTINE_NVIDIA_KEY }}
      AWH_AGENT_ROLE: reviewer
      AWH_PR: ${{ github.event.pull_request.number || github.event.client_payload.pr_number }}
      AWH_EVENT_FEATURE: ${{ github.event.client_payload.feature_id || '' }}
      AWH_EVENT_REVIEWED_SHA: ${{ github.event.client_payload.reviewed_sha || '' }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: rust
          fetch-depth: 0
          token: ${{ secrets.AWH_AUTOMATION_TOKEN }}

      - name: Sync checkpoint from the shared branch
        run: python scripts/safe_git.py sync --branch rust

      - name: Classify review request without mutating pipeline state
        id: validate_event
        env:
          PR: ${{ github.event.pull_request.number || github.event.client_payload.pr_number }}
        run: |
          set -e
          test -n "$PR"
          PRDATA=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json state,baseRefName,isCrossRepository,headRefOid,headRefName)
          if [ "$(echo "$PRDATA" | jq -r '.isCrossRepository')" != false ]; then
            echo 'stale=true' >> "$GITHUB_OUTPUT"
            echo "STALE_EVENT: PR $PR is cross-repository; safe no-op."
            exit 0
          fi
          if [ "$(echo "$PRDATA" | jq -r '.baseRefName')" != rust ]; then
            echo 'stale=true' >> "$GITHUB_OUTPUT"
            echo "STALE_EVENT: PR $PR does not target rust; safe no-op."
            exit 0
          fi
          if [ "$(echo "$PRDATA" | jq -r '.state')" != OPEN ]; then
            echo 'stale=true' >> "$GITHUB_OUTPUT"
            echo "STALE_EVENT: PR $PR is not open; safe no-op."
            exit 0
          fi

          CURRENT_SHA=$(echo "$PRDATA" | jq -r '.headRefOid')
          CHECKPOINT_STATUS=$(jq -r '.status' .openhands/state.json)
          CHECKPOINT_PR=$(jq -r '.active_pr // empty' .openhands/state.json)
          CHECKPOINT_FEATURE=$(jq -r '.active_feature // empty' .openhands/state.json)
          CHECKPOINT_SHA=$(jq -r '.active_pr_sha // empty' .openhands/state.json)
          EVENT_FEATURE="$AWH_EVENT_FEATURE"

          # repository_dispatch is reserved for the autonomous Agent 2 review
          # loop. It must carry the exact reviewed SHA; otherwise it is stale.
          if [ "$GITHUB_EVENT_NAME" = "repository_dispatch" ]; then
            if [ -z "$AWH_EVENT_REVIEWED_SHA" ]; then
              echo 'stale=true' >> "$GITHUB_OUTPUT"
              echo "STALE_EVENT: repository_dispatch review for PR $PR has no reviewed_sha; safe no-op."
              exit 0
            fi
            if [ "$AWH_EVENT_REVIEWED_SHA" != "$CURRENT_SHA" ] || [ "$AWH_EVENT_REVIEWED_SHA" != "$CHECKPOINT_SHA" ]; then
              echo 'stale=true' >> "$GITHUB_OUTPUT"
              echo "STALE_EVENT: dispatch reviewed_sha does not match current PR/checkpoint; safe no-op."
              exit 0
            fi
            if [ "$CHECKPOINT_PR" != "$PR" ]; then
              echo 'stale=true' >> "$GITHUB_OUTPUT"
              echo "STALE_EVENT: dispatch PR $PR is not the checkpoint active_pr=$CHECKPOINT_PR; safe no-op."
              exit 0
            fi
          fi

          # A normal PR opened/reopened outside the Agent 2 pipeline is still
          # worth reviewing. It becomes analysis-only: no checkpoint mutation,
          # no recovery, no pipeline transition.
          if [ "$CHECKPOINT_PR" != "$PR" ] || [ "$CHECKPOINT_STATUS" != "PR_OPEN" -a "$CHECKPOINT_STATUS" != "REVIEWING" ]; then
            echo 'analysis_only=true' >> "$GITHUB_OUTPUT"
            echo 'stale=false' >> "$GITHUB_OUTPUT"
            echo "ANALYSIS_ONLY: PR $PR is not the active Agent 2 pipeline PR; review only, do not mutate checkpoint."
          else
            if [ -n "$EVENT_FEATURE" ] && [ "$EVENT_FEATURE" != "$CHECKPOINT_FEATURE" ]; then
              echo 'stale=true' >> "$GITHUB_OUTPUT"
              echo "STALE_EVENT: event feature $EVENT_FEATURE does not match checkpoint feature $CHECKPOINT_FEATURE; safe no-op."
              exit 0
            fi
            if [ -n "$CHECKPOINT_SHA" ] && [ "$CHECKPOINT_SHA" != "$CURRENT_SHA" ]; then
              echo 'analysis_only=true' >> "$GITHUB_OUTPUT"
              echo 'stale=false' >> "$GITHUB_OUTPUT"
              echo "ANALYSIS_ONLY: active PR head changed before review; record analysis without mutating pipeline state."
            else
              echo 'analysis_only=false' >> "$GITHUB_OUTPUT"
              echo 'stale=false' >> "$GITHUB_OUTPUT"
              echo "PIPELINE_REVIEW: PR $PR is the active Agent 2 pipeline PR at $CURRENT_SHA."
            fi
          fi
          echo "current_sha=$CURRENT_SHA" >> "$GITHUB_OUTPUT"

      - name: Record review-gate failure
        if: failure() && steps.validate_event.outputs.stale != 'true'
        run: |
          python scripts/awh_pipeline.py record-failure --agent reviewer --stage validation --detail "reviewer validation failed; see workflow run logs" --pr "$AWH_PR" || true

      - name: Verify required LLM secrets
        if: steps.validate_event.outputs.stale != 'true'
        run: |
          test -n "$K1" || { echo 'Missing required secret: AWH_AGENT3_NVIDIA_KEY_1'; exit 1; }
          test -n "$KF" || { echo 'Missing required secret: AWH_ROUTINE_NVIDIA_KEY'; exit 1; }

      - name: Checkpoint reviewer stage with CAS and operation identity
        if: steps.validate_event.outputs.analysis_only != 'true' && steps.validate_event.outputs.stale != 'true'
        env:
          PR: ${{ github.event.pull_request.number || github.event.client_payload.pr_number }}
        run: |
          FEATURE=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json headRefName --jq '.headRefName' | sed 's#^feature/##')
          BRANCH=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json headRefName --jq '.headRefName')
          SHA='${{ steps.validate_event.outputs.current_sha }}'
          python scripts/awh_pipeline.py begin-stage --stage reviewer --feature "$FEATURE" --pr "$PR" --branch "$BRANCH" --sha "$SHA" --message "chore(automation): reviewer stage for $FEATURE PR $PR"

      - name: Pin and verify exact review head
        id: pin
        if: steps.validate_event.outputs.stale != 'true'
        env:
          PR: ${{ github.event.pull_request.number || github.event.client_payload.pr_number }}
        run: |
          EXPECTED=$(jq -r '.active_pr_sha // empty' .openhands/state.json)
          CURRENT=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq '.headRefOid')
          if [ "$${{ steps.validate_event.outputs.analysis_only }}" = "true" ]; then
            echo 'valid=true' >> "$GITHUB_OUTPUT"
            echo 'stale=false' >> "$GITHUB_OUTPUT"
            echo "Analysis-only reviewer mode pinned to current PR head $CURRENT."
            exit 0
          fi
          if [ -z "$EXPECTED" ] || [ "$CURRENT" != "$EXPECTED" ]; then
            echo 'valid=false' >> "$GITHUB_OUTPUT"
            echo 'stale=true' >> "$GITHUB_OUTPUT"
            echo "REVIEW_INVALIDATED: pipeline PR head changed; safe no-op."
            exit 0
          fi
          echo 'valid=true' >> "$GITHUB_OUTPUT"
          echo 'stale=false' >> "$GITHUB_OUTPUT"

      - name: Install OpenHands SDK and built-in tools
        if: steps.pin.outputs.valid == 'true' && steps.pin.outputs.stale != 'true'
        run: python -m pip install --disable-pip-version-check 'openhands-sdk>=1.0,<2' 'openhands-tools>=1.0,<2'

      - name: Run Agent 3
        if: steps.pin.outputs.valid == 'true' && steps.pin.outputs.stale != 'true'
        env:
          AWH_REVIEW_MODE: ${{ steps.validate_event.outputs.analysis_only == 'true' && 'analysis' || 'pipeline' }}
        run: |
          set +e
          SUCCESS=0
          for KEY_NAME in K1 K2 K3 KF; do
            KEY="${!KEY_NAME}"
            [ -n "$KEY" ] || continue
            AWH_LLM_API_KEY="$KEY" python scripts/openhands_agent.py > /tmp/review.txt 2>&1
            RC=$?
            cat /tmp/review.txt
            if [ "$RC" -eq 0 ]; then SUCCESS=1; break; fi
            if grep -Eiq '(^|[^0-9])429([^0-9]|$)|rate.?limit|too many requests' /tmp/review.txt; then continue; fi
            exit "$RC"
          done
          test "$SUCCESS" -eq 1

      - name: Record Agent 3 failure
        if: failure() && steps.pin.outputs.valid == 'true' && steps.pin.outputs.stale != 'true'
        run: |
          python scripts/awh_pipeline.py record-failure --agent reviewer --stage agent --detail "OpenHands Agent 3 failed; see workflow run logs" --pr "$AWH_PR" || true

      - name: Publish analysis to docs and PR without changing pipeline state
        if: steps.validate_event.outputs.analysis_only == 'true' && steps.pin.outputs.valid == 'true' && steps.pin.outputs.stale != 'true'
        env:
          PR: ${{ github.event.pull_request.number || github.event.client_payload.pr_number }}
          SHA: ${{ steps.validate_event.outputs.current_sha }}
        run: |
          set -e
          REVIEW=$(cat .openhands/review.md)
          DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          SAFE_SHA=$(printf '%s' "$SHA" | cut -c1-12)
          REPORT="docs/pr-reviews/pr-${PR}-${SAFE_SHA}.md"
          {
            echo "# Agent 3 PR Analysis — PR #${PR}"
            echo
            echo "- Reviewed at: \`$DATE\`"
            echo "- Reviewed SHA: \`$SHA\`"
            echo "- Mode: \`analysis-only\`"
            echo "- Pipeline state: unchanged"
            echo
            echo "$REVIEW"
            echo
            echo "## Agent 1 / Agent 2 Usage"
            echo
            echo "Agent 1 should read this report as review evidence when selecting or planning related work. Agent 2 should use the \`Agent 2 Working Prompt\` section as implementation guidance when this finding becomes an assigned feature."
          } > "$REPORT"
          git add "$REPORT"
          git config user.name 'AWH Automation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "docs(reviews): record Agent 3 analysis for PR #$PR" || true
          python scripts/safe_git.py push --branch rust --message "docs(reviews): record Agent 3 analysis for PR #$PR"
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body "## Agent 3 Analysis (analysis-only)\n\nReviewed SHA: \`$SHA\`\n\n$REVIEW\n\n> This review is informational. It did not change \`.openhands/state.json\` or advance the main Agent pipeline.\n\nRepository report: \`$REPORT\`"

      - name: Publish pipeline review and record verdict under CAS
        if: steps.validate_event.outputs.analysis_only != 'true' && steps.pin.outputs.valid == 'true' && steps.pin.outputs.stale != 'true'
        env:
          PR: ${{ github.event.pull_request.number || github.event.client_payload.pr_number }}
        run: |
          set -e
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          repo=os.environ['GITHUB_REPOSITORY']; pr=os.environ['PR']
          review=Path('.openhands/review.md').read_text(encoding='utf-8').strip()
          verdicts=[x.split(':',1)[1].strip() for x in review.splitlines() if x.startswith('VERDICT:')]
          if len(verdicts) != 1 or verdicts[0] not in {'APPROVE','CHANGES_REQUIRED','BLOCKED'}:
              raise SystemExit('Reviewer output has no single valid VERDICT')
          verdict=verdicts[0]
          prdata=json.loads(subprocess.check_output(['gh','pr','view',pr,'--repo',repo,'--json','body','state','baseRefName','isCrossRepository','headRefName','headRefOid']))
          if prdata.get('isCrossRepository') or prdata.get('baseRefName')!='rust' or prdata.get('state')!='OPEN': raise SystemExit('PR is no longer an eligible pipeline PR')
          state=json.loads(Path('.openhands/state.json').read_text(encoding='utf-8'))
          expected=state.get('active_pr_sha'); current=prdata.get('headRefOid')
          if not expected or current != expected: raise SystemExit('REVIEW_INVALIDATED: reviewed SHA no longer matches current PR head')
          feature=prdata['headRefName'].removeprefix('feature/')
          old=prdata.get('body') or ''
          marker='<!-- AWH_AGENT3_REVIEW -->'
          section=f"{marker}\n## Agent 3 Review — Kimi K3\n\nReviewed SHA: `{expected}`\n\n{review}\n\n{marker}"
          if marker in old: old=old.split(marker,1)[0].rstrip()
          subprocess.run(['gh','pr','edit',pr,'--repo',repo,'--body',(old+'\n\n'+section).strip()],check=True)
          status={'APPROVE':'PR_OPEN','CHANGES_REQUIRED':'FIXING','BLOCKED':'BLOCKED'}[verdict]
          op=state['operation_id']
          transition=['python','scripts/checkpoint_state.py','transition','--expect-status','REVIEWING','--to',status,'--set',f'active_feature={json.dumps(feature)}','--set',f'active_pr={int(pr)}','--set',f'active_pr_sha={json.dumps(expected)}','--set',f'last_review={json.dumps(review)}','--set','last_error=null','--expect-operation-id',op]
          subprocess.run(transition,check=True)
          subprocess.run(['git','config','user.name','AWH Automation'],check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
          subprocess.run(['git','add','.openhands/state.json'],check=True)
          subprocess.run(['python','scripts/safe_git.py','push','--branch','rust','--message','chore(automation): reviewer verdict '+verdict],check=True)
          payload={'event_type':'awh.review-complete','client_payload':{'pr_number':int(pr),'feature_id':feature,'review_state':verdict,'review':review,'operation_id':op,'reviewed_sha':expected}}
          subprocess.run(['gh','api',f'repos/{repo}/dispatches','--method','POST','--input','-'],input=json.dumps(payload),text=True,check=True)
          PY

      - name: Record verdict-publication failure
        if: failure() && steps.validate_event.outputs.analysis_only != 'true' && steps.pin.outputs.valid == 'true' && steps.pin.outputs.stale != 'true'
        run: |
          python scripts/awh_pipeline.py record-failure --agent reviewer --stage verdict --detail "reviewer verdict could not be published or recorded; see workflow run logs" --pr "$AWH_PR" || true
