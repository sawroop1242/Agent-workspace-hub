name: AWH Agent 3 Reviewer

on:
  pull_request_target:
    types: [opened, reopened]
  repository_dispatch:
    types: [awh.review]

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: ${{ github.workflow }}-pr-${{ github.event.pull_request.number || github.event.client_payload.pr_number }}
  cancel-in-progress: false

env:
  AWH_LLM_MODEL: moonshotai/kimi-k3
  AWH_LLM_BASE_URL: https://integrate.api.nvidia.com/v1
  OPENHANDS_SDK_COMMIT: 22c85eb0e0db8f4386380d095e9fe6933af2e65f

jobs:
  review:
    if: >-
      (github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'repository_dispatch' && github.event.action == 'awh.review')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ secrets.AWH_AUTOMATION_TOKEN }}
      AWH_AGENT_ROLE: reviewer
      AWH_PR: ${{ github.event.pull_request.number || github.event.client_payload.pr_number }}
      AWH_EVENT_FEATURE: ${{ github.event.client_payload.feature_id || '' }}
      AWH_EVENT_REVIEWED_SHA: ${{ github.event.client_payload.reviewed_sha || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rust
          fetch-depth: 0
          token: ${{ secrets.AWH_AUTOMATION_TOKEN }}
      - name: Sync checkpoint from shared branch
        run: python scripts/safe_git.py sync --branch rust
      - name: Classify review request without mutating pipeline state
        id: validate_event
        run: |
          set -e
          PR="$AWH_PR"; test -n "$PR"
          DATA=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json state,baseRefName,isCrossRepository,headRefOid,headRefName)
          test "$(echo "$DATA" | jq -r .isCrossRepository)" = false || { echo 'stale=true' >> "$GITHUB_OUTPUT"; exit 0; }
          test "$(echo "$DATA" | jq -r .baseRefName)" = rust || { echo 'stale=true' >> "$GITHUB_OUTPUT"; exit 0; }
          test "$(echo "$DATA" | jq -r .state)" = OPEN || { echo 'stale=true' >> "$GITHUB_OUTPUT"; exit 0; }
          CURRENT=$(echo "$DATA" | jq -r .headRefOid)
          STATUS=$(jq -r .status .openhands/state.json); ACTIVE_PR=$(jq -r '.active_pr // empty' .openhands/state.json); ACTIVE_FEATURE=$(jq -r '.active_feature // empty' .openhands/state.json); CHECKPOINT_SHA=$(jq -r '.active_pr_sha // empty' .openhands/state.json)
          if [ "$GITHUB_EVENT_NAME" = repository_dispatch ]; then
            test -n "$AWH_EVENT_REVIEWED_SHA" || { echo 'stale=true' >> "$GITHUB_OUTPUT"; exit 0; }
            test "$AWH_EVENT_REVIEWED_SHA" = "$CURRENT" || { echo 'stale=true' >> "$GITHUB_OUTPUT"; exit 0; }
            test "$AWH_EVENT_REVIEWED_SHA" = "$CHECKPOINT_SHA" || { echo 'stale=true' >> "$GITHUB_OUTPUT"; exit 0; }
            test "$ACTIVE_PR" = "$PR" || { echo 'stale=true' >> "$GITHUB_OUTPUT"; exit 0; }
          fi
          if [ "$ACTIVE_PR" = "$PR" ] && { [ "$STATUS" = PR_OPEN ] || [ "$STATUS" = REVIEWING ]; }; then
            if [ -n "$AWH_EVENT_FEATURE" ] && [ "$AWH_EVENT_FEATURE" != "$ACTIVE_FEATURE" ]; then echo 'stale=true' >> "$GITHUB_OUTPUT"; exit 0; fi
            if [ -n "$CHECKPOINT_SHA" ] && [ "$CHECKPOINT_SHA" != "$CURRENT" ]; then echo 'analysis_only=true' >> "$GITHUB_OUTPUT"; else echo 'analysis_only=false' >> "$GITHUB_OUTPUT"; fi
          else echo 'analysis_only=true' >> "$GITHUB_OUTPUT"; fi
          echo 'stale=false' >> "$GITHUB_OUTPUT"; echo "current_sha=$CURRENT" >> "$GITHUB_OUTPUT"
      - name: Record validation failure
        if: failure() && steps.validate_event.outputs.stale != 'true' && steps.validate_event.outputs.analysis_only != 'true'
        run: python scripts/awh_pipeline.py record-failure --agent reviewer --stage validation --detail "reviewer validation failed; see workflow logs" --pr "$AWH_PR" || true
      - name: Verify required LLM secrets
        if: steps.validate_event.outputs.stale != 'true'
        run: |
          test -n "${{ secrets.AWH_AGENT3_NVIDIA_KEY_1 }}" || { echo 'Missing AWH_AGENT3_NVIDIA_KEY_1'; exit 1; }
          test -n "${{ secrets.AWH_ROUTINE_NVIDIA_KEY }}" || { echo 'Missing AWH_ROUTINE_NVIDIA_KEY'; exit 1; }
      - name: Enter checkpoint reviewer stage with CAS
        if: steps.validate_event.outputs.analysis_only != 'true' && steps.validate_event.outputs.stale != 'true'
        run: |
          FEATURE=$(gh pr view "$AWH_PR" --repo "$GITHUB_REPOSITORY" --json headRefName --jq '.headRefName' | sed 's#^feature/##')
          BRANCH=$(gh pr view "$AWH_PR" --repo "$GITHUB_REPOSITORY" --json headRefName --jq '.headRefName')
          python scripts/awh_pipeline.py begin-stage --stage reviewer --feature "$FEATURE" --pr "$AWH_PR" --branch "$BRANCH" --sha '${{ steps.validate_event.outputs.current_sha }}' --message "chore(automation): reviewer stage for $FEATURE PR $AWH_PR"
      - name: Pin exact review head
        id: pin
        if: steps.validate_event.outputs.stale != 'true'
        run: |
          EXPECTED=$(jq -r '.active_pr_sha // empty' .openhands/state.json); CURRENT=$(gh pr view "$AWH_PR" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq .headRefOid)
          if [ "${{ steps.validate_event.outputs.analysis_only }}" = true ]; then echo 'valid=true' >> "$GITHUB_OUTPUT"; echo 'stale=false' >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ -z "$EXPECTED" ] || [ "$CURRENT" != "$EXPECTED" ]; then echo 'valid=false' >> "$GITHUB_OUTPUT"; echo 'stale=true' >> "$GITHUB_OUTPUT"; exit 0; fi
          echo 'valid=true' >> "$GITHUB_OUTPUT"; echo 'stale=false' >> "$GITHUB_OUTPUT"
      - name: Run deterministic Agent 3 v2 review engine
        if: steps.pin.outputs.valid == 'true' && steps.pin.outputs.stale != 'true'
        env:
          AWH_REVIEW_SHA: ${{ steps.validate_event.outputs.current_sha }}
          AWH_REVIEW_MODE: ${{ steps.validate_event.outputs.analysis_only == 'true' && 'analysis' || 'pipeline' }}
        run: python scripts/reviewer_deterministic.py
      - name: Install pinned OpenHands SDK
        if: steps.pin.outputs.valid == 'true' && steps.pin.outputs.stale != 'true'
        run: |
          python -m pip install --disable-pip-version-check \
            "openhands-sdk @ git+https://github.com/OpenHands/software-agent-sdk.git@${OPENHANDS_SDK_COMMIT}#subdirectory=openhands-sdk" \
            "openhands-tools @ git+https://github.com/OpenHands/software-agent-sdk.git@${OPENHANDS_SDK_COMMIT}#subdirectory=openhands-tools"
      - name: Run semantic Agent 3 with key rotation
        if: steps.pin.outputs.valid == 'true' && steps.pin.outputs.stale != 'true'
        env:
          K1: ${{ secrets.AWH_AGENT3_NVIDIA_KEY_1 }}; K2: ${{ secrets.AWH_AGENT3_NVIDIA_KEY_2 }}; K3: ${{ secrets.AWH_AGENT3_NVIDIA_KEY_3 }}; KF: ${{ secrets.AWH_ROUTINE_NVIDIA_KEY }}
          AWH_REVIEW_MODE: ${{ steps.validate_event.outputs.analysis_only == 'true' && 'analysis' || 'pipeline' }}
        run: |
          set +e; SUCCESS=0
          for KEY_NAME in K1 K2 K3 KF; do KEY="${!KEY_NAME}"; [ -n "$KEY" ] || continue
            AWH_LLM_API_KEY="$KEY" python scripts/openhands_agent.py > /tmp/review.txt 2>&1; RC=$?; cat /tmp/review.txt
            if [ "$RC" -eq 0 ]; then SUCCESS=1; break; fi
            if grep -Eiq '(^|[^0-9])429([^0-9]|$)|rate.?limit|too many requests' /tmp/review.txt; then continue; fi
            exit "$RC"
          done
          test "$SUCCESS" -eq 1
      - name: Validate Agent 3 v2 evidence and verdict
        if: steps.pin.outputs.valid == 'true' && steps.pin.outputs.stale != 'true'
        env:
          AWH_REVIEW_SHA: ${{ steps.validate_event.outputs.current_sha }}
        run: python scripts/reviewer_validate.py
      - name: Publish pipeline review and verdict under CAS
        if: steps.validate_event.outputs.analysis_only != 'true' && steps.pin.outputs.valid == 'true' && steps.pin.outputs.stale != 'true'
        run: |
          set -e
          python - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          repo=os.environ['GITHUB_REPOSITORY']; pr=os.environ['AWH_PR']; review=Path('.openhands/review.md').read_text(encoding='utf-8').strip()
          verdicts=[x.split(':',1)[1].strip() for x in review.splitlines() if x.startswith('VERDICT:')]
          if len(verdicts)!=1 or verdicts[0] not in {'APPROVE','CHANGES_REQUIRED','BLOCKED'}: raise SystemExit('invalid reviewer verdict')
          data=json.loads(subprocess.check_output(['gh','pr','view',pr,'--repo',repo,'--json','state,baseRefName,isCrossRepository,headRefName,headRefOid']))
          state=json.loads(Path('.openhands/state.json').read_text(encoding='utf-8'))
          if data['state']!='OPEN' or data['baseRefName']!='rust' or data['isCrossRepository'] or state.get('active_pr_sha')!=data['headRefOid']: raise SystemExit('review invalidated')
          verdict=verdicts[0]; feature=data['headRefName'].removeprefix('feature/'); op=state['operation_id']
          target={'APPROVE':'PR_OPEN','CHANGES_REQUIRED':'FIXING','BLOCKED':'BLOCKED'}[verdict]
          subprocess.run(['python','scripts/checkpoint_state.py','transition','--expect-status','REVIEWING','--expect-operation-id',op,'--to',target,'--set',f'active_feature={json.dumps(feature)}','--set',f'active_pr={int(pr)}','--set',f'active_pr_sha={json.dumps(data["headRefOid"])}','--set',f'last_review={json.dumps(review)}','--set','last_error=null'],check=True)
          subprocess.run(['git','config','user.name','AWH Automation'],check=True); subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True); subprocess.run(['git','add','.openhands/state.json'],check=True); subprocess.run(['python','scripts/safe_git.py','push','--branch','rust','--message','chore(automation): reviewer verdict '+verdict],check=True)
          payload={'event_type':'awh.review-complete','client_payload':{'pr_number':int(pr),'feature_id':feature,'review_state':verdict,'review':review,'operation_id':op,'reviewed_sha':data['headRefOid']}}
          subprocess.run(['gh','api',f'repos/{repo}/dispatches','--method','POST','--input','-'],input=json.dumps(payload),text=True,check=True)
          PY
      - name: Record reviewer failure for recovery
        if: failure() && steps.validate_event.outputs.stale != 'true' && steps.validate_event.outputs.analysis_only != 'true'
        run: python scripts/awh_pipeline.py record-failure --agent reviewer --stage agent --detail "Agent 3 reviewer workflow failed; see workflow run logs" --pr "$AWH_PR" || true
