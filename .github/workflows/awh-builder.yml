name: AWH Agent 2 Builder

on:
  repository_dispatch:
    types: [awh.build, awh.fix]

permissions:
  contents: write
  pull-requests: write
  checks: read

concurrency:
  group: awh-builder-${{ github.event.client_payload.feature_id }}
  cancel-in-progress: false

env:
  AWH_LLM_MODEL: moonshotai/kimi-k3
  AWH_LLM_BASE_URL: https://integrate.api.nvidia.com/v1
  OPENHANDS_SDK_COMMIT: 22c85eb0e0db8f4386380d095e9fe6933af2e65f

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      GH_TOKEN: ${{ secrets.AWH_AUTOMATION_TOKEN }}
      K1: ${{ secrets.AWH_AGENT2_NVIDIA_KEY_1 }}
      K2: ${{ secrets.AWH_AGENT2_NVIDIA_KEY_2 }}
      K3: ${{ secrets.AWH_AGENT2_NVIDIA_KEY_3 }}
      KF: ${{ secrets.AWH_ROUTINE_NVIDIA_KEY }}
      AWH_FEATURE_ID: ${{ github.event.client_payload.feature_id }}
      AWH_EVENT_OPERATION_ID: ${{ github.event.client_payload.operation_id }}
      AWH_EVENT_REVIEW: ${{ github.event.client_payload.review }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rust
          fetch-depth: 0
          token: ${{ secrets.AWH_AUTOMATION_TOKEN }}
      - name: Configure git identity
        run: |
          git config user.name 'AWH Builder Agent'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Sync checkpoint from the shared branch
        run: python scripts/safe_git.py sync --branch rust
      - name: Validate event against the authoritative checkpoint
        run: |
          python scripts/checkpoint_state.py validate
          test -n "$AWH_FEATURE_ID"; test -n "$AWH_EVENT_OPERATION_ID"
          python scripts/validate_feature_id.py "$AWH_FEATURE_ID"
          python scripts/awh_pipeline.py validate-event --agent builder --feature "$AWH_FEATURE_ID"
          CHECKPOINT_OP=$(jq -r '.operation_id // empty' .openhands/state.json)
          test "$AWH_EVENT_OPERATION_ID" = "$CHECKPOINT_OP"
      - name: Verify required LLM secrets
        run: |
          test -n "$K1" || { echo 'Missing required secret: AWH_AGENT2_NVIDIA_KEY_1'; exit 1; }
          test -n "$KF" || { echo 'Missing required secret: AWH_ROUTINE_NVIDIA_KEY'; exit 1; }
      - name: Checkpoint builder stage with CAS and operation identity
        run: python scripts/awh_pipeline.py begin-stage --stage builder --feature "$AWH_FEATURE_ID" --operation-id "$AWH_EVENT_OPERATION_ID" --message "chore(automation): builder stage for $AWH_FEATURE_ID" --set last_error=null
      - name: Determine branch
        id: branch
        run: echo "name=feature/${AWH_FEATURE_ID}" >> "$GITHUB_OUTPUT"
      - name: Create or update feature branch
        env:
          BRANCH: ${{ steps.branch.outputs.name }}
        run: |
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            git fetch origin "$BRANCH:$BRANCH"; git checkout "$BRANCH"; git merge --ff-only "origin/$BRANCH"
          else git checkout -b "$BRANCH" origin/rust; fi
      - name: Resolve task contract
        run: |
          if [ -n "$AWH_EVENT_REVIEW" ]; then printf '%s\n' "$AWH_EVENT_REVIEW" > /tmp/task.md
          elif [ -s .openhands/generated-task.md ]; then cp .openhands/generated-task.md /tmp/task.md
          else jq -r --arg id "$AWH_FEATURE_ID" '.features[] | select(.id==$id) | ("Feature ID: " + .id), ("# Feature\n" + .title), "# Goal\n" + (.acceptance_criteria|join("\n- ")), "# Acceptance Criteria\n" + (.acceptance_criteria|join("\n- "))' docs/features.json > /tmp/task.md; fi
          test -s /tmp/task.md
      - name: Install pinned OpenHands SDK and built-in tools
        run: |
          python -m pip install --disable-pip-version-check \
            "openhands-sdk @ git+https://github.com/OpenHands/software-agent-sdk.git@${OPENHANDS_SDK_COMMIT}#subdirectory=openhands-sdk" \
            "openhands-tools @ git+https://github.com/OpenHands/software-agent-sdk.git@${OPENHANDS_SDK_COMMIT}#subdirectory=openhands-tools"
      - name: Run Agent 2 with key rotation
        env:
          AWH_AGENT_ROLE: builder
        run: |
          export AWH_TASK="$(cat /tmp/task.md)"; set +e; SUCCESS=0
          for KEY_NAME in K1 K2 K3 KF; do KEY="${!KEY_NAME}"; [ -n "$KEY" ] || continue
            AWH_LLM_API_KEY="$KEY" python scripts/openhands_agent.py > /tmp/agent2.txt 2>&1; RC=$?; cat /tmp/agent2.txt
            if [ "$RC" -eq 0 ]; then SUCCESS=1; break; fi
            if grep -Eiq '(^|[^0-9])429([^0-9]|$)|rate.?limit|too many requests' /tmp/agent2.txt; then continue; fi
            exit "$RC"
          done
          test "$SUCCESS" -eq 1
      - name: Deterministic verification
        run: |
          cargo fmt --all -- --check
          cargo check --all-targets
          cargo test --all-targets
          cargo clippy --all-targets --all-features -- -D warnings
      - name: Commit and push feature branch
        env:
          BRANCH: ${{ steps.branch.outputs.name }}
        run: |
          git add -A
          git diff --cached --quiet && { echo 'No changes produced by Agent 2.'; exit 1; }
          git commit -m "feat(${AWH_FEATURE_ID}): implement assigned feature"
          git push --set-upstream origin "$BRANCH"
      - name: Create or update PR
        id: pr
        env:
          BRANCH: ${{ steps.branch.outputs.name }}
        run: |
          EXISTING=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --base rust --state open --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then echo "number=$EXISTING" >> "$GITHUB_OUTPUT"; exit 0; fi
          NUMBER=$(gh pr create --repo "$GITHUB_REPOSITORY" --base rust --head "$BRANCH" --title "feat(${AWH_FEATURE_ID}): autonomous implementation" --body "Agent 2 implementation from the persisted Agent 1 task contract. Agent 3 review is required." --json number --jq '.number')
          echo "number=$NUMBER" >> "$GITHUB_OUTPUT"
      - name: Record PR in state
        env:
          PR: ${{ steps.pr.outputs.number }}
          BRANCH: ${{ steps.branch.outputs.name }}
        run: |
          git checkout rust; python scripts/safe_git.py sync --branch rust
          SHA=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq .headRefOid); test -n "$SHA"
          python scripts/checkpoint_state.py transition --expect-status BUILDING --expect-status REVIEWING --to PR_OPEN --set active_feature="$(python -c 'import json,os; print(json.dumps(os.environ["AWH_FEATURE_ID"]))')" --set active_pr="$PR" --set active_branch="$(python -c 'import json,os; print(json.dumps(os.environ["BRANCH"]))')" --set active_pr_sha="$(python -c 'import json,os; print(json.dumps(os.environ["SHA"]))')" --set last_error=null
          git add .openhands/state.json; python scripts/safe_git.py push --branch rust --message "chore(automation): record PR $PR"
      - name: Record builder failure for recovery
        if: failure()
        run: |
          python scripts/awh_pipeline.py record-failure --agent builder --stage agent --detail "Agent 2 builder workflow failed; see workflow run logs" --feature "$AWH_FEATURE_ID" --operation-id "$AWH_EVENT_OPERATION_ID" || true
