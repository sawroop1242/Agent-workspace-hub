name: AWH Agent 2 Builder

on:
  repository_dispatch:
    types: [awh.build, awh.fix]

permissions:
  contents: write
  pull-requests: write
  checks: read

concurrency:
  group: awh-builder-${{ github.event.client_payload.feature_id }}
  cancel-in-progress: false

env:
  AWH_LLM_MODEL: moonshotai/kimi-k3
  AWH_LLM_BASE_URL: https://integrate.api.nvidia.com/v1

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      GH_TOKEN: ${{ secrets.AWH_AUTOMATION_TOKEN }}
      K1: ${{ secrets.AWH_AGENT2_NVIDIA_KEY_1 }}
      K2: ${{ secrets.AWH_AGENT2_NVIDIA_KEY_2 }}
      K3: ${{ secrets.AWH_AGENT2_NVIDIA_KEY_3 }}
      KF: ${{ secrets.AWH_ROUTINE_NVIDIA_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rust
          fetch-depth: 0
          token: ${{ secrets.AWH_AUTOMATION_TOKEN }}

      - name: Validate checkpoint before builder work
        run: python scripts/checkpoint_state.py validate

      - name: Verify required LLM secrets
        run: |
          test -n "$K1" || { echo 'Missing required secret: AWH_AGENT2_NVIDIA_KEY_1'; exit 1; }
          test -n "$KF" || { echo 'Missing required secret: AWH_ROUTINE_NVIDIA_KEY'; exit 1; }
          echo 'Required Agent 2 key and routine fallback are configured.'
          [ -n "$K2" ] && echo 'Optional Agent 2 key 2 configured.' || echo 'Optional Agent 2 key 2 not configured.'
          [ -n "$K3" ] && echo 'Optional Agent 2 key 3 configured.' || echo 'Optional Agent 2 key 3 not configured.'

      - name: Checkpoint builder attempt
        env:
          FEATURE_ID: ${{ github.event.client_payload.feature_id }}
        run: |
          test -n "$FEATURE_ID"
          CURRENT=$(jq -r '.builder_attempt' .openhands/state.json)
          NEXT=$((CURRENT + 1))
          python scripts/checkpoint_state.py update \
            --set status='"BUILDING"' \
            --set active_feature="$(python -c 'import json,os; print(json.dumps(os.environ["FEATURE_ID"]))')" \
            --set builder_attempt="$NEXT" \
            --set last_error=null
          git config user.name 'AWH Automation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .openhands/state.json
          git commit -m 'chore(automation): checkpoint builder attempt' || true
          git push origin rust

      - name: Determine branch
        id: branch
        env:
          FEATURE_ID: ${{ github.event.client_payload.feature_id }}
        run: |
          test -n "$FEATURE_ID"
          echo "name=feature/${FEATURE_ID}" >> "$GITHUB_OUTPUT"

      - name: Create or update feature branch
        env:
          BRANCH: ${{ steps.branch.outputs.name }}
        run: |
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            git fetch origin "$BRANCH:$BRANCH"
            git checkout "$BRANCH"
            git reset --hard "origin/$BRANCH"
          else
            git checkout -b "$BRANCH" origin/rust
          fi

      - name: Resolve task contract
        env:
          FEATURE_ID: ${{ github.event.client_payload.feature_id }}
          TASK_INPUT: ${{ github.event.client_payload.task }}
        run: |
          if [ -n "$TASK_INPUT" ]; then
            printf '%s\n' "$TASK_INPUT" > /tmp/task.md
          else
            jq -r --arg id "$FEATURE_ID" '.features[] | select(.id==$id) | ("Feature ID: " + .id), ("# Feature\n" + .title), "# Goal\n" + (.acceptance_criteria|join("\n- ")), "# Acceptance Criteria\n" + (.acceptance_criteria|map("- " + .)|join("\n"))' .openhands/backlog.json > /tmp/task.md
          fi
          test -s /tmp/task.md

      - name: Install OpenHands SDK
        run: python -m pip install --disable-pip-version-check 'openhands-sdk>=1.0,<2'

      - name: Run Agent 2 with optional three-key Kimi K3 rotation and required routine fallback
        env:
          AWH_AGENT_ROLE: builder
          AWH_REVIEW: ${{ github.event.client_payload.review }}
        run: |
          export AWH_TASK="$(cat /tmp/task.md)"
          set +e
          SUCCESS=0
          for KEY_NAME in K1 K2 K3 KF; do
            KEY="${!KEY_NAME}"
            [ -n "$KEY" ] || continue
            echo "Agent 2: trying NVIDIA Kimi K3 key pool slot $KEY_NAME"
            AWH_LLM_API_KEY="$KEY" python scripts/openhands_agent.py > /tmp/agent2.txt 2>&1
            RC=$?
            cat /tmp/agent2.txt
            if [ "$RC" -eq 0 ]; then SUCCESS=1; break; fi
            if grep -Eiq '(^|[^0-9])429([^0-9]|$)|rate.?limit|too many requests' /tmp/agent2.txt; then
              echo "Rate limit detected for $KEY_NAME; rotating to the next key."
              continue
            fi
            echo "Agent 2 failed for a non-rate-limit reason."
            exit "$RC"
          done
          test "$SUCCESS" -eq 1

      - name: Deterministic verification
        run: |
          cargo fmt --all -- --check
          cargo check --all-targets
          cargo test --all-targets
          cargo clippy --all-targets --all-features -- -D warnings

      - name: Commit and push
        env:
          BRANCH: ${{ steps.branch.outputs.name }}
          FEATURE_ID: ${{ github.event.client_payload.feature_id }}
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo 'No changes produced by Agent 2.'
            exit 1
          fi
          git config user.name 'AWH Builder Agent'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m "feat(${FEATURE_ID}): implement assigned feature"
          git push --set-upstream origin "$BRANCH"

      - name: Create or update PR
        id: pr
        env:
          BRANCH: ${{ steps.branch.outputs.name }}
          FEATURE_ID: ${{ github.event.client_payload.feature_id }}
          TASK: ${{ github.event.client_payload.task }}
        run: |
          EXISTING=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --base rust --state open --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then echo "number=$EXISTING" >> "$GITHUB_OUTPUT"; exit 0; fi
          BODY=$(cat <<EOF
          ## Autonomous Feature Delivery

          **Feature:** \`$FEATURE_ID\`

          Agent 2 implemented this change from the Agent 1 task contract.

          ### Task contract
          $TASK

          ### Verification
          - cargo fmt --all -- --check
          - cargo check --all-targets
          - cargo test --all-targets
          - cargo clippy --all-targets --all-features -- -D warnings

          Agent 3 review is required before autonomous merge.
          EOF
          )
          NUMBER=$(gh pr create --repo "$GITHUB_REPOSITORY" --base rust --head "$BRANCH" --title "feat(${FEATURE_ID}): autonomous implementation" --body "$BODY" --json number --jq '.number')
          echo "number=$NUMBER" >> "$GITHUB_OUTPUT"

      - name: Record PR in state
        env:
          PR: ${{ steps.pr.outputs.number }}
          BRANCH: ${{ steps.branch.outputs.name }}
          FEATURE_ID: ${{ github.event.client_payload.feature_id }}
        run: |
          git checkout rust
          git pull --ff-only origin rust
          python scripts/checkpoint_state.py update \
            --set status='"PR_OPEN"' \
            --set active_feature="$(python -c 'import json,os; print(json.dumps(os.environ["FEATURE_ID"]))')" \
            --set active_pr="$PR" \
            --set active_branch="$(python -c 'import json,os; print(json.dumps(os.environ["BRANCH"]))')" \
            --set last_error=null
          git config user.name 'AWH Automation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .openhands/state.json
          git commit -m "chore(automation): record PR ${{ steps.pr.outputs.number }}" || true
          git push origin rust
