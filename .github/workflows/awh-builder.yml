name: AWH Agent 2 Builder

on:
  repository_dispatch:
    types: [awh.build, awh.fix]

permissions:
  contents: write
  pull-requests: write
  checks: read

concurrency:
  group: awh-builder-${{ github.event.client_payload.feature_id }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ secrets.AWH_AUTOMATION_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rust
          fetch-depth: 0
          token: ${{ secrets.AWH_AUTOMATION_TOKEN }}

      - name: Determine branch
        id: branch
        env:
          FEATURE_ID: ${{ github.event.client_payload.feature_id }}
        run: |
          test -n "$FEATURE_ID"
          echo "name=feature/${FEATURE_ID}" >> "$GITHUB_OUTPUT"

      - name: Create or update feature branch
        env:
          BRANCH: ${{ steps.branch.outputs.name }}
        run: |
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            git fetch origin "$BRANCH:$BRANCH"
            git checkout "$BRANCH"
            git reset --hard "origin/$BRANCH"
          else
            git checkout -b "$BRANCH" origin/rust
          fi

      - name: Resolve task contract
        env:
          FEATURE_ID: ${{ github.event.client_payload.feature_id }}
          TASK_INPUT: ${{ github.event.client_payload.task }}
        run: |
          if [ -n "$TASK_INPUT" ]; then
            printf '%s\n' "$TASK_INPUT" > /tmp/task.md
          else
            jq -r --arg id "$FEATURE_ID" '.features[] | select(.id==$id) | ("Feature ID: " + .id), ("# Feature\n" + .title), "# Goal\n" + (.acceptance_criteria|join("\n- ")), "# Acceptance Criteria\n" + (.acceptance_criteria|map("- " + .)|join("\n"))' .openhands/backlog.json > /tmp/task.md
          fi
          test -s /tmp/task.md

      - name: Install OpenHands SDK
        run: python -m pip install --disable-pip-version-check 'openhands-sdk>=1.0,<2'

      - name: Run Agent 2
        env:
          AWH_AGENT_ROLE: builder
          AWH_LLM_API_KEY: ${{ secrets.AWH_LLM_API_KEY }}
          AWH_LLM_BASE_URL: ${{ secrets.AWH_LLM_BASE_URL }}
          AWH_LLM_MODEL: ${{ secrets.AWH_BUILDER_MODEL || 'gpt-5.5' }}
          AWH_REVIEW: ${{ github.event.client_payload.review }}
        run: |
          export AWH_TASK="$(cat /tmp/task.md)"
          python scripts/openhands_agent.py

      - name: Deterministic verification
        run: |
          cargo fmt --all -- --check
          cargo check --all-targets
          cargo test --all-targets
          cargo clippy --all-targets --all-features -- -D warnings

      - name: Commit and push
        env:
          BRANCH: ${{ steps.branch.outputs.name }}
          FEATURE_ID: ${{ github.event.client_payload.feature_id }}
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo 'No changes produced by Agent 2.'
            exit 1
          fi
          git config user.name 'AWH Builder Agent'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m "feat(${FEATURE_ID}): implement assigned feature"
          git push --set-upstream origin "$BRANCH"

      - name: Create or update PR
        id: pr
        env:
          BRANCH: ${{ steps.branch.outputs.name }}
          FEATURE_ID: ${{ github.event.client_payload.feature_id }}
          TASK: ${{ github.event.client_payload.task }}
        run: |
          EXISTING=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --base rust --state open --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            echo "number=$EXISTING" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          BODY=$(cat <<EOF
          ## Autonomous Feature Delivery

          **Feature:** \`$FEATURE_ID\`

          Agent 2 implemented this change from the Agent 1 task contract.

          ### Task contract
          $TASK

          ### Verification
          - cargo fmt --all -- --check
          - cargo check --all-targets
          - cargo test --all-targets
          - cargo clippy --all-targets --all-features -- -D warnings

          Agent 3 review is required before autonomous merge.
          EOF
          )
          NUMBER=$(gh pr create --repo "$GITHUB_REPOSITORY" --base rust --head "$BRANCH" --title "feat(${FEATURE_ID}): autonomous implementation" --body "$BODY" --json number --jq '.number')
          echo "number=$NUMBER" >> "$GITHUB_OUTPUT"

      - name: Record PR in state
        env:
          PR: ${{ steps.pr.outputs.number }}
          BRANCH: ${{ steps.branch.outputs.name }}
          FEATURE_ID: ${{ github.event.client_payload.feature_id }}
        run: |
          git checkout rust
          git pull --ff-only origin rust
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path('.openhands/state.json'); s=json.loads(p.read_text())
          s.update({'status':'PR_OPEN','active_feature':os.environ['FEATURE_ID'],'active_pr':int(os.environ['PR']),'active_branch':os.environ['BRANCH']})
          p.write_text(json.dumps(s, indent=2)+"\n")
          PY
          git config user.name 'AWH Automation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .openhands/state.json
          git commit -m "chore(automation): record PR ${{ steps.pr.outputs.number }}" || true
          git push origin rust
