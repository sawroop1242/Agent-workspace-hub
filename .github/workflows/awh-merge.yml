name: AWH Verified Merge

on:
  repository_dispatch:
    types: [awh.merge]

permissions:
  contents: write
  pull-requests: write
  checks: read
  actions: read

jobs:
  merge:
    if: github.event.client_payload.feature_id != '' && github.event.client_payload.operation_id != '' && github.event.client_payload.pr_number != '' && github.event.client_payload.reviewed_sha != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.AWH_AUTOMATION_TOKEN }}
      FEATURE_ID: ${{ github.event.client_payload.feature_id }}
      OPERATION_ID: ${{ github.event.client_payload.operation_id }}
      PR_NUMBER: ${{ github.event.client_payload.pr_number }}
      REVIEWED_SHA: ${{ github.event.client_payload.reviewed_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rust
          fetch-depth: 0
          token: ${{ secrets.AWH_AUTOMATION_TOKEN }}

      - name: Validate identity and checkpoint
        run: |
          python scripts/checkpoint_state.py validate
          test "$(jq -r '.status' .openhands/state.json)" = MERGING
          test "$(jq -r '.active_feature' .openhands/state.json)" = "$FEATURE_ID"
          test "$(jq -r '.operation_id' .openhands/state.json)" = "$OPERATION_ID"
          test "$(jq -r '.active_pr' .openhands/state.json)" = "$PR_NUMBER"
          test "$(jq -r '.active_pr_sha' .openhands/state.json)" = "$REVIEWED_SHA"

      - name: Validate feature identifier
        run: python scripts/validate_feature_id.py "$FEATURE_ID"

      - name: Verify PR identity and exact head SHA
        run: |
          DATA=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json baseRefName,headRefOid,headRepository,headRepositoryOwner,state,isCrossRepository)
          test "$(echo "$DATA" | jq -r .baseRefName)" = rust
          test "$(echo "$DATA" | jq -r .headRefOid)" = "$REVIEWED_SHA"
          test "$(echo "$DATA" | jq -r .headRepository.name)" = "${GITHUB_REPOSITORY#*/}"
          test "$(echo "$DATA" | jq -r .headRepositoryOwner.login)" = "${GITHUB_REPOSITORY%/*}"
          test "$(echo "$DATA" | jq -r .isCrossRepository)" = false
          test "$(echo "$DATA" | jq -r .state)" = OPEN

      - name: Require independent CI success on reviewed SHA
        run: python scripts/merge_ci_gate.py "$PR_NUMBER" "$REVIEWED_SHA"

      - name: Merge exact reviewed SHA through merge guard
        run: python scripts/awh_merge_guard.py --pr "$PR_NUMBER" --reviewed-sha "$REVIEWED_SHA" --feature "$FEATURE_ID"

      - name: Mark completed
        run: |
          python scripts/checkpoint_state.py transition --expect-status MERGING --expect-operation-id "$OPERATION_ID" --to COMPLETED --set active_pr=null --set active_branch=null --set active_pr_sha=null --set last_error=null
          git config user.name 'AWH Automation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .openhands/state.json
          python scripts/safe_git.py push --branch rust --message "chore(automation): complete $FEATURE_ID"
