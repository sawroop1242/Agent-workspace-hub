name: AWH Release Compliance Validation

on:
  pull_request:
    branches: [rust]
  workflow_dispatch:

concurrency:
  group: awh-release-compliance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Compliance validation is external, read-only CI infrastructure. It must not
# publish release state or become part of the AWH runtime.
permissions:
  contents: read

jobs:
  release-compliance:
    name: Release Compliance Validation (Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Capture environment
        shell: bash
        run: |
          set -u
          mkdir -p artifacts/compliance
          {
            echo "repository=${GITHUB_REPOSITORY}"
            echo "ref=${GITHUB_REF}"
            echo "sha=${GITHUB_SHA}"
            echo "event=${GITHUB_EVENT_NAME}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "runner_os=${RUNNER_OS}"
            echo "runner_arch=${RUNNER_ARCH}"
            rustc --version || true
            cargo --version || true
          } | tee artifacts/compliance/environment.txt

      - name: Verify repository is clean
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"

      - name: Required Rust formatting check
        shell: bash
        run: cargo fmt --all -- --check

      - name: Required Rust build check
        shell: bash
        run: cargo check --all-targets

      - name: Required Rust test suite
        shell: bash
        run: cargo test --all-targets

      - name: Required Rust Clippy check
        shell: bash
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Build locked release
        shell: bash
        run: cargo build --release --locked

      - name: Validate required project and governance documents
        shell: bash
        run: |
          set -euo pipefail
          required=(
            "Cargo.toml"
            "Cargo.lock"
            "README.md"
            "docs/PROJECT_CONTEXT.md"
            "docs/PROJECT_ROADMAP.md"
            "docs/PROJECT_ROADMAP_STATUS.md"
            "docs/development.md"
            "docs/security.md"
            "docs/error.md"
            "docs/completeness-audit.md"
            "docs/issue-resolving-prompts/README.md"
            ".github/agent/system.md"
            ".github/agent/rules.md"
            ".github/agent/verification.md"
            ".github/agent/task-template.md"
            ".github/agent/completion.md"
          )

          : > artifacts/compliance/required-files.txt
          for file in "${required[@]}"; do
            if [ -f "$file" ]; then
              echo "present: $file" | tee -a artifacts/compliance/required-files.txt
            else
              echo "missing: $file"
              exit 1
            fi
          done

      - name: Validate release package contents
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/compliance/package
          cargo package --locked --allow-dirty --no-verify
          package=$(find target/package -maxdepth 1 -type f -name '*.crate' | head -n 1)
          test -n "$package"
          cp "$package" artifacts/compliance/package/
          tar -tzf "$package" | tee artifacts/compliance/package/contents.txt

          if tar -tzf "$package" | grep -E '(^|/)(\.github/workflows/|\.env($|\.)|.*\.(pem|key|p12|pfx|jks)$)'; then
            echo 'Release package contains forbidden CI or sensitive material.'
            exit 1
          fi

      - name: Validate release metadata and dependency lock
        shell: bash
        run: |
          set -euo pipefail
          cargo metadata --locked --format-version 1 > artifacts/compliance/cargo-metadata.json
          cargo tree --locked --all-features > artifacts/compliance/cargo-tree.txt
          cargo tree --locked --all-features --edges normal > artifacts/compliance/cargo-tree-normal.txt
          sha256sum Cargo.toml Cargo.lock | tee artifacts/compliance/manifest-sha256.txt

          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("artifacts/compliance/cargo-metadata.json").read_text())
          root = data.get("resolve", {}).get("root")
          print(f"workspace_root_package={root}")
          if not root:
              raise SystemExit("Cargo metadata has no workspace root package")
          PY

      - name: Validate repository hygiene and licensing metadata
        shell: bash
        run: |
          set -euo pipefail
          git ls-files | tee artifacts/compliance/tracked-files.txt

          if git ls-files | grep -Ei '(^|/)(\.env|.*\.(pem|key|p12|pfx|jks))$'; then
            echo 'Tracked sensitive file detected.'
            exit 1
          fi

          if grep -Eiq '^(license|license-file)[[:space:]]*=' Cargo.toml; then
            grep -Ein '^(license|license-file)[[:space:]]*=' Cargo.toml \
              | tee artifacts/compliance/license-metadata.txt
          else
            echo 'Cargo license metadata is not declared in Cargo.toml.' \
              | tee artifacts/compliance/license-metadata.txt
          fi

          git diff --check | tee artifacts/compliance/git-diff-check.txt

      - name: Check compliance runtime separation
        shell: bash
        run: |
          set -euo pipefail
          forbidden='swe-bench|swe-smith|codeclash|swe-rex|mini-swe-agent|swe-agent|sb-cli|openhands|prometheus|opentelemetry|opentelemetry-otlp|grafana|jaeger|datadog|sentry|honeycomb|newrelic|cargo-audit|cargo-deny|gitleaks|semgrep|trivy|cosign|sigstore'

          if grep -Eiq "$forbidden" Cargo.toml Cargo.lock; then
            echo 'External CI/compliance/security tooling detected in AWH runtime manifests.'
            grep -Ein "$forbidden" Cargo.toml Cargo.lock || true
            exit 1
          fi

          if grep -RniE "$forbidden" src 2>/dev/null; then
            echo 'External CI/compliance/security tooling reference detected under src/.'
            exit 1
          fi

          echo 'Compliance tooling is external to the AWH runtime.' \
            | tee artifacts/compliance/runtime-separation.txt

      - name: Record read-only compliance scope
        shell: bash
        run: |
          set -euo pipefail
          cat > artifacts/compliance/release-compliance-scope.txt <<'EOF'
          AWH release compliance validation is read-only GitHub Actions infrastructure.
          It validates project governance, required documentation, package hygiene,
          dependency lock integrity, repository hygiene, and runtime separation.
          It does not publish, tag, push, sign, or upload a release.
          Compliance/security/release tooling is not an AWH runtime dependency.
          EOF

      - name: Collect final diagnostics
        if: always()
        shell: bash
        run: |
          set +e
          git status --short > artifacts/final-git-status.txt
          git diff --check > artifacts/final-diff-check.txt
          git diff -- . > artifacts/final-tracked-diff.txt
          cargo metadata --locked --format-version 1 > artifacts/final-cargo-metadata.json 2>&1
          cargo tree --locked --all-features > artifacts/final-cargo-tree.txt 2>&1
          sha256sum target/release/awh > artifacts/awh-release-sha256.txt 2>/dev/null || true

      - name: Upload release compliance artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: awh-release-compliance-validation
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14

      - name: Final read-only integrity gate
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git diff --quiet -- .
          echo 'Release compliance validation completed without modifying tracked AWH files.'
