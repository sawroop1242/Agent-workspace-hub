name: AWH Supply Chain Validation

on:
  pull_request:
    branches: [rust]
  workflow_dispatch:

concurrency:
  group: awh-supply-chain-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Supply-chain validation is external CI infrastructure. It only inspects
# repository/dependency state and must never become an AWH runtime dependency.
permissions:
  contents: read

jobs:
  supply-chain:
    name: Supply Chain Validation (Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Capture supply-chain environment
        shell: bash
        run: |
          set -u
          mkdir -p artifacts
          {
            echo '# AWH supply-chain validation environment'
            echo "repository=${GITHUB_REPOSITORY}"
            echo "ref=${GITHUB_REF}"
            echo "sha=${GITHUB_SHA}"
            echo "event=${GITHUB_EVENT_NAME}"
            echo "runner_os=${RUNNER_OS}"
            echo "runner_arch=${RUNNER_ARCH}"
            rustc --version || true
            cargo --version || true
          } | tee artifacts/environment.txt

      - name: Verify repository is clean before validation
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"

      - name: Required Rust formatting check
        shell: bash
        run: cargo fmt --all -- --check

      - name: Required Rust build check
        shell: bash
        run: cargo check --all-targets

      - name: Required Rust test suite
        shell: bash
        run: cargo test --all-targets

      - name: Required Rust Clippy check
        shell: bash
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Validate locked dependency graph
        shell: bash
        run: |
          set -euo pipefail
          cargo check --locked --all-targets
          cargo metadata --locked --format-version 1 > artifacts/cargo-metadata.json
          cargo tree --locked --all-features > artifacts/cargo-tree.txt

      - name: Inventory dependency provenance
        shell: bash
        run: |
          set -euo pipefail
          cargo tree --locked --all-features --edges normal > artifacts/runtime-dependency-tree.txt
          cargo tree --locked --all-features --duplicates > artifacts/duplicate-dependencies.txt || true
          cargo tree --locked --all-features --edges build > artifacts/build-dependency-tree.txt
          sha256sum Cargo.toml Cargo.lock > artifacts/manifest-sha256.txt

          python3 - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path('artifacts/cargo-metadata.json').read_text())
          lines = []
          for package in sorted(data.get('packages', []), key=lambda p: (p.get('name', ''), p.get('version', ''))):
              source = package.get('source') or 'workspace/path'
              checksum = package.get('checksum') or '-'
              lines.append(f"{package.get('name')} {package.get('version')} | source={source} | checksum={checksum}")
          Path('artifacts/dependency-provenance.txt').write_text('\n'.join(lines) + '\n')
          PY

      - name: Detect unapproved dependency source patterns
        shell: bash
        run: |
          set -euo pipefail
          # AWH should use the locked dependency graph. Git dependencies are
          # surfaced explicitly for review rather than silently accepted.
          : > artifacts/git-dependency-review.txt
          if grep -Ein '^source = "git\+' Cargo.lock > artifacts/git-dependency-review.txt; then
            echo 'Git-sourced dependencies detected; review them as supply-chain inputs.'
            cat artifacts/git-dependency-review.txt
            exit 1
          fi

          # Local path dependencies are allowed only for workspace members.
          if grep -Ein '^source = "file://' Cargo.lock > artifacts/path-dependency-review.txt; then
            echo 'Unexpected file-sourced dependency detected.'
            cat artifacts/path-dependency-review.txt
            exit 1
          fi

      - name: Enforce external tooling separation
        shell: bash
        run: |
          set -euo pipefail
          # Benchmarks, agent frameworks, observability platforms and security
          # scanners are CI-only concerns and must not enter the AWH runtime.
          forbidden='swe-bench|swe-smith|codeclash|swe-rex|mini-swe-agent|swe-agent|sb-cli|openhands|prometheus|opentelemetry|opentelemetry-otlp|grafana|jaeger|datadog|sentry|honeycomb|newrelic|cargo-audit|cargo-deny|gitleaks|semgrep|trivy'
          if grep -Eiq "$forbidden" Cargo.toml Cargo.lock; then
            echo 'Forbidden CI-only tooling detected in AWH runtime manifests.'
            grep -Ein "$forbidden" Cargo.toml Cargo.lock || true
            exit 1
          fi

          if grep -RniE "$forbidden" src 2>/dev/null; then
            echo 'Forbidden CI-only tooling reference detected under src/.'
            exit 1
          fi

      - name: Build locked release artifact
        shell: bash
        run: cargo build --release --locked

      - name: Collect supply-chain diagnostics
        if: always()
        shell: bash
        run: |
          set +e
          git status --short > artifacts/final-git-status.txt
          git diff --check > artifacts/final-diff-check.txt
          git diff -- . > artifacts/final-tracked-diff.txt
          cargo metadata --locked --format-version 1 > artifacts/final-cargo-metadata.json 2>&1
          cargo tree --locked --all-features > artifacts/final-cargo-tree.txt 2>&1
          sha256sum target/release/awh > artifacts/awh-release-sha256.txt 2>/dev/null || true

      - name: Upload supply-chain artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: awh-supply-chain-validation
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14

      - name: Final read-only integrity gate
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git diff --quiet -- .
          echo 'Supply-chain validation completed without modifying tracked AWH files.'
