name: AWH Provenance Validation

on:
  pull_request:
    branches: [rust]
  workflow_dispatch:

concurrency:
  group: awh-provenance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Provenance validation is CI-only infrastructure. It observes the repository
# and build outputs but never becomes an AWH runtime dependency or mutates state.
permissions:
  contents: read

jobs:
  provenance:
    name: Provenance Validation (Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Capture environment provenance
        shell: bash
        run: |
          set -u
          mkdir -p artifacts
          {
            echo '# AWH provenance validation'
            echo "repository=${GITHUB_REPOSITORY}"
            echo "ref=${GITHUB_REF}"
            echo "sha=${GITHUB_SHA}"
            echo "event=${GITHUB_EVENT_NAME}"
            echo "runner_os=${RUNNER_OS}"
            echo "runner_arch=${RUNNER_ARCH}"
            echo "workflow=${GITHUB_WORKFLOW}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "run_attempt=${GITHUB_RUN_ATTEMPT}"
            rustc --version || true
            cargo --version || true
          } | tee artifacts/environment-provenance.txt

      - name: Verify repository is clean before validation
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"

      - name: Required Rust formatting check
        shell: bash
        run: cargo fmt --all -- --check

      - name: Required Rust build check
        shell: bash
        run: cargo check --all-targets

      - name: Required Rust test suite
        shell: bash
        run: cargo test --all-targets

      - name: Required Rust Clippy check
        shell: bash
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Build locked release artifact
        shell: bash
        run: cargo build --release --locked

      - name: Collect source and dependency provenance
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD > artifacts/source-commit.txt
          git status --short > artifacts/source-status.txt
          git diff --check > artifacts/source-diff-check.txt
          git ls-files > artifacts/tracked-files.txt
          cargo metadata --format-version 1 > artifacts/cargo-metadata.json
          cargo tree --all-features > artifacts/cargo-tree.txt
          sha256sum Cargo.toml Cargo.lock > artifacts/manifest-sha256.txt
          sha256sum target/release/awh > artifacts/awh-release-sha256.txt

      - name: Validate runtime provenance boundaries
        shell: bash
        run: |
          set -euo pipefail
          # CI-only provenance/observability/review infrastructure must not
          # enter the AWH runtime dependency graph.
          forbidden='prometheus|opentelemetry|opentelemetry-otlp|grafana|jaeger|datadog|sentry|honeycomb|newrelic|swe-bench|swe-smith|codeclash|swe-rex|mini-swe-agent|swe-agent|sb-cli|openhands|gitleaks|semgrep|trivy|cargo-audit|cargo-deny'
          if grep -Eiq "$forbidden" Cargo.toml Cargo.lock; then
            echo 'CI-only tooling detected in AWH runtime manifests.'
            grep -Ein "$forbidden" Cargo.toml Cargo.lock || true
            exit 1
          fi

          # Provenance collection itself must remain outside src/.
          if git ls-files 'src/**' | grep -Eiq '(provenance|telemetry|observability-agent|ci-metadata)'; then
            echo 'Potential CI-only provenance implementation found inside src/.'
            exit 1
          fi

      - name: Validate reproducible identity metadata
        shell: bash
        run: |
          set -euo pipefail
          ./target/release/awh --version | tee artifacts/awh-version.txt
          ./target/release/awh --help > artifacts/awh-help.txt
          ./target/release/awh status | tee artifacts/awh-status.txt

          test -s artifacts/awh-version.txt
          test -s artifacts/awh-help.txt
          test -s artifacts/awh-status.txt

      - name: Collect provenance diagnostics
        if: always()
        shell: bash
        run: |
          set +e
          git status --short > artifacts/final-git-status.txt
          git diff -- . > artifacts/final-tracked-diff.txt
          cargo metadata --format-version 1 > artifacts/final-cargo-metadata.json 2>&1
          cargo tree --all-features > artifacts/final-cargo-tree.txt 2>&1
          find target/release -maxdepth 1 -type f -printf '%f %s bytes\n' \
            > artifacts/release-artifacts.txt 2>/dev/null || true

      - name: Upload provenance artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: awh-provenance-validation
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14

      - name: Final read-only integrity gate
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git diff --quiet -- .
          echo 'Provenance validation completed without modifying tracked AWH files.'
