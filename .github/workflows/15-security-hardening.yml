name: AWH Security Hardening Validation

on:
  pull_request:
    branches: [rust]
  workflow_dispatch:

concurrency:
  group: awh-security-hardening-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Security validation is external CI infrastructure. It is read-only and must
# never become an AWH runtime dependency or modify repository state.
permissions:
  contents: read

jobs:
  security-hardening:
    name: Security Hardening (Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Capture security validation environment
        shell: bash
        run: |
          set -u
          mkdir -p artifacts
          {
            echo '# AWH security hardening validation environment'
            echo "OS=${RUNNER_OS}"
            echo "ARCH=${RUNNER_ARCH}"
            echo "REF=${GITHUB_REF}"
            echo "SHA=${GITHUB_SHA}"
            rustc --version || true
            cargo --version || true
          } | tee artifacts/environment.txt

      - name: Verify repository is clean before validation
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"

      - name: Required Rust formatting check
        shell: bash
        run: cargo fmt --all -- --check

      - name: Required Rust build check
        shell: bash
        run: cargo check --all-targets

      - name: Required Rust test suite
        shell: bash
        run: cargo test --all-targets

      - name: Required Rust Clippy security check
        shell: bash
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Validate locked release build
        shell: bash
        run: cargo build --release --locked

      - name: Dependency audit
        shell: bash
        run: |
          set -euo pipefail
          if command -v cargo-audit >/dev/null 2>&1; then
            cargo audit --locked | tee artifacts/cargo-audit.txt
          else
            cargo install cargo-audit --locked --version 0.22.0
            cargo audit --locked | tee artifacts/cargo-audit.txt
          fi

      - name: Validate security policy and documentation
        shell: bash
        run: |
          set -euo pipefail
          test -f docs/security.md
          test -f docs/error.md
          test -f docs/development.md
          grep -Eiq '(security|sandbox|secret|credential|MCP|path)' docs/security.md
          grep -Eiq '(error|failure|security)' docs/error.md

      - name: Check for unsafe Rust and secret-handling hazards
        shell: bash
        run: |
          set -euo pipefail
          # Record occurrences for review rather than treating comments/docs as
          # vulnerabilities. The source-level unsafe check is intentionally
          # conservative and fails only on unsafe blocks/functions in Rust code.
          rg -n --glob '*.rs' '\bunsafe\s*(\{|fn|impl|trait|extern|union)' . \
            > artifacts/unsafe-rust.txt || true
          rg -n --hidden \
            --glob '!target/**' \
            --glob '!.git/**' \
            --glob '!*.lock' \
            '(BEGIN (RSA|OPENSSH|EC|DSA|PRIVATE) KEY|AKIA[0-9A-Z]{16}|AIza[0-9A-Za-z_-]{20,}|gh[pousr]_[A-Za-z0-9_]{20,})' . \
            > artifacts/secret-pattern-scan.txt || true

          if grep -Eiq '(BEGIN (RSA|OPENSSH|EC|DSA|PRIVATE) KEY|AKIA[0-9A-Z]{16}|AIza[0-9A-Za-z_-]{20,}|gh[pousr]_[A-Za-z0-9_]{20,})' artifacts/secret-pattern-scan.txt; then
            echo 'Potential hard-coded secret material detected.'
            cat artifacts/secret-pattern-scan.txt
            exit 1
          fi

      - name: Verify runtime dependency separation
        shell: bash
        run: |
          set -euo pipefail
          forbidden='swe-bench|swe-smith|codeclash|swe-rex|mini-swe-agent|swe-agent|sb-cli|openhands|cargo-audit|cargo-deny|gitleaks|semgrep'
          if grep -Eiq "$forbidden" Cargo.toml Cargo.lock; then
            echo 'External security/agent tooling must not be an AWH runtime dependency.'
            grep -Ein "$forbidden" Cargo.toml Cargo.lock || true
            exit 1
          fi
          cargo metadata --format-version 1 > artifacts/cargo-metadata.json
          cargo tree --all-features > artifacts/cargo-tree.txt

      - name: Validate security-sensitive source patterns
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '# Security-sensitive source pattern inventory'
            rg -n --glob '*.rs' \
              '(std::process::Command|Command::new|TcpListener|TcpStream|File::open|OpenOptions|read_to_string|write_all|remove_file|canonicalize|set_permissions|secret|token|api[_-]?key|authorization|bearer|tls|rustls)' \
              src tests 2>/dev/null || true
          } | tee artifacts/security-pattern-inventory.txt

      - name: Collect security diagnostics
        if: always()
        shell: bash
        run: |
          set +e
          git status --short > artifacts/git-status.txt
          git diff --check > artifacts/diff-check.txt
          git diff -- . > artifacts/tracked-diff.txt
          cargo metadata --format-version 1 > artifacts/cargo-metadata-final.json 2>&1
          cargo tree --all-features > artifacts/cargo-tree-final.txt 2>&1

      - name: Upload security artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: awh-security-hardening
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14

      - name: Final read-only integrity gate
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git diff --quiet -- .
          echo 'Security hardening validation completed without modifying tracked AWH files.'
