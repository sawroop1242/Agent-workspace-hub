name: Checkpoint State Tests

on:
  push:
    branches: [rust]
    paths:
      - '.openhands/state.json'
      - '.openhands/state.schema.json'
      - 'scripts/checkpoint_state.py'
      - 'scripts/safe_git.py'
      - 'tests/checkpoint_state_test.py'
      - 'tests/safe_git_test.py'
      - '.github/workflows/awh-recovery.yml'
      - '.github/workflows/checkpoint-state-tests.yml'
  pull_request:
    paths:
      - '.openhands/state.json'
      - '.openhands/state.schema.json'
      - 'scripts/checkpoint_state.py'
      - 'scripts/safe_git.py'
      - 'tests/checkpoint_state_test.py'
      - 'tests/safe_git_test.py'
      - '.github/workflows/awh-recovery.yml'
      - '.github/workflows/checkpoint-state-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checkpoint-tests:
    name: Checkpoint tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test runner
        run: python -m pip install --disable-pip-version-check pytest

      - name: Validate committed checkpoint
        run: python scripts/checkpoint_state.py validate

      - name: Run checkpoint regression tests
        run: python -m pytest -q tests/checkpoint_state_test.py tests/safe_git_test.py
