name: AWH CI

# This single workflow replaces .github/workflows/00-ci.yml through
# 26-release-compliance.yml (27 files). Those files independently
# re-implemented the same `cargo fmt / check / clippy / test` core anywhere
# from 9 to 20+ times per pull request, wrapped in different thematic names
# (Security, Compliance, Observability, Provenance, Supply Chain, five
# separate "Release *" variants, etc.). Each file's genuinely distinct check
# — documentation completeness, release-binary/package validation, the
# runtime-separation grep, agent-pipeline verification — is preserved below
# as its own job, built on top of one shared build core instead of a private
# copy of it.
#
# Scope note: this file intentionally does not touch .github/workflows/
# main.yml, release-rust.yml, rust.yml, or 27-agent-engine.yml — those were
# outside the requested 00-26 consolidation and are left for a separate pass.
#
# BOUNDARY: every job here is read-only CI validation. Nothing in this file
# publishes, tags, pushes, signs, or uploads outside GitHub Actions artifact
# storage. External agent/benchmark tooling (mini-swe-agent, SWE-bench,
# SWE-smith, SWE-ReX, etc.) referenced in job names or docs must never enter
# Cargo.toml, Cargo.lock, or src/ — the runtime-separation job enforces this.

on:
  pull_request:
    branches: [rust]
  workflow_dispatch:
  schedule:
    - cron: '30 18 * * *' # nightly deep check (release-profile build + full audit)

permissions:
  contents: read

concurrency:
  group: awh-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: cargo fmt --check
        run: cargo fmt --all -- --check

  build-test:
    name: Build / test
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo check
        run: cargo check --all-targets
      - name: cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: cargo test
        run: cargo test --all-targets

  audit:
    name: Dependency audit
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        run: cargo install --locked cargo-audit
      - name: cargo audit
        run: cargo audit
      - name: Duplicate-dependency report
        run: cargo tree --duplicates || true

  docs-validation:
    name: Documentation validation
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify required documentation exists
        id: required_docs
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          required=(
            README.md
            docs/PROJECT_CONTEXT.md
            docs/PROJECT_ROADMAP.md
            docs/PROJECT_ROADMAP_STATUS.md
            docs/PROJECT_STATUS.md
            docs/FEATURES.md
            docs/CLI.md
            docs/architecture.md
            docs/security.md
            docs/threat-model.md
            docs/mcp.md
            docs/configuration.md
            docs/development.md
            docs/testing.md
            docs/release.md
            docs/INSTALL.md
            docs/completeness-audit.md
            docs/error.md
            docs/ROADMAP_AGENT_PROFILES_POLICY_MCP.md
            docs/ROADMAP_GAP_MATRIX.md
            docs/RECONCILED_ROADMAP_V2.md
            docs/issue-resolving-prompts/README.md
            .github/agent/system.md
            .github/agent/rules.md
            .github/agent/verification.md
            .github/agent/task-template.md
            .github/agent/completion.md
          )
          missing=0
          for path in "${required[@]}"; do
            if [[ -s "$path" ]]; then
              echo "PASS $path"
            else
              echo "FAIL $path"
              missing=1
            fi
          done
          exit "$missing"

      - name: Validate Markdown files and local links
        id: markdown_links
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re
          import sys
          from urllib.parse import unquote, urlparse

          roots = [Path("README.md"), Path("docs")]
          files = []
          for root in roots:
              if root.is_file():
                  files.append(root)
              elif root.is_dir():
                  files.extend(sorted(root.rglob("*.md")))

          files = sorted(set(files))
          failures = []

          for path in files:
              text = path.read_text(encoding="utf-8")
              if not text.strip():
                  failures.append(f"EMPTY {path}")
                  continue
              for match in re.finditer(r"!?\[[^\]]*\]\(([^)]+)\)", text):
                  target = match.group(1).strip().split()[0].strip("<>")
                  if not target or target.startswith(("#", "mailto:", "http://", "https://")):
                      continue
                  parsed = urlparse(target)
                  if parsed.scheme or parsed.netloc:
                      continue
                  relative = unquote(parsed.path)
                  if not relative:
                      continue
                  candidate = (path.parent / relative).resolve()
                  repo_root = Path.cwd().resolve()
                  try:
                      candidate.relative_to(repo_root)
                  except ValueError:
                      failures.append(f"OUTSIDE_REPO {path} -> {target}")
                      continue
                  if not candidate.exists():
                      failures.append(f"BROKEN {path} -> {target}")

          if failures:
              for f in failures:
                  print(f)
              sys.exit(1)
          print("All repository-local Markdown links resolved.")
          PY

      - name: Check documentation whitespace
        id: diff_check
        continue-on-error: true
        run: git diff --check

      - name: Enforce documentation validation
        if: always()
        shell: bash
        run: |
          if [[ "${{ steps.required_docs.outcome }}" != "success" ||
                "${{ steps.markdown_links.outcome }}" != "success" ||
                "${{ steps.diff_check.outcome }}" != "success" ]]; then
            echo "Documentation validation failed."
            exit 1
          fi

  runtime-separation:
    name: Runtime separation check
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify external tooling never enters the AWH runtime
        shell: bash
        run: |
          set -euo pipefail
          forbidden='swe-bench|swe-smith|codeclash|swe-rex|mini-swe-agent|swe-agent|sb-cli|openhands|prometheus|opentelemetry|opentelemetry-otlp|grafana|jaeger|datadog|sentry|honeycomb|newrelic|cargo-audit|cargo-deny|gitleaks|semgrep|trivy|cosign|sigstore'

          if grep -Eiq "$forbidden" Cargo.toml Cargo.lock; then
            echo 'CI-only/external tooling detected in AWH runtime manifests.'
            grep -Ein "$forbidden" Cargo.toml Cargo.lock || true
            exit 1
          fi

          if grep -RniE "$forbidden" src 2>/dev/null; then
            echo 'CI-only/external tooling reference detected under src/.'
            exit 1
          fi

          echo 'External CI/benchmark/observability tooling is separate from the AWH runtime.'

  release-readiness:
    name: Release readiness
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    needs: [build-test]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build locked release binary
        run: cargo build --release --locked

      - name: Validate release binary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          test -x target/release/awh
          target/release/awh --version | tee artifacts/awh-version.txt
          target/release/awh --help | tee artifacts/awh-help.txt
          target/release/awh status | tee artifacts/awh-status.txt
          sha256sum target/release/awh | tee artifacts/awh-release-sha256.txt

      - name: Validate release package contents
        shell: bash
        run: |
          set -euo pipefail
          rm -rf artifacts/package
          mkdir -p artifacts/package
          cargo package --locked --allow-dirty --no-verify
          package=$(find target/package -maxdepth 1 -type f -name '*.crate' | head -n 1)
          test -n "$package"
          cp "$package" artifacts/package/
          tar -tzf "$package" | tee artifacts/package/contents.txt

          if tar -tzf "$package" | grep -E '(^|/)(\.github/workflows/|\.env$|.*\.(pem|key|p12|pfx)$)'; then
            echo 'Release package contains forbidden CI or secret material.'
            exit 1
          fi

      - name: Validate locked dependency graph
        shell: bash
        run: |
          set -euo pipefail
          cargo metadata --locked --format-version 1 > artifacts/cargo-metadata.json
          cargo tree --locked --all-features > artifacts/cargo-tree.txt
          sha256sum Cargo.toml Cargo.lock | tee artifacts/manifest-sha256.txt

      - name: Upload release-readiness artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: awh-release-readiness-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 14

  agent-pipeline-validation:
    name: Agent pipeline validation
    if: >-
      github.event_name != 'schedule' &&
      (github.event_name == 'workflow_dispatch' ||
       contains(github.event.pull_request.base.ref, 'rust'))
    runs-on: ubuntu-latest
    needs: [build-test]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check whether agent pipeline paths changed
        id: changed
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          if git diff --name-only "$base" "$head" | grep -Eq '^(\.github/agent-engine/|\.github/agent/|scripts/)'; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: dtolnay/rust-toolchain@stable
        if: steps.changed.outputs.relevant == 'true'
        with:
          components: clippy

      - name: Validate agent-engine feature registry
        if: steps.changed.outputs.relevant == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 -c "import yaml,sys; yaml.safe_load(open('.github/agent-engine/feature-registry.yml'))"

      - name: Run agent-engine orchestrator tests
        if: steps.changed.outputs.relevant == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [ -f tests/agent_engine_orchestrator_test.py ]; then
            python3 -m pytest tests/agent_engine_orchestrator_test.py -v
          fi

      - name: Skipped (no agent-pipeline changes)
        if: steps.changed.outputs.relevant != 'true'
        run: echo "No changes under .github/agent-engine/, .github/agent/, or scripts/ — skipping."

  nightly-deep-check:
    name: Nightly deep check
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo check --all-targets
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-targets
      - run: cargo build --release --locked
      - name: Install cargo-audit
        run: cargo install --locked cargo-audit
      - run: cargo audit
