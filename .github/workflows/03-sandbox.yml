name: External AWH Sandbox Verification

on:
  pull_request:
    branches:
      - rust
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: awh-sandbox-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# EXTERNAL TOOLING BOUNDARY:
# This workflow verifies the AWH repository from an isolated GitHub-hosted
# runner. External agents/sandboxes are evaluation infrastructure only and
# are deliberately NOT dependencies of the AWH runtime, Cargo manifest, or
# product binaries. This workflow does not modify repository state or push.

jobs:
  sandbox:
    name: Isolated sandbox verification (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Checkout AWH revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Record sandbox boundary
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "sandbox=github-hosted-runner"
            echo "external-agent-runtime=isolated-from-AWH-runtime"
            echo "AWH-runtime-dependencies=unchanged"
            echo "cargo-manifest-modification=forbidden"
            echo "repository-write=forbidden"
            echo "revision=$(git rev-parse HEAD)"
            echo "runner_os=${RUNNER_OS}"
            echo "runner_arch=${RUNNER_ARCH}"
          } | tee sandbox-boundary.txt

      - name: Verify external tooling is not an AWH dependency
        shell: bash
        run: |
          set -euo pipefail
          test -f Cargo.toml
          test -f Cargo.lock
          if grep -Eiq '(mini-swe-agent|swe-agent|swe-rex|swe-bench|swebench|swe-smith|codeclash|sb-cli|openhands)' Cargo.toml Cargo.lock; then
            echo "Forbidden external agent/benchmark dependency detected in AWH runtime manifests."
            exit 1
          fi
          echo "No prohibited external agent/benchmark runtime dependency found."

      - name: Verify repository is clean before sandbox checks
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          test -z "$(git status --porcelain)"

      - name: Format check
        id: fmt
        continue-on-error: true
        run: cargo fmt --all -- --check

      - name: Cargo check
        id: check
        continue-on-error: true
        run: cargo check --all-targets

      - name: Test suite
        id: test
        continue-on-error: true
        run: cargo test --all-targets

      - name: Clippy check
        id: clippy
        if: runner.os == 'Linux'
        continue-on-error: true
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Capture sandbox diagnostics
        if: always()
        shell: bash
        run: |
          set +e
          {
            echo "=== outcomes ==="
            echo "fmt=${{ steps.fmt.outcome }}"
            echo "check=${{ steps.check.outcome }}"
            echo "test=${{ steps.test.outcome }}"
            echo "clippy=${{ steps.clippy.outcome }}"
            echo "=== repository ==="
            git status --short
            git diff --check
            echo "=== revision ==="
            git rev-parse HEAD
            git log -5 --oneline
            echo "=== toolchain ==="
            rustc --version
            cargo --version
          } > sandbox-diagnostics.txt 2>&1
          cat sandbox-diagnostics.txt

      - name: Verify sandbox did not modify AWH
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "Sandbox verification modified the checked-out AWH tree."
            git status --short
            exit 1
          fi

      - name: Upload sandbox artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: awh-sandbox-${{ matrix.os }}-${{ github.run_id }}
          path: |
            sandbox-boundary.txt
            sandbox-diagnostics.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Enforce required sandbox verification
        if: always()
        shell: bash
        run: |
          if [[ "${{ steps.fmt.outcome }}" != "success" ||
                "${{ steps.check.outcome }}" != "success" ||
                "${{ steps.test.outcome }}" != "success" ]]; then
            echo "Required sandbox verification failed."
            exit 1
          fi

          if [[ "${{ runner.os }}" == "Linux" && "${{ steps.clippy.outcome }}" != "success" ]]; then
            echo "Linux Clippy sandbox verification failed."
            exit 1
          fi
