name: AWH Security Validation

on:
  pull_request:
    branches:
      - rust
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: awh-security-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# SECURITY VALIDATION BOUNDARY:
# This workflow is an external, read-only validation layer. It audits the
# checked-out AWH source and dependency graph but does not modify the AWH
# runtime, add security tooling to Cargo.toml, publish releases, or push code.
# Temporary scanners and reports exist only inside the GitHub Actions runner.

jobs:
  security:
    name: Security validation (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Checkout AWH revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Capture security context
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "revision=$(git rev-parse HEAD)"
            echo "runner_os=${RUNNER_OS}"
            echo "runner_arch=${RUNNER_ARCH}"
            echo "rustc=$(rustc --version)"
            echo "cargo=$(cargo --version)"
          } | tee security-context.txt

      - name: Verify clean checkout
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"

      - name: Cargo dependency audit
        id: audit
        if: runner.os == 'Linux'
        continue-on-error: true
        run: |
          cargo install --locked cargo-audit
          cargo audit --json > cargo-audit.json

      - name: Check dependency graph for prohibited runtime tooling
        id: dependency_boundary
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          forbidden='(mini-swe-agent|swe-agent|swe-rex|swe-bench|swebench|swe-smith|swe_smith|codeclash|sb-cli|openhands)'

          if grep -Eiq "$forbidden" Cargo.toml Cargo.lock; then
            echo "Forbidden external agent/benchmark dependency detected in AWH runtime manifests."
            exit 1
          fi

          cargo tree > cargo-tree.txt
          if grep -Eiq "$forbidden" cargo-tree.txt; then
            echo "Forbidden external agent/benchmark dependency detected in Cargo dependency tree."
            exit 1
          fi

          echo "No prohibited external agent/benchmark runtime dependency detected."

      - name: Scan repository for private-key material
        id: private_keys
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          output=private-key-scan.txt
          : > "$output"

          if git grep -n -I -E '-----BEGIN (RSA|OPENSSH|EC|DSA|PGP) PRIVATE KEY-----' -- . ':!.git' > "$output"; then
            echo "Private-key header detected in tracked repository content."
            cat "$output"
            exit 1
          fi

          echo "No private-key headers detected in tracked text content."

      - name: Scan repository for hard-coded secret assignments
        id: secret_assignments
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          output=secret-assignment-scan.txt
          : > "$output"

          # This is a static source scan only. It does not inspect GitHub
          # Actions secret values, which are intentionally unavailable here.
          if git grep -n -I -E '(NVIDIA_NIM_API_KEY_[1-4]|GEMINI_API_KEY_[1-4])=[^[:space:]$#]+|(^|[^A-Za-z])(API_KEY|SECRET_KEY|ACCESS_TOKEN|AUTH_TOKEN)[[:space:]]*[:=][[:space:]]*["'"''][^"'"']{12,}["'"'']' -- . ':!.git' > "$output"; then
            echo "Potential hard-coded secret assignment detected."
            cat "$output"
            exit 1
          fi

          echo "No matching hard-coded secret assignments detected."

      - name: Check security-sensitive source patterns
        id: source_patterns
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          output=security-pattern-scan.txt
          : > "$output"

          # Flag obvious unsafe process-wide secret/debug patterns for review;
          # this does not attempt to prove the absence of all vulnerabilities.
          if git grep -n -I -E 'println!\([^)]*(API_KEY|SECRET|TOKEN|PASSWORD)|eprintln!\([^)]*(API_KEY|SECRET|TOKEN|PASSWORD)' -- '*.rs' > "$output"; then
            echo "Potential secret-bearing debug output detected."
            cat "$output"
            exit 1
          fi

          echo "No obvious secret-bearing println!/eprintln! patterns detected."

      - name: Rust security checks
        id: rust_checks
        continue-on-error: true
        run: |
          cargo fmt --all -- --check
          cargo check --all-targets
          cargo test --all-targets

      - name: Collect security metadata
        if: always()
        shell: bash
        run: |
          set +e
          cargo metadata --format-version 1 > cargo-metadata.json 2> cargo-metadata.stderr
          cargo tree > cargo-tree-full.txt 2>&1
          git diff --check > git-diff-check.txt 2>&1
          git status --short > git-status.txt 2>&1

          {
            echo "=== security check outcomes ==="
            echo "audit=${{ steps.audit.outcome }}"
            echo "dependency_boundary=${{ steps.dependency_boundary.outcome }}"
            echo "private_keys=${{ steps.private_keys.outcome }}"
            echo "secret_assignments=${{ steps.secret_assignments.outcome }}"
            echo "source_patterns=${{ steps.source_patterns.outcome }}"
            echo "rust_checks=${{ steps.rust_checks.outcome }}"
            echo "=== repository status ==="
            cat git-status.txt
          } > security-report.txt
          cat security-report.txt

      - name: Upload security artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: awh-security-${{ matrix.os }}-${{ github.run_id }}
          path: |
            security-context.txt
            security-report.txt
            cargo-audit.json
            cargo-tree.txt
            cargo-tree-full.txt
            cargo-metadata.json
            cargo-metadata.stderr
            private-key-scan.txt
            secret-assignment-scan.txt
            security-pattern-scan.txt
            git-diff-check.txt
            git-status.txt
          if-no-files-found: ignore
          retention-days: 14

      - name: Enforce security validation
        if: always()
        shell: bash
        run: |
          if [[ "${{ steps.dependency_boundary.outcome }}" != "success" ||
                "${{ steps.private_keys.outcome }}" != "success" ||
                "${{ steps.secret_assignments.outcome }}" != "success" ||
                "${{ steps.source_patterns.outcome }}" != "success" ||
                "${{ steps.rust_checks.outcome }}" != "success" ]]; then
            echo "Security validation failed. See uploaded artifacts."
            exit 1
          fi

          if [[ "${{ runner.os }}" == "Linux" && "${{ steps.audit.outcome }}" != "success" ]]; then
            echo "Dependency audit failed. See uploaded artifacts."
            exit 1
          fi

      - name: Verify read-only repository state
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$(git status --porcelain)" ]]; then
            # The workflow itself creates diagnostic files, so verify only
            # tracked files remain unchanged rather than requiring a pristine
            # working directory after report generation.
            if ! git diff --quiet -- .; then
              echo "Tracked AWH files were modified during security validation."
              git status --short
              git diff -- .
              exit 1
            fi
          fi
