name: OpenCode Issue Resolver

on:
  issues:
    types: [labeled]

  issue_comment:
    types: [created]

  workflow_dispatch:
    inputs:
      issue_number:
        description: "The issue number you want OpenCode to resolve"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: read

jobs:
  resolve-issue:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'issues' &&
        github.event.label.name == 'fix-me'
      ) ||
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.pull_request == null &&
        contains(github.event.comment.body, '@openhands-agent')
      )

    runs-on: ${{ vars.TARGET_RUNNER || 'ubuntu-latest' }}

    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve issue number
        id: issue
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_ISSUE: ${{ inputs.issue_number }}
          EVENT_ISSUE: ${{ github.event.issue.number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            ISSUE_NUMBER="$DISPATCH_ISSUE"
          else
            ISSUE_NUMBER="$EVENT_ISSUE"
          fi

          if ! [[ "$ISSUE_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "::error::Invalid issue number: $ISSUE_NUMBER"
            exit 1
          fi

          ISSUE_JSON="$(gh issue view "$ISSUE_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --json title,body,url)"

          {
            echo "number=$ISSUE_NUMBER"

            echo "title<<OPENCODE_ISSUE_TITLE"
            printf '%s\n' "$ISSUE_JSON" | jq -r '.title'
            echo "OPENCODE_ISSUE_TITLE"

            echo "body<<OPENCODE_ISSUE_BODY"
            printf '%s\n' "$ISSUE_JSON" | jq -r '.body'
            echo "OPENCODE_ISSUE_BODY"

            echo "url=$(printf '%s\n' "$ISSUE_JSON" | jq -r '.url')"
          } >> "$GITHUB_OUTPUT"

      - name: Validate OpenCode configuration
        shell: bash
        env:
          FREELLMAPI_API_KEY: ${{ secrets.FREELLMAPI_API_KEY }}
        run: |
          set -euo pipefail

          test -n "$FREELLMAPI_API_KEY" || {
            echo "::error::FREELLMAPI_API_KEY GitHub Actions secret is not configured"
            exit 1
          }

      - name: Install OpenCode
        shell: bash
        run: |
          set -euo pipefail

          npm install --global @opencode/cli

          opencode --version

      - name: Configure OpenCode
        shell: bash
        run: |
          set -euo pipefail

          cat > "$GITHUB_WORKSPACE/opencode.json" <<'EOF'
          {
            "$schema": "https://opencode.ai/config.json",
            "provider": {
              "freellmapi": {
                "npm": "@ai-sdk/openai-compatible",
                "name": "FreeLLMAPI",
                "options": {
                  "baseURL": "https://freellmapi-production-905c.up.railway.app/v1",
                  "apiKey": "{env:FREELLMAPI_API_KEY}"
                },
                "models": {
                  "auto": {
                    "name": "auto"
                  }
                }
              }
            }
          }
          EOF

      - name: Run OpenCode
        id: opencode
        shell: bash
        env:
          FREELLMAPI_API_KEY: ${{ secrets.FREELLMAPI_API_KEY }}
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
          ISSUE_TITLE: ${{ steps.issue.outputs.title }}
          ISSUE_BODY: ${{ steps.issue.outputs.body }}
          ISSUE_URL: ${{ steps.issue.outputs.url }}
        run: |
          set -euo pipefail

          cat > /tmp/opencode-prompt.md <<EOF
          You are the coding agent for Agent Workspace Hub (AWH).

          Repository: ${GITHUB_REPOSITORY}
          Target branch: rust
          Issue: #${ISSUE_NUMBER}
          Issue URL: ${ISSUE_URL}

          Issue title:
          ${ISSUE_TITLE}

          Issue body:
          ---
          ${ISSUE_BODY}
          ---

          Your task:

          1. Read the repository architecture and relevant documentation before editing.
          2. Understand the issue and identify the actual root cause.
          3. Implement the smallest correct production-quality fix.
          4. Preserve the existing AWH architecture and Rust conventions.
          5. Do not modify unrelated files.
          6. Add or update focused tests for the change.
          7. Run cargo fmt --all -- --check.
          8. Run the relevant cargo tests.
          9. Run cargo test when practical.
          10. Review the final git diff for accidental or unrelated changes.
          11. Do NOT create a branch.
          12. Do NOT commit.
          13. Do NOT push.
          14. Do NOT create a pull request.

          The surrounding GitHub Actions workflow will handle branch creation,
          commit, push, and pull-request creation after you finish.

          If the issue is ambiguous, do not invent requirements.
          Make only changes supported by the issue and repository context.

          Leave the working tree containing the completed implementation and tests.
          EOF

          cd "$GITHUB_WORKSPACE"\n\n          timeout 35m opencode run \
            --standalone \
            --model freellmapi/auto \
            --auto \
            "$(cat /tmp/opencode-prompt.md)" \
            2>&1 | tee /tmp/opencode-output.log

          {
            echo "summary<<OPENCODE_FINAL_MESSAGE"
            tail -n 120 /tmp/opencode-output.log
            echo "OPENCODE_FINAL_MESSAGE"
          } >> "$GITHUB_OUTPUT"

      - name: Create branch, commit, and push
        id: git
        shell: bash
        env:
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if git diff --quiet && git diff --cached --quiet; then
            echo "No changes were produced by OpenCode."

            gh issue comment "$ISSUE_NUMBER" \
              --repo "$GITHUB_REPOSITORY" \
              --body "OpenCode completed the run but produced no working-tree changes. No pull request was created."

            exit 0
          fi

          BRANCH="opencode/issue-${ISSUE_NUMBER}-${GITHUB_RUN_ID}"

          git switch -c "$BRANCH"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          git diff --cached --check

          git commit -m "fix: resolve issue #${ISSUE_NUMBER}"

          git push --set-upstream origin "$BRANCH"

          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Create pull request
        if: steps.git.outputs.branch != ''
        shell: bash
        env:
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
          ISSUE_TITLE: ${{ steps.issue.outputs.title }}
          BRANCH: ${{ steps.git.outputs.branch }}
          OPENCODE_SUMMARY: ${{ steps.opencode.outputs.summary }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          PR_BODY_FILE="$(mktemp)"
          trap 'rm -f "$PR_BODY_FILE"' EXIT

          cat > "$PR_BODY_FILE" <<EOF
          ## Summary

          OpenCode implemented the requested fix for #${ISSUE_NUMBER}.

          ## Issue

          ${ISSUE_TITLE}

          ## Verification

          OpenCode was instructed to run:

          - cargo fmt --all -- --check
          - relevant cargo tests
          - cargo test when practical

          ## OpenCode output

          ${OPENCODE_SUMMARY}

          Fixes #${ISSUE_NUMBER}
          EOF

          gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base rust \
            --head "$BRANCH" \
            --title "fix: resolve issue #${ISSUE_NUMBER}" \
            --body-file "$PR_BODY_FILE"
