name: OpenHands Issue Resolver

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'The issue number you want OpenHands to resolve'
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  resolve-issue:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' && github.event.label.name == 'fix-me') ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request == null &&
       contains(github.event.comment.body, '@openhands-agent'))
    runs-on: ${{ vars.TARGET_RUNNER || 'ubuntu-latest' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Dynamic Issue Context
        id: parse_issue
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "num=${{ github.event.inputs.issue_number }}" >> $GITHUB_OUTPUT
          else
            echo "num=${{ github.event.issue.number }}" >> $GITHUB_OUTPUT
          fi

      - name: Pull and Execute OpenHands Resolver Container
        run: |
          docker run --rm \
            -e LLM_MODEL="${{ vars.LLM_MODEL || 'openai/z-ai/glm-5.3' }}" \
            -e LLM_BASE_URL="https://nvidia.com" \
            -e LLM_API_KEY="${{ secrets.AWH_AGENT2_NVIDIA_KEY_1 }}" \
            -e GITHUB_TOKEN="${{ secrets.AWH_AUTOMATION_TOKEN }}" \
            -e ANYSCALE_API_KEY="${{ secrets.AWH_AUTOMATION_TOKEN }}" \
            -v "${{ github.workspace }}:/workspace" \
            ghcr.io/openhands/openhands-resolver:latest \
            --issue-number "${{ steps.parse_issue.outputs.num }}" \
            --repo "${{ github.repository }}" \
            --branch "${{ vars.TARGET_BRANCH || 'rust' }}" \
            --max-iter "${{ vars.OPENHANDS_MAX_ITER || '50' }}"
            
