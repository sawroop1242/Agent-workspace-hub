name: OpenHands Issue Resolver

# Trigger OpenHands' current reusable resolver for issues labeled "fix-me"
# or issue comments containing "@openhands-agent".

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  call-openhands-resolver:
    if: >-
      (github.event_name == 'issues' && github.event.label.name == 'fix-me') ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request == null &&
       contains(github.event.comment.body, '@openhands-agent'))
    uses: All-Hands-AI/OpenHands/.github/workflows/openhands-resolver.yml@main
    with:
      max_iterations: ${{ fromJson(vars.OPENHANDS_MAX_ITER || '50') }}
      macro: ${{ vars.OPENHANDS_MACRO || '@openhands-agent' }}
      target_branch: ${{ vars.TARGET_BRANCH || 'rust' }}
      pr_type: ${{ vars.OPENHANDS_PR_TYPE || 'draft' }}
      LLM_MODEL: ${{ vars.LLM_MODEL || 'openai/z-ai/glm-5.3' }}
      LLM_API_VERSION: ${{ vars.LLM_API_VERSION || '' }}
      base_container_image: ${{ vars.OPENHANDS_BASE_CONTAINER_IMAGE || '' }}
      runner: ${{ vars.TARGET_RUNNER || 'ubuntu-latest' }}
    secrets:
      LLM_MODEL: ${{ secrets.OPENHANDS_LLM_MODEL }}
      LLM_API_KEY: ${{ secrets.AWH_AGENT2_NVIDIA_KEY_1 }}
      LLM_BASE_URL: ${{ secrets.OPENHANDS_LLM_BASE_URL }}
      PAT_TOKEN: ${{ secrets.AWH_AUTOMATION_TOKEN }}
      PAT_USERNAME: ${{ vars.OPENHANDS_PAT_USERNAME }}
