name: OpenHands Issue Resolver

on:
  issues:
    types: [labeled]

  issue_comment:
    types: [created]

  workflow_dispatch:
    inputs:
      issue_number:
        description: "The issue number you want OpenHands to resolve"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  resolve-issue:
    name: Resolve GitHub Issue with OpenHands

    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'issues' &&
        github.event.label.name == 'fix-me'
      ) ||
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.pull_request == null &&
        contains(github.event.comment.body, '@openhands-agent')
      )

    runs-on: ${{ vars.TARGET_RUNNER || 'ubuntu-latest' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine issue number
        id: parse_issue
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_ISSUE: ${{ inputs.issue_number }}
          EVENT_ISSUE: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            ISSUE_NUMBER="$DISPATCH_ISSUE"
          else
            ISSUE_NUMBER="$EVENT_ISSUE"
          fi

          if ! [[ "$ISSUE_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "Invalid issue number: $ISSUE_NUMBER"
            exit 1
          fi

          echo "num=$ISSUE_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Verify Docker
        run: |
          docker version
          docker info

      - name: Execute OpenHands Issue Resolver
        env:
          OPENHANDS_IMAGE: ghcr.io/openhands/openhands:latest
          REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ steps.parse_issue.outputs.num }}

          LLM_MODEL: ${{ vars.LLM_MODEL || 'openai/z-ai/glm5' }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL || 'https://integrate.api.nvidia.com/v1' }}
          MAX_ITERATIONS: ${{ vars.OPENHANDS_MAX_ITER || '50' }}

          LLM_API_KEY: ${{ secrets.AWH_AGENT2_NVIDIA_KEY_1 }}
          GITHUB_TOKEN: ${{ secrets.AWH_AUTOMATION_TOKEN }}

        run: |
          set -euo pipefail

          echo "=========================================="
          echo "OpenHands Issue Resolver"
          echo "=========================================="
          echo "Repository:     $REPOSITORY"
          echo "Issue:          #$ISSUE_NUMBER"
          echo "Model:          $LLM_MODEL"
          echo "Base URL:       $LLM_BASE_URL"
          echo "Max iterations: $MAX_ITERATIONS"
          echo "=========================================="

          test -n "$LLM_API_KEY" || {
            echo "::error::AWH_AGENT2_NVIDIA_KEY_1 is not configured"
            exit 1
          }

          test -n "$GITHUB_TOKEN" || {
            echo "::error::AWH_AUTOMATION_TOKEN is not configured"
            exit 1
          }

          docker run --rm \
            --network host \
            -e LLM_MODEL="$LLM_MODEL" \
            -e LLM_BASE_URL="$LLM_BASE_URL" \
            -e LLM_API_KEY="$LLM_API_KEY" \
            -e GITHUB_TOKEN="$GITHUB_TOKEN" \
            -e SANDBOX_USER_ID="${{ github.actor_id }}" \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            "$OPENHANDS_IMAGE" \
            python -m openhands.resolver.resolve_issue \
              --repo "$REPOSITORY" \
              --issue-number "$ISSUE_NUMBER" \
              --issue-type issue \
              --max-iterations "$MAX_ITERATIONS" \
              --llm-model "$LLM_MODEL" \
              --llm-api-key "$LLM_API_KEY"
