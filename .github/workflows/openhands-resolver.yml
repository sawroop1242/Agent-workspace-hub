name: OpenCode Issue Resolver

on:
  issues:
    types: [labeled]

  issue_comment:
    types: [created]

  workflow_dispatch:
    inputs:
      issue_number:
        description: "The issue number you want OpenCode to resolve"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: read

jobs:
  resolve-issue:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'issues' &&
        github.event.label.name == 'fix-me'
      ) ||
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.pull_request == null &&
        contains(github.event.comment.body, '@openhands-agent')
      )

    runs-on: ${{ vars.TARGET_RUNNER || 'ubuntu-latest' }}

    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve issue number
        id: issue
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_ISSUE: ${{ inputs.issue_number }}
          EVENT_ISSUE: ${{ github.event.issue.number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            ISSUE_NUMBER="$DISPATCH_ISSUE"
          else
            ISSUE_NUMBER="$EVENT_ISSUE"
          fi

          if ! [[ "$ISSUE_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "::error::Invalid issue number: $ISSUE_NUMBER"
            exit 1
          fi

          ISSUE_JSON="$(gh issue view "$ISSUE_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --json title,body,url)"

          {
            echo "number=$ISSUE_NUMBER"

            echo "title<<OPENCODE_ISSUE_TITLE"
            printf '%s\n' "$ISSUE_JSON" | jq -r '.title'
            echo "OPENCODE_ISSUE_TITLE"

            echo "body<<OPENCODE_ISSUE_BODY"
            printf '%s\n' "$ISSUE_JSON" | jq -r '.body'
            echo "OPENCODE_ISSUE_BODY"

            echo "url=$(printf '%s\n' "$ISSUE_JSON" | jq -r '.url')"
          } >> "$GITHUB_OUTPUT"

      - name: Validate OpenCode configuration
        shell: bash
        env:
          FREELLMAPI_API_KEY: ${{ secrets.FREELLMAPI_API_KEY }}
        run: |
          set -euo pipefail

          test -n "$FREELLMAPI_API_KEY" || {
            echo "::error::FREELLMAPI_API_KEY GitHub Actions secret is not configured"
            exit 1
          }

      - name: Install OpenCode
        shell: bash
        run: |
          set -euo pipefail

          npm install --global @opencode/cli

          opencode --version

      - name: Configure OpenCode
        shell: bash
        env:
          FREELLMAPI_API_KEY: ${{ secrets.FREELLMAPI_API_KEY }}
        run: |
          set -euo pipefail

          cat > "$GITHUB_WORKSPACE/opencode.json" <<'EOF'
          {
            "$schema": "https://opencode.ai/config.json",
            "providers": {
              "freellmapi": {
                "package": "@opencode/ai/providers/openai-compatible",
                "settings": {
                  "baseURL": "https://freellmapi-production-905c.up.railway.app/v1",
                  "apiKey": "{env:FREELLMAPI_API_KEY}"
                },
                "models": {
                  "auto": {
                    "modelID": "auto"
                  }
                }
              }
            }
          }
          EOF

          echo "::group::OpenCode configuration"
          echo 'provider=freellmapi'
          echo 'model=freellmapi/auto'
          echo 'package=@opencode/ai/providers/openai-compatible'
          echo 'baseURL=https://freellmapi-production-905c.up.railway.app/v1'
          echo 'apiKey_source=FREELLMAPI_API_KEY (value redacted)'
          jq empty "$GITHUB_WORKSPACE/opencode.json"
          echo 'config_json=valid'
          echo "::endgroup::"

      - name: Smoke test OpenCode provider
        shell: bash
        env:
          FREELLMAPI_API_KEY: ${{ secrets.FREELLMAPI_API_KEY }}
        run: |
          set -euo pipefail

          SMOKE_RAW="$(mktemp)"
          SMOKE_SAFE="$(mktemp)"
          trap 'rm -f "$SMOKE_RAW" "$SMOKE_SAFE"' EXIT

          cd -- "$GITHUB_WORKSPACE"

          echo "::group::OpenCode provider smoke test"
          echo 'request=non-destructive provider connectivity/model response check'
          echo 'provider=freellmapi'
          echo 'model=freellmapi/auto'
          echo 'prompt=Reply with exactly OK. Do not call tools, inspect files, or modify anything.'
          echo 'timeout=90 seconds'
          echo "::endgroup::"

          set +e
          timeout 90s opencode --log-level DEBUG --print-logs --pure run \
            --standalone \
            --model 'freellmapi/auto' \
            --auto \
            'Reply with exactly OK. Do not call tools, inspect files, or modify anything.' \
            > "$SMOKE_RAW" 2>&1
          SMOKE_STATUS=$?
          set -e

          python3 - "$SMOKE_RAW" "$SMOKE_SAFE" "$FREELLMAPI_API_KEY" <<'PY'
          import pathlib
          import sys

          raw_path, safe_path, secret = sys.argv[1:]
          text = pathlib.Path(raw_path).read_text(errors="replace")
          if secret:
              text = text.replace(secret, "[REDACTED]")
          pathlib.Path(safe_path).write_text(text)
          PY

          echo "::group::OpenCode provider smoke-test diagnostics"
          printf 'exit_status=%s\n' "$SMOKE_STATUS"
          if [ "$SMOKE_STATUS" -eq 124 ]; then
            echo 'timeout_status=timed_out'
          else
            echo 'timeout_status=not_timed_out'
          fi
          printf 'output_bytes=%s\n' "$(wc -c < "$SMOKE_SAFE")"
          echo 'last_100_lines='
          tail -n 100 "$SMOKE_SAFE"
          echo "::endgroup::"

          if [ "$SMOKE_STATUS" -ne 0 ]; then
            echo "::error::OpenCode freellmapi/auto smoke test failed with status $SMOKE_STATUS"
            echo "::error::Provider/API diagnostics are shown above with the API key redacted."
            exit "$SMOKE_STATUS"
          fi

      - name: Run OpenCode
        id: opencode
        shell: bash
        env:
          FREELLMAPI_API_KEY: ${{ secrets.FREELLMAPI_API_KEY }}
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
          ISSUE_TITLE: ${{ steps.issue.outputs.title }}
          ISSUE_BODY: ${{ steps.issue.outputs.body }}
          ISSUE_URL: ${{ steps.issue.outputs.url }}
        run: |
          set -euo pipefail

          PROMPT_FILE="$(mktemp)"
          OUTPUT_FILE="$(mktemp)"
          trap 'rm -f "$PROMPT_FILE" "$OUTPUT_FILE"' EXIT

          echo "::group::OpenCode diagnostics"
          OPENCODE_VERSION="$(opencode --version 2>&1)"
          printf 'runner=%s\n' "$RUNNER_NAME"
          printf 'workspace=%q\n' "$GITHUB_WORKSPACE"
          printf 'repository=%q\n' "$GITHUB_REPOSITORY"
          printf 'event=%q\n' "$GITHUB_EVENT_NAME"
          printf 'run_id=%q\n' "$GITHUB_RUN_ID"
          printf 'issue_number=%q\n' "$ISSUE_NUMBER"
          printf 'issue_title_length=%s\n' "${#ISSUE_TITLE}"
          printf 'issue_body_length=%s\n' "${#ISSUE_BODY}"
          printf 'issue_url=%q\n' "$ISSUE_URL"
          printf 'provider=%q\n' 'freellmapi'
          printf 'model=%q\n' 'freellmapi/auto'
          printf 'timeout_minutes=%s\n' '35'
          printf 'freellmapi_key_set=%s\n' "$([ -n "$FREELLMAPI_API_KEY" ] && echo true || echo false)"
          printf 'freellmapi_key_length=%s\n' "${#FREELLMAPI_API_KEY}"
          printf 'node=%s\n' "$(node --version)"
          printf 'npm=%s\n' "$(npm --version)"
          printf 'opencode_version=%q\n' "$OPENCODE_VERSION"
          printf 'working_directory=%q\n' "$PWD"
          git rev-parse --show-toplevel
          git rev-parse --abbrev-ref HEAD
          echo "::endgroup::"

          cat > "$PROMPT_FILE" <<'OPENCODE_PROMPT'
          You are the coding agent for Agent Workspace Hub (AWH).

          Repository: __REPOSITORY__
          Target branch: rust
          Issue: #__ISSUE_NUMBER__
          Issue URL: __ISSUE_URL__

          Issue title:
          __ISSUE_TITLE__

          Issue body:
          ---
          __ISSUE_BODY__
          ---

          Your task:

          1. Read the repository architecture and relevant documentation before editing.
          2. Understand the issue and identify the actual root cause.
          3. Implement the smallest correct production-quality fix.
          4. Preserve the existing AWH architecture and Rust conventions.
          5. Do not modify unrelated files.
          6. Add or update focused tests for the change.
          7. Run cargo fmt --all -- --check.
          8. Run the relevant cargo tests.
          9. Run cargo test when practical.
          10. Review the final git diff for accidental or unrelated changes.
          11. Do NOT create a branch.
          12. Do NOT commit.
          13. Do NOT push.
          14. Do NOT create a pull request.

          The surrounding GitHub Actions workflow will handle branch creation,
          commit, push, and pull-request creation after you finish.

          If the issue is ambiguous, do not invent requirements.
          Make only changes supported by the issue and repository context.

          Leave the working tree containing the completed implementation and tests.
          OPENCODE_PROMPT

          python3 - "$PROMPT_FILE" "$GITHUB_REPOSITORY" "$ISSUE_NUMBER" "$ISSUE_URL" "$ISSUE_TITLE" "$ISSUE_BODY" <<'PY'
          import pathlib
          import sys

          path, repository, number, url, title, body = sys.argv[1:]
          text = pathlib.Path(path).read_text()
          replacements = {
              "__REPOSITORY__": repository,
              "__ISSUE_NUMBER__": number,
              "__ISSUE_URL__": url,
              "__ISSUE_TITLE__": title,
              "__ISSUE_BODY__": body,
          }
          for key, value in replacements.items():
              text = text.replace(key, value)
          pathlib.Path(path).write_text(text)
          PY

          cd -- "$GITHUB_WORKSPACE"

          echo "::group::OpenCode invocation"
          printf 'cwd=%q\n' "$PWD"
          printf 'prompt_file=%q\n' "$PROMPT_FILE"
          printf 'prompt_bytes=%s\n' "$(wc -c < "$PROMPT_FILE")"
          printf 'prompt_lines=%s\n' "$(wc -l < "$PROMPT_FILE")"
          printf 'provider=%q\n' 'freellmapi'
          printf 'model=%q\n' 'freellmapi/auto'
          printf 'timeout=%s minutes\n' '35'
          echo 'command=timeout 35m opencode run --standalone --model freellmapi/auto --auto <prompt>'
          echo "::endgroup::"

          set +e
          timeout 35m opencode run \
            --standalone \
            --model 'freellmapi/auto' \
            --auto \
            "$(cat "$PROMPT_FILE")" \
            2>&1 | tee "$OUTPUT_FILE"
          PIPE_STATUS=("${PIPESTATUS[@]}")
          set -e

          OPENCODE_STATUS="${PIPE_STATUS[0]:-125}"
          TEE_STATUS="${PIPE_STATUS[1]:-125}"

          if [ "$OPENCODE_STATUS" -eq 124 ]; then
            TIMEOUT_STATUS='timed_out'
          else
            TIMEOUT_STATUS='not_timed_out'
          fi

          echo "::group::OpenCode exit diagnostics"
          printf 'opencode_exit_status=%s\n' "$OPENCODE_STATUS"
          printf 'tee_exit_status=%s\n' "$TEE_STATUS"
          printf 'timeout_status=%s\n' "$TIMEOUT_STATUS"
          printf 'output_bytes=%s\n' "$(wc -c < "$OUTPUT_FILE")"
          printf 'output_lines=%s\n' "$(wc -l < "$OUTPUT_FILE")"
          echo 'The following raw output is limited to the last 200 lines.'
          echo 'Secrets are not intentionally printed; GitHub Actions secret masking remains enabled.'
          tail -n 200 "$OUTPUT_FILE"
          echo "::endgroup::"

          echo "::group::Git status after OpenCode"
          git status --short
          echo "::endgroup::"

          echo "::group::Git diff summary after OpenCode"
          git diff --stat
          git diff --cached --stat
          echo "::endgroup::"

          {
            echo "summary<<OPENCODE_FINAL_MESSAGE"
            tail -n 200 "$OUTPUT_FILE"
            echo "OPENCODE_FINAL_MESSAGE"
          } >> "$GITHUB_OUTPUT"

          if [ "$TEE_STATUS" -ne 0 ]; then
            echo "::error::tee failed with status $TEE_STATUS"
            exit "$TEE_STATUS"
          fi

          if [ "$OPENCODE_STATUS" -ne 0 ]; then
            echo "::error::OpenCode/timeout exited with status $OPENCODE_STATUS (timeout_status=$TIMEOUT_STATUS)"
            exit "$OPENCODE_STATUS"
          fi

      - name: Create branch, commit, and push
        id: git
        shell: bash
        env:
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if git diff --quiet && git diff --cached --quiet; then
            echo "No changes were produced by OpenCode."

            gh issue comment "$ISSUE_NUMBER" \
              --repo "$GITHUB_REPOSITORY" \
              --body "OpenCode completed the run but produced no working-tree changes. No pull request was created."

            exit 0
          fi

          BRANCH="opencode/issue-${ISSUE_NUMBER}-${GITHUB_RUN_ID}"

          git switch -c "$BRANCH"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          git diff --cached --check

          git commit -m "fix: resolve issue #${ISSUE_NUMBER}"

          git push --set-upstream origin "$BRANCH"

          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Create pull request
        if: steps.git.outputs.branch != ''
        shell: bash
        env:
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
          ISSUE_TITLE: ${{ steps.issue.outputs.title }}
          BRANCH: ${{ steps.git.outputs.branch }}
          OPENCODE_SUMMARY: ${{ steps.opencode.outputs.summary }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          PR_BODY_FILE="$(mktemp)"
          trap 'rm -f "$PR_BODY_FILE"' EXIT

          cat > "$PR_BODY_FILE" <<EOF
          ## Summary

          OpenCode implemented the requested fix for #${ISSUE_NUMBER}.

          ## Issue

          ${ISSUE_TITLE}

          ## Verification

          OpenCode was instructed to run:

          - cargo fmt --all -- --check
          - relevant cargo tests
          - cargo test when practical

          ## OpenCode output

          ${OPENCODE_SUMMARY}

          Fixes #${ISSUE_NUMBER}
          EOF

          gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base rust \
            --head "$BRANCH" \
            --title "fix: resolve issue #${ISSUE_NUMBER}" \
            --body-file "$PR_BODY_FILE"
