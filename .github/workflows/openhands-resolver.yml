name: Codex Issue Resolver

on:
  issues:
    types: [labeled]

  issue_comment:
    types: [created]

  workflow_dispatch:
    inputs:
      issue_number:
        description: "The issue number you want Codex to resolve"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: read

jobs:
  resolve-issue:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'issues' &&
        github.event.label.name == 'fix-me'
      ) ||
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.pull_request == null &&
        contains(github.event.comment.body, '@openhands-agent')
      )

    runs-on: ${{ vars.TARGET_RUNNER || 'ubuntu-latest' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve issue number
        id: issue
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_ISSUE: ${{ inputs.issue_number }}
          EVENT_ISSUE: ${{ github.event.issue.number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            ISSUE_NUMBER="$DISPATCH_ISSUE"
          else
            ISSUE_NUMBER="$EVENT_ISSUE"
          fi

          if ! [[ "$ISSUE_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "::error::Invalid issue number: $ISSUE_NUMBER"
            exit 1
          fi

          ISSUE_JSON="$(gh issue view "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --json title,body,url)"

          {
            echo "number=$ISSUE_NUMBER"
            echo "title<<CODEX_ISSUE_TITLE"
            printf '%s\n' "$ISSUE_JSON" | jq -r '.title'
            echo "CODEX_ISSUE_TITLE"
            echo "body<<CODEX_ISSUE_BODY"
            printf '%s\n' "$ISSUE_JSON" | jq -r '.body'
            echo "CODEX_ISSUE_BODY"
            echo "url=$(printf '%s\n' "$ISSUE_JSON" | jq -r '.url')"
          } >> "$GITHUB_OUTPUT"

      - name: Validate Codex configuration
        shell: bash
        env:
          LLM_MODEL: "auto"
          CODEX_API_KEY: ${{ secrets.FREELLMAPI_API_KEY }}
        run: |
          set -euo pipefail

          test -n "$LLM_MODEL" || {
            echo "::error::Repository variable LLM_MODEL is not configured"
            exit 1
          }

          test -n "$CODEX_API_KEY" || {
            echo "::error::AWH_AGENT2_NVIDIA_KEY_1 is not configured"
            exit 1
          }

      - name: Run Codex
        id: codex
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.FREELLMAPI_API_KEY }}
          responses-api-endpoint: "https://freellmapi-production-905c.up.railway.app/v1/responses"
          model: auto
          effort: ${{ vars.CODEX_EFFORT || 'high' }}
          permission-profile: ":workspace"
          prompt: |
            You are the coding agent for Agent Workspace Hub (AWH).

            Repository: ${{ github.repository }}
            Target branch: rust
            Issue: #${{ steps.issue.outputs.number }}
            Issue URL: ${{ steps.issue.outputs.url }}

            Issue title:
            ${{ steps.issue.outputs.title }}

            Issue body:
            ---
            ${{ steps.issue.outputs.body }}
            ---

            Your task:
            1. Read the repository architecture and relevant documentation before editing.
            2. Understand the issue and identify the root cause.
            3. Implement the smallest correct production-quality fix.
            4. Preserve existing AWH architecture and Rust conventions.
            5. Do not modify unrelated files.
            6. Add or update focused tests for the change.
            7. Run cargo fmt --all -- --check.
            8. Run the relevant cargo tests, and run cargo test when practical.
            9. Review the final diff for accidental or unrelated changes.
            10. Do NOT create a branch, commit, push, or pull request. The workflow will handle Git operations after you finish.

            If the issue is ambiguous, do not invent requirements. Make only changes that are supported by the repository and issue context.
            Leave the working tree containing the completed fix and tests.

      - name: Create branch, commit, and push
        id: git
        shell: bash
        env:
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if git diff --quiet && git diff --cached --quiet; then
            echo "No changes were produced by Codex."
            gh issue comment "$ISSUE_NUMBER"               --repo "$GITHUB_REPOSITORY"               --body "Codex completed the run but produced no working-tree changes. No pull request was created."
            exit 0
          fi

          BRANCH="codex/issue-${ISSUE_NUMBER}-${GITHUB_RUN_ID}"

          git switch -c "$BRANCH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          git diff --cached --check

          git commit -m "fix: resolve issue #${ISSUE_NUMBER}"
          git push --set-upstream origin "$BRANCH"

          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Create pull request
        if: steps.git.outputs.branch != ''
        shell: bash
        env:
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
          ISSUE_TITLE: ${{ steps.issue.outputs.title }}
          BRANCH: ${{ steps.git.outputs.branch }}
          CODEX_SUMMARY: ${{ steps.codex.outputs.final-message }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          PR_BODY_FILE="$(mktemp)"
          trap 'rm -f "$PR_BODY_FILE"' EXIT

          cat > "$PR_BODY_FILE" <<EOF
          ## Summary

          Codex implemented the requested fix for #${ISSUE_NUMBER}.

          ## Issue

          ${ISSUE_TITLE}

          ## Verification

          Codex was instructed to run:
          - cargo fmt --all -- --check
          - relevant cargo tests
          - cargo test when practical

          ## Codex final message

          ${CODEX_SUMMARY}

          Fixes #${ISSUE_NUMBER}
          EOF

          gh pr create             --repo "$GITHUB_REPOSITORY"             --base rust             --head "$BRANCH"             --title "fix: resolve issue #${ISSUE_NUMBER}"             --body-file "$PR_BODY_FILE"
