name: OpenHands Issue Resolver

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'The issue number you want OpenHands to resolve'
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  resolve-issue:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' && github.event.label.name == 'fix-me') ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request == null &&
       contains(github.event.comment.body, '@openhands-agent'))
    runs-on: ${{ vars.TARGET_RUNNER || 'ubuntu-latest' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Dynamic Issue Context
        id: parse_issue
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "num=${{ github.event.inputs.issue_number }}" >> $GITHUB_OUTPUT
          else
            echo "num=${{ github.event.issue.number }}" >> $GITHUB_OUTPUT
          fi

      - name: Install OpenHands Core Utilities
        run: |
          # Installs the complete openhands environment to resolve missing 'e2b' sub-packages
          pip install openhands-ai

      - name: Run OpenHands Resolver Engine
        env:
          LLM_MODEL: ${{ vars.LLM_MODEL || 'openai/z-ai/glm-5.3' }}
          LLM_BASE_URL: https://nvidia.com
          LLM_API_KEY: ${{ secrets.AWH_AGENT2_NVIDIA_KEY_1 }}
          GITHUB_TOKEN: ${{ secrets.AWH_AUTOMATION_TOKEN }}
          SANDBOX_USER_ID: ${{ github.actor_id }}
          MAX_ITERATIONS: ${{ fromJson(vars.OPENHANDS_MAX_ITER || '50') }}
          TARGET_BRANCH: ${{ vars.TARGET_BRANCH || 'rust' }}
        run: |
          # Executes using the official consolidated repository execution entrypoint
          python -m openhands.resolver.resolve_issue \
            --repo "${{ github.repository }}" \
            --issue-number "${{ steps.parse_issue.outputs.num }}" \
            --issue-type "issue" \
            --max-iterations "$MAX_ITERATIONS" \
            --llm-model "$LLM_MODEL" \
            --llm-api-key "$LLM_API_KEY"
            
