name: OpenHands Issue Resolver

on:
  issues:
    types: [labeled]

  issue_comment:
    types: [created]

  workflow_dispatch:
    inputs:
      issue_number:
        description: "The issue number you want OpenHands to resolve"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  resolve-issue:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'issues' &&
        github.event.label.name == 'fix-me'
      ) ||
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.pull_request == null &&
        contains(github.event.comment.body, '@openhands-agent')
      )

    runs-on: ${{ vars.TARGET_RUNNER || 'ubuntu-latest' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve issue number
        id: issue
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_ISSUE: ${{ inputs.issue_number }}
          EVENT_ISSUE: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            ISSUE_NUMBER="$DISPATCH_ISSUE"
          else
            ISSUE_NUMBER="$EVENT_ISSUE"
          fi

          if ! [[ "$ISSUE_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "::error::Invalid issue number: $ISSUE_NUMBER"
            exit 1
          fi

          echo "number=$ISSUE_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Checkout OpenHands source
        shell: bash
        env:
          OPENHANDS_REF: ${{ vars.OPENHANDS_REF || 'main' }}
        run: |
          set -euo pipefail

          rm -rf "$RUNNER_TEMP/OpenHands"

          git clone --depth 1 --branch "$OPENHANDS_REF"             https://github.com/All-Hands-AI/OpenHands.git             "$RUNNER_TEMP/OpenHands"

          cd "$RUNNER_TEMP/OpenHands"

          echo "OpenHands source:"
          git rev-parse HEAD

      - name: Install OpenHands from source
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip
          python -m pip install -e "$RUNNER_TEMP/OpenHands"

      - name: Verify OpenHands resolver
        shell: bash
        run: |
          set -euo pipefail

          python -c '
          import openhands
          import openhands.resolver.resolve_issue

          print("OpenHands package:", openhands.__file__)
          print("Resolver module:", openhands.resolver.resolve_issue.__file__)
          print("OpenHands resolver: OK")
          '

      - name: Verify Docker
        shell: bash
        run: |
          set -euo pipefail
          docker version
          docker info

      - name: Execute OpenHands resolver
        env:
          REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}

          LLM_MODEL: ${{ vars.LLM_MODEL }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL || 'https://integrate.api.nvidia.com/v1' }}
          MAX_ITERATIONS: ${{ vars.OPENHANDS_MAX_ITER || '50' }}

          LLM_API_KEY: ${{ secrets.AWH_AGENT2_NVIDIA_KEY_1 }}
          GITHUB_TOKEN: ${{ secrets.AWH_AUTOMATION_TOKEN }}

        shell: bash
        run: |
          set -euo pipefail

          test -n "$LLM_MODEL" || {
            echo "::error::Repository variable LLM_MODEL is not configured"
            exit 1
          }

          test -n "$LLM_API_KEY" || {
            echo "::error::AWH_AGENT2_NVIDIA_KEY_1 is not configured"
            exit 1
          }

          test -n "$GITHUB_TOKEN" || {
            echo "::error::AWH_AUTOMATION_TOKEN is not configured"
            exit 1
          }

          echo "=========================================="
          echo "OpenHands Issue Resolver"
          echo "=========================================="
          echo "Repository: $REPOSITORY"
          echo "Issue:      #$ISSUE_NUMBER"
          echo "Model:      $LLM_MODEL"
          echo "Base URL:   $LLM_BASE_URL"
          echo "Iterations: $MAX_ITERATIONS"
          echo "=========================================="

          python -m openhands.resolver.resolve_issue             --repo "$REPOSITORY"             --issue-number "$ISSUE_NUMBER"             --issue-type issue             --max-iterations "$MAX_ITERATIONS"             --llm-model "$LLM_MODEL"             --llm-api-key "$LLM_API_KEY"
