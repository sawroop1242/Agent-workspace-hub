name: External AWH Benchmark Evaluation

on:
  workflow_dispatch:
    inputs:
      benchmark:
        description: "External benchmark to prepare"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - swe-bench
          - swe-smith
          - codeclash
          - sb-cli
  pull_request:
    branches:
      - rust

permissions:
  contents: read

concurrency:
  group: awh-benchmark-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# EXTERNAL EVALUATION BOUNDARY:
# SWE-bench, SWE-smith, CodeClash, and sb-cli are external evaluation
# infrastructure. They are NOT AWH runtime dependencies and must never be
# added to Cargo.toml, Cargo.lock, AWH binaries, or product runtime images.
# This workflow is read-only: it prepares an isolated evaluation workspace,
# records the AWH revision, validates the dependency boundary, and collects
# artifacts. Actual benchmark execution may be attached later through an
# explicitly isolated runner/container without changing AWH itself.

jobs:
  benchmark-preflight:
    name: Benchmark preflight (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Checkout AWH revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Record benchmark boundary
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "benchmark=${{ github.event.inputs.benchmark || 'all' }}"
            echo "revision=$(git rev-parse HEAD)"
            echo "runner_os=${RUNNER_OS}"
            echo "runner_arch=${RUNNER_ARCH}"
            echo "swe-bench=external-only"
            echo "swe-smith=external-only"
            echo "codeclash=external-only"
            echo "sb-cli=external-only"
            echo "AWH-runtime-dependencies=unchanged"
            echo "repository-write=forbidden"
          } | tee benchmark-boundary.txt

      - name: Verify external benchmark tools are not runtime dependencies
        shell: bash
        run: |
          set -euo pipefail
          test -f Cargo.toml
          test -f Cargo.lock

          if grep -Eiq '(swe-bench|swebench|swe-smith|swe_smith|codeclash|sb-cli|mini-swe-agent|swe-agent|swe-rex|openhands)' Cargo.toml Cargo.lock; then
            echo "External benchmark/agent dependency detected in the AWH runtime manifests."
            exit 1
          fi

          echo "AWH runtime contains no prohibited benchmark/agent dependency."

      - name: Verify clean checkout
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"

      - name: Capture AWH revision and dependency graph
        shell: bash
        run: |
          set +e
          {
            echo "=== revision ==="
            git rev-parse HEAD
            git log -5 --oneline
            echo "=== status ==="
            git status --short
            echo "=== Rust ==="
            rustc --version
            cargo --version
            echo "=== Cargo metadata ==="
            cargo metadata --format-version 1
            echo "=== Cargo tree ==="
            cargo tree
          } > benchmark-preflight.txt 2>&1
          cat benchmark-preflight.txt

      - name: Run AWH baseline checks
        id: baseline
        continue-on-error: true
        shell: bash
        run: |
          set +e
          cargo fmt --all -- --check
          fmt_status=$?
          cargo check --all-targets
          check_status=$?
          cargo test --all-targets
          test_status=$?
          cargo clippy --all-targets --all-features -- -D warnings
          clippy_status=$?

          {
            echo "fmt=${fmt_status}"
            echo "check=${check_status}"
            echo "test=${test_status}"
            echo "clippy=${clippy_status}"
          } > benchmark-baseline-status.txt

          exit $((fmt_status || check_status || test_status || clippy_status))

      - name: Prepare isolated evaluation manifest
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p benchmark-evaluation
          cat > benchmark-evaluation/README.md <<'EOF'
          # AWH External Benchmark Boundary

          This directory is evaluation metadata only.

          The following systems are external to AWH:

          - SWE-bench: issue/patch benchmark
          - SWE-smith: task generation / software-engineering evaluation infrastructure
          - CodeClash: long-running goal-oriented software-engineering evaluation
          - sb-cli: external benchmark execution client

          They must run in an isolated evaluation environment and must not be
          added to AWH's Cargo dependencies, binaries, runtime image, or source.

          Results must distinguish benchmark/tool failures from AWH failures.
          EOF

      - name: Capture post-evaluation repository state
        if: always()
        shell: bash
        run: |
          set +e
          git diff --check > benchmark-diff-check.txt 2>&1
          git status --short > benchmark-status.txt 2>&1
          cat benchmark-diff-check.txt
          cat benchmark-status.txt

      - name: Upload benchmark artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: awh-benchmark-${{ matrix.os }}-${{ github.run_id }}
          path: |
            benchmark-boundary.txt
            benchmark-preflight.txt
            benchmark-baseline-status.txt
            benchmark-diff-check.txt
            benchmark-status.txt
            benchmark-evaluation/README.md
          if-no-files-found: ignore
          retention-days: 14

      - name: Enforce read-only benchmark boundary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "Benchmark preflight modified the AWH checkout."
            git status --short
            exit 1
          fi

      - name: Report baseline result
        if: always()
        shell: bash
        run: |
          if [[ "${{ steps.baseline.outcome }}" != "success" ]]; then
            echo "AWH baseline verification failed. Benchmark artifacts were collected."
            exit 1
          fi
          echo "AWH baseline verification passed; external benchmark execution remains isolated from the runtime."
