name: External AWH Agent Repair Verification

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag, or commit to diagnose and verify"
        required: true
        default: "rust"
        type: string
  pull_request:
    branches:
      - rust

permissions:
  contents: read

concurrency:
  group: awh-agent-repair-${{ github.workflow }}-${{ github.event.pull_request.number || github.event.inputs.ref || github.ref }}
  cancel-in-progress: true

# This workflow is read-only. It diagnoses and re-verifies the checked-out
# revision. It does not push fixes, create branches, modify repository state,
# or add external agent tooling to AWH.

jobs:
  verify:
    name: Diagnose / verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Checkout requested revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Capture environment
        shell: bash
        run: |
          set +e
          {
            echo "=== revision ==="
            git rev-parse HEAD
            git status --short
            echo "=== branch ==="
            git branch --show-current
            echo "=== recent commits ==="
            git log -5 --oneline
            echo "=== rust ==="
            rustc --version
            cargo --version
            echo "=== platform ==="
            uname -a 2>/dev/null || true
          } > repair-environment.txt 2>&1
          cat repair-environment.txt

      - name: Diagnose repository diff
        shell: bash
        run: |
          set +e
          git diff --check > diff-check.txt 2>&1
          git status --short > status.txt 2>&1
          git diff --stat > diff-stat.txt 2>&1
          cat diff-check.txt
          cat status.txt
          cat diff-stat.txt

      - name: Format verification
        id: fmt
        continue-on-error: true
        run: cargo fmt --all -- --check

      - name: Cargo check
        id: check
        continue-on-error: true
        run: cargo check --all-targets

      - name: Test suite
        id: test
        continue-on-error: true
        run: cargo test --all-targets

      - name: Clippy verification
        id: clippy
        if: runner.os == 'Linux'
        continue-on-error: true
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Dependency audit
        id: audit
        if: runner.os == 'Linux'
        continue-on-error: true
        run: |
          cargo install --locked cargo-audit
          cargo audit

      - name: Capture Cargo metadata
        if: always()
        shell: bash
        run: |
          set +e
          cargo metadata --format-version 1 > cargo-metadata.json 2> cargo-metadata.stderr
          cargo tree > cargo-tree.txt 2>&1
          cat cargo-metadata.stderr

      - name: Capture failed test/build diagnostics
        if: always()
        shell: bash
        run: |
          set +e
          {
            echo "=== workflow result ==="
            echo "fmt=${{ steps.fmt.outcome }}"
            echo "check=${{ steps.check.outcome }}"
            echo "test=${{ steps.test.outcome }}"
            echo "clippy=${{ steps.clippy.outcome }}"
            echo "audit=${{ steps.audit.outcome }}"
            echo "=== git status ==="
            git status --short
          } > repair-summary.txt
          cat repair-summary.txt

      - name: Upload repair diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: awh-repair-diagnostics-${{ matrix.os }}-${{ github.run_id }}
          path: |
            repair-environment.txt
            diff-check.txt
            status.txt
            diff-stat.txt
            cargo-metadata.json
            cargo-metadata.stderr
            cargo-tree.txt
            repair-summary.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Fail if required verification failed
        if: always()
        shell: bash
        run: |
          if [[ "${{ steps.fmt.outcome }}" != "success" ||
                "${{ steps.check.outcome }}" != "success" ||
                "${{ steps.test.outcome }}" != "success" ]]; then
            echo "Required Rust verification failed. See uploaded repair diagnostics."
            exit 1
          fi

          if [[ "${{ runner.os }}" == "Linux" &&
                ("${{ steps.clippy.outcome }}" != "success" ||
                 "${{ steps.audit.outcome }}" != "success") ]]; then
            echo "Linux repair verification failed. See uploaded repair diagnostics."
            exit 1
          fi
