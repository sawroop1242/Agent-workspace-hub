version: 1
product: agent-workspace-hub
base_branch: rust
source_of_truth:
  roadmap: docs/PROJECT_ROADMAP.md
  status: docs/PROJECT_ROADMAP_STATUS.md
  verification: .github/agent/verification.md

# External agent infrastructure must not become AWH runtime dependencies.
runtime_boundary:
  external_only:
    - mini-swe-agent
    - SWE-ReX
    - SWE-bench
    - SWE-smith

features:
  - id: workspace.agent-grade-editing
    phase: 2
    priority: P0
    status: incomplete
    description: Complete the AWE agent-grade editing pipeline from canonical edit transactions through safe mutation, atomic verification, snapshots, provenance, audit, rollback, CLI/MCP adapters and real-client acceptance.
    issues:
      - AWE-001
      - AWE-002
      - AWE-003
      - AWE-004
      - AWE-005
      - AWE-006
      - AWE-007
      - AWE-008
      - AWE-009
      - AWE-010
      - AWE-011
      - AWE-012
      - AWE-013
      - AWE-014
      - AWE-015
      - AWE-016
      - AWE-017
      - AWE-018
    issue_contract:
      AWE-001:
        requirement: "Define one canonical edit transaction model containing target files, operation, expected state/context, validation requirements and execution metadata."
        acceptance: "A valid edit request can be represented by one canonical transaction without transport-specific fields being required."
        verification:
          - "rust: unit tests cover construction and serialization of the canonical transaction"
          - "integration: MCP and CLI requests normalize to the same transaction shape"
      AWE-002:
        requirement: "Implement deterministic target/file resolution before any mutation."
        acceptance: "Every target resolves to an allowed workspace file or the transaction fails before mutation; ambiguous or missing targets are rejected."
        verification:
          - "rust: target-resolution tests cover missing, ambiguous and valid paths"
          - "security: traversal/out-of-workspace targets are rejected"
      AWE-003:
        requirement: "Validate edit operations and enforce preconditions before preparation."
        acceptance: "Malformed operations, invalid ranges and unmet preconditions fail before any file content changes."
        verification:
          - "rust: invalid-operation and invalid-range tests"
          - "integration: failed validation leaves repository bytes unchanged"
      AWE-004:
        requirement: "Perform expected-state/context checks to detect stale or conflicting edits."
        acceptance: "A stale expected hash/context or conflicting current state produces a deterministic conflict result and zero mutation."
        verification:
          - "integration: stale-state conflict test"
          - "security: conflict path cannot bypass precondition checks"
      AWE-005:
        requirement: "Prepare all edits before applying any mutation, including multi-file transactions."
        acceptance: "Preparation completes for every target before the first mutation; any preparation failure leaves every target unchanged."
        verification:
          - "integration: injected preparation failure proves zero partial writes"
          - "rust: multi-file preparation/ordering tests"
      AWE-006:
        requirement: "Create recoverable snapshots of the original state immediately before mutation."
        acceptance: "Every mutating transaction has a snapshot sufficient to restore the exact pre-edit bytes and relevant metadata."
        verification:
          - "rust: snapshot creation/restoration tests"
          - "integration: snapshot exists before the first applied mutation"
      AWE-007:
        requirement: "Apply prepared edits atomically and safely within the authorized workspace."
        acceptance: "Only prepared, authorized targets are mutated and a successful apply produces the intended bytes."
        verification:
          - "rust: apply success/failure tests"
          - "security: unauthorized paths and capability-denied mutations are blocked"
      AWE-008:
        requirement: "Verify the resulting state immediately after mutation."
        acceptance: "Verification runs against the post-apply state and a failed verification is represented as a failed transaction requiring the defined recovery path."
        verification:
          - "integration: post-apply verification failure test"
          - "rust: verification result/state-transition tests"
      AWE-009:
        requirement: "Restore the exact original state through deterministic rollback."
        acceptance: "Rollback after an edit restores byte-identical file contents and the transaction reports rollback success or failure explicitly."
        verification:
          - "integration: apply -> verify -> rollback byte-identity test"
          - "rust: rollback/state-transition tests"
      AWE-010:
        requirement: "Record provenance linking the edit transaction to workspace, agent/session, targets, snapshot and verification outcome."
        acceptance: "A completed transaction has sufficient provenance to reconstruct what was requested, what changed, and what verification occurred."
        verification:
          - "rust: provenance serialization/linkage tests"
          - "integration: transaction artifact contains required provenance fields"
      AWE-011:
        requirement: "Emit an auditable record for validation, conflict, apply, verify and rollback outcomes."
        acceptance: "Each terminal transaction outcome has an ordered audit trail with no secret material persisted."
        verification:
          - "integration: audit-event sequence tests"
          - "security: secret-redaction tests"
      AWE-012:
        requirement: "Return deterministic edit results and failure classifications to callers."
        acceptance: "Success, validation failure, conflict, verification failure and rollback failure are distinguishable without parsing free-form logs."
        verification:
          - "rust: result/error enum tests"
          - "integration: MCP and CLI return equivalent classifications"
      AWE-013:
        requirement: "Expose the canonical edit service through the MCP adapter without duplicating mutation logic."
        acceptance: "MCP operations invoke the same canonical service and preserve transaction, safety, provenance and result semantics."
        verification:
          - "integration: MCP read -> minimal edit -> verify flow"
          - "compatibility: MCP schema/response contract test"
      AWE-014:
        requirement: "Expose the canonical edit service through the CLI adapter without duplicating mutation logic."
        acceptance: "CLI operations invoke the same canonical service and produce equivalent outcomes to MCP for equivalent requests."
        verification:
          - "integration: CLI edit/verify/conflict tests"
          - "compatibility: MCP-vs-CLI equivalence test"
      AWE-015:
        requirement: "Enforce capability and workspace authorization at the canonical edit boundary."
        acceptance: "Denied capabilities, out-of-scope paths and unauthorized mutation attempts are rejected before mutation."
        verification:
          - "security: authorization-denial tests"
          - "integration: capability enforcement is identical across MCP and CLI"
      AWE-016:
        requirement: "Make edit state transitions observable and deterministic across success, conflict, failure and rollback paths."
        acceptance: "Every transaction has a valid state progression with no illegal transition or ambiguous terminal state."
        verification:
          - "rust: state-machine transition/property tests"
          - "integration: success/conflict/failure/rollback lifecycle tests"
      AWE-017:
        requirement: "Verify real-client interoperability against the complete safe editing workflow."
        acceptance: "A real MCP client can read a file, perform a minimal edit, verify the result, trigger a conflict or rollback path, and observe deterministic results."
        verification:
          - "compatibility: real MCP client acceptance test"
          - "integration: read -> edit -> verify -> conflict/rollback scenario"
      AWE-018:
        requirement: "Make the complete AWE editing contract reproducible in CI with deterministic regression gates."
        acceptance: "The complete AWE-001 through AWE-017 contract is covered by repeatable automated checks and failures identify the violated contract."
        verification:
          - "rust: cargo fmt/check/test/clippy gates"
          - "integration: AWE transaction regression suite"
          - "security: cargo audit when enabled"
          - "compatibility: MCP/CLI and real-client acceptance suite"

    acceptance_contract:
      transaction: "validate -> expected-state/context check -> prepare -> snapshot -> apply -> verify -> provenance/audit -> result -> optional rollback"
      safety_invariant: "invalid/conflict -> zero mutation"
      rollback_invariant: "apply/edit -> verify -> rollback -> byte-identical original state"
      multi_file_invariant: "preparation failure -> all files unchanged"
      transport_invariant: "MCP and CLI use the same canonical edit service"
      interoperability_gate: "real MCP clients must exercise read -> minimal edit -> verify -> conflict/rollback"
    depends_on:
      - workspace.filesystem
      - snapshots.provenance
      - audit.observability
      - capabilities.unified-enforcement
    interfaces: [mcp, cli]
    verification: [rust, integration, security, compatibility]

  - id: git.first-class-worktrees
    phase: 3
    priority: P0
    status: incomplete
    description: AWH-managed isolated worktree lifecycle linked to agent, session, workspace and branch.
    depends_on: [git.service, sessions.agent-management]
    interfaces: [mcp, cli, tui]
    verification: [rust, integration, cross-platform]

  - id: capabilities.unified-enforcement
    phase: 4
    priority: P0
    status: incomplete
    description: One capability and policy decision path across filesystem, Git, process, network, MCP and secrets.
    depends_on: [sessions.agent-management]
    interfaces: [mcp, cli, control-api]
    verification: [rust, security, integration]

  - id: provenance.unified-runtime
    phase: 5
    priority: P1
    status: incomplete
    description: Connect agent/session/workspace/worktree/tool/capability/snapshot/Git/audit state into one provenance model.
    depends_on: [snapshots.provenance, audit.observability, capabilities.unified-enforcement]
    interfaces: [mcp, cli, tui, control-api]
    verification: [rust, integration, security]

  - id: tui.runtime-control-center
    phase: 11
    priority: P1
    status: incomplete
    description: Make the TUI a live control center over the unified AWH runtime state.
    depends_on: [provenance.unified-runtime]
    interfaces: [tui]
    verification: [rust, integration]

  - id: collaboration.multi-agent
    phase: 12
    priority: P2
    status: incomplete
    description: Agent handoff, ownership, conflict detection, isolated worktrees and merge events.
    depends_on: [git.first-class-worktrees, provenance.unified-runtime]
    interfaces: [mcp, cli, tui, control-api]
    verification: [rust, integration, security]

  - id: control-api.contract-hardening
    phase: 13
    priority: P2
    status: incomplete
    description: Stabilize Control API contracts, scoped authorization, domain APIs and event streaming.
    depends_on: [capabilities.unified-enforcement, provenance.unified-runtime]
    interfaces: [control-api]
    verification: [rust, integration, security]

  - id: remote.secure-operations
    phase: 14
    priority: P2
    status: incomplete
    description: Complete secure remote workspace/session operations, synchronization, recovery and audit/control experience.
    depends_on: [control-api.contract-hardening, provenance.unified-runtime]
    interfaces: [control-api, mcp, tui]
    verification: [rust, integration, security, cross-platform]

  - id: ecosystem.client-verification
    phase: 15
    priority: P2
    status: incomplete
    description: Verify interoperability with external coding agents and MCP clients without making them runtime dependencies.
    depends_on: [capabilities.unified-enforcement, control-api.contract-hardening]
    interfaces: [mcp]
    verification: [integration, compatibility]

  - id: advanced.sandbox-adapters
    phase: 16
    priority: P2
    status: incomplete
    description: Demand-driven Docker/WASM/platform sandbox adapters, advanced secrets, remote execution and enterprise controls.
    depends_on: [capabilities.unified-enforcement, remote.secure-operations]
    interfaces: [mcp, cli, control-api]
    verification: [security, integration, cross-platform]

# The agent must never reinterpret benchmark results as product requirements.
evaluation:
  deterministic_gate:
    - cargo fmt --all -- --check
    - cargo check --all-targets
    - cargo test --all-targets
    - cargo clippy --all-targets --all-features -- -D warnings
  optional_security:
    - cargo audit
  external:
    - SWE-bench
    - SWE-smith
