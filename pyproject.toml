[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-workspace-hub"
version = "0.1.0"
description = "Local-first AI agent workspace with TUI, FastMCP, Composio plugins, and skill_hub.ai skills"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Agent Workspace Hub Team", email = "team@awh.dev"}
]
keywords = ["mcp", "composio", "agent-workspace", "tui", "textual", "skill-hub", "fastmcp", "ai-agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Framework :: AsyncIO",
    "Environment :: Console :: Curses",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "fastmcp>=2.0.0",
    "textual>=0.85.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "gitpython>=3.1.40",
    "httpx>=0.27.0",
    "starlette>=0.40.0",
    "uvicorn>=0.30.0",
    "watchdog>=4.0.0",
    "platformdirs>=4.0.0",
    "keyring>=25.0.0",
    "cryptography>=42.0.0",
    "python-dateutil>=2.9.0",
]

[project.optional-dependencies]
composio = ["composio>=0.7.0"]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0", "ruff>=0.6.0", "mypy>=1.10.0"]
all = ["agent-workspace-hub[composio,dev]"]

[project.scripts]
awh = "agent_workspace_hub.__main__:main"

[project.urls]
Homepage = "https://github.com/agent-workspace-hub/awh"
Documentation = "https://docs.awh.dev"
Repository = "https://github.com/agent-workspace-hub/awh.git"
Issues = "https://github.com/agent-workspace-hub/awh/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_workspace_hub"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[tool.hatch.build.targets.sdist]
include = ["src/", "docs/", "scripts/", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]
